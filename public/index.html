function aiTurn(G, pi, difficulty='normal'){
  let s=G;
  const p=()=>s.players[pi];
  const opp=()=>s.players[1-pi];

  // ── ドロー ──
  const handRecs=p().hand.filter(c=>c._isRec);
  const zIds=new Set(p().ingZone.map(z=>z.id));
  const handIngIds=new Set(p().hand.filter(c=>!c._isRec).map(c=>c.id));
  const ingShortage=handRecs.reduce((acc,rec)=>{
    rec.req.forEach(r=>{if(!zIds.has(r)&&!handIngIds.has(r))acc++;});
    return acc;
  },0);
  const recH=p().hand.filter(c=>c._isRec).length;

  if(difficulty==='easy'){
    // かんたん：手札にレシピがあれば食材、なければレシピ（単純判断）
    const hasRec=p().hand.some(c=>c._isRec);
    if(hasRec&&p().ingDeck.length) s=drawI(s,pi,1);
    else if(p().recDeck.length) s=drawR(s,pi,1);
    else if(p().ingDeck.length) s=drawI(s,pi,1);
  } else {
    // ふつう/むずかしい：不足食材計算で判断
    if(p().ingDeck.length&&(ingShortage>0||recH>p().hand.filter(c=>!c._isRec).length||!p().recDeck.length))
      s=drawI(s,pi,1);
    else if(p().recDeck.length) s=drawR(s,pi,1);
    else if(p().ingDeck.length) s=drawI(s,pi,1);
  }

  // ── 食材配置 ──
  s={...s,phase:'place'};
  function recipeScore(rec,zone){
    const zoneIds=new Set(zone.map(z=>z.id));
    const have=rec.req.filter(r=>zoneIds.has(r)).length;
    return{rec,have,need:rec.req.length,short:rec.req.length-have};
  }
  function getBestPlacements(){
    const ap=p();
    const recs=ap.hand.filter(c=>c._isRec);
    const zone=ap.ingZone;
    if(difficulty==='easy'){
      // かんたん：手札の食材を全部置く（戦略なし）
      return ap.hand.filter(c=>!c._isRec);
    }
    if(!recs.length) return ap.hand.filter(c=>!c._isRec);
    const recScores=recs.map(r=>recipeScore(r,zone)).sort((a,b)=>a.short-b.short);
    const placed=new Set();
    const result=[];
    for(const rs of recScores){
      const zoneIds=new Set(ap.ingZone.map(z=>z.id).concat(result.map(c=>c.id)));
      for(const reqId of rs.rec.req){
        if(zoneIds.has(reqId))continue;
        const card=ap.hand.find(c=>!c._isRec&&c.id===reqId&&!placed.has(c._uid));
        if(card){placed.add(card._uid);result.push(card);}
      }
    }
    for(const c of ap.hand.filter(c=>!c._isRec&&!placed.has(c._uid))){
      if(ap.ingZone.length+result.length>=7)break;
      result.push(c);placed.add(c._uid);
    }
    return result;
  }
  for(const c of getBestPlacements()){
    const ap=p();if(ap.ingZone.length>=7)break;
    s=addLog(ovP(s,pi,{
      hand:s.players[pi].hand.filter(x=>x._uid!==c._uid),
      ingZone:[...s.players[pi].ingZone,{...c,_satBuff:0,_used:false,_placedThisTurn:true}]
    }),`AI: ${c.name}を配置`,'ai-log');
  }

  // ── 起動 ──
  s={...s,phase:'activate'};
  const ap2=p();
  if(!ap2.activatedThisTurn){
    // むずかしい：起動効果の有効性を判断して選ぶ
    const candidates=ap2.ingZone.filter(c=>!c._used&&ING_FN[c.id]);
    let target=null;
    if(difficulty==='hard'&&candidates.length>0){
      // 有効な起動を優先（唐辛子は相手が提供できる状況なら優先）
      target=candidates.find(c=>c.id==='chili'&&opp().ingZone.length>=2)
        ||candidates[0];
    } else if(difficulty==='easy'){
      // かんたん：80%の確率で発動（少し忘れることがある）
      target=Math.random()<0.8?candidates[0]:null;
    } else {
      target=candidates[0];
    }
    if(target){
      const iz=s.players[pi].ingZone.map(x=>x._uid===target._uid?{...x,_used:true}:x);
      s=ovP(s,pi,{ingZone:iz,activatedThisTurn:true});
      try{s=ING_FN[target.id](s,pi);}catch(e){}
      s=addLog(s,`AI: ${target.name}の効果発動`,'ai-log');
    }
  }

  // ── 料理提供 ──
  s={...s,phase:'serve'};
  if(!(s.firstTurn&&s.turn===1)){
    if(p().debuffs&&p().debuffs.noServe){
      const db={...p().debuffs,noServe:0};
      s=ovP(s,pi,{debuffs:db});
    } else {
      let served=true;
      while(served){
        served=false;
        const sp=p();
        const zoneIds=sp.ingZone.map(z=>z.id);
        const oppSat=opp().satiety;
        const opts=sp.hand.filter(c=>c._isRec&&c.req.every(r=>zoneIds.includes(r))).map(rec=>{
          const iu=rec.req.map(r=>sp.ingZone.find(z=>z.id===r)?._uid).filter(Boolean);
          if(iu.length!==rec.req.length)return null;
          const gain=rec.sat+(sp.bufNextRec||0);
          let priority;
          if(difficulty==='easy'){
            // かんたん：順番通りに出す（優先度計算なし）
            priority=1;
          } else if(difficulty==='hard'){
            // むずかしい：トドメ・大ダメージを最優先、効率も考慮
            const isKill=oppSat+gain>=20;
            priority=isKill?99999:oppSat>=14?gain*15:(gain*gain/rec.req.length);
          } else {
            // ふつう
            priority=oppSat>=16?gain*10:(gain/rec.req.length);
          }
          return{rec,iu,gain,priority};
        }).filter(Boolean).sort((a,b)=>b.priority-a.priority);
        if(!opts.length)break;
        // かんたん：20%の確率で提供しない
        if(difficulty==='easy'&&Math.random()<0.2)break;
        const b=opts[0];
        s=addLog(s,`AI: 【${b.rec.name}】を提供！`,'ai-log');
        s=serveRecipe(s,pi,b.rec._uid,b.iu);
        served=true;if(s.winner!=null)return s;
      }
    }
  }

  // ── 廃棄 ──
  s={...s,phase:'discard'};
  const dp=p();
  const wantedIds=new Set(dp.hand.filter(c=>c._isRec).flatMap(r=>r.req));
  const zoneIdsSet=new Set(dp.ingZone.map(z=>z.id));
  if(difficulty==='easy'){
    // かんたん：手札8枚以上になったらランダムに1枚廃棄
    if(dp.hand.length>=8){
      const dis=dp.hand[Math.floor(Math.random()*dp.hand.length)];
      if(dis)s=addLog(ovP(s,pi,{
        hand:s.players[pi].hand.filter(c=>c._uid!==dis._uid),
        trash:[...s.players[pi].trash,dis]
      }),`AI: ${dis.name}を廃棄`,'ai-log');
    }
  } else if(difficulty==='hard'){
    // むずかしい：積極的に廃棄（手札5枚以上でも不要牌を捨てる）
    const threshold=5;
    if(dp.hand.length>=threshold){
      const dis=dp.hand.find(c=>!c._isRec&&!wantedIds.has(c.id)&&!zoneIdsSet.has(c.id))
        ||dp.hand.find(c=>!c._isRec&&!wantedIds.has(c.id))
        ||(dp.hand.length>=8?dp.hand[dp.hand.length-1]:null);
      if(dis)s=addLog(ovP(s,pi,{
        hand:s.players[pi].hand.filter(c=>c._uid!==dis._uid),
        trash:[...s.players[pi].trash,dis]
      }),`AI: ${dis.name}を廃棄`,'ai-log');
    } else if(dp.ingZone.length>3){
      const dis=dp.ingZone.find(c=>!wantedIds.has(c.id));
      if(dis)s=addLog(ovP(s,pi,{
        ingZone:s.players[pi].ingZone.filter(c=>c._uid!==dis._uid),
        trash:[...s.players[pi].trash,dis]
      }),`AI: 食材ゾーンの${dis.name}を廃棄`,'ai-log');
    }
  } else {
    // ふつう
    if(dp.hand.length>=6){
      const dis=dp.hand.find(c=>!c._isRec&&!wantedIds.has(c.id)&&!zoneIdsSet.has(c.id))
        ||dp.hand.find(c=>!c._isRec&&!wantedIds.has(c.id))
        ||(dp.hand.length>=9?dp.hand[dp.hand.length-1]:null);
      if(dis)s=addLog(ovP(s,pi,{
        hand:s.players[pi].hand.filter(c=>c._uid!==dis._uid),
        trash:[...s.players[pi].trash,dis]
      }),`AI: ${dis.name}を廃棄`,'ai-log');
    } else if(dp.ingZone.length>4){
      const dis=dp.ingZone.find(c=>!wantedIds.has(c.id));
      if(dis)s=addLog(ovP(s,pi,{
        ingZone:s.players[pi].ingZone.filter(c=>c._uid!==dis._uid),
        trash:[...s.players[pi].trash,dis]
      }),`AI: 食材ゾーンの${dis.name}を廃棄`,'ai-log');
    }
  }
  return s;
}

// ============================================================
// AI PENDING AUTO-RESOLVE（強化版）
// ============================================================
function aiResolvePending(G, pi) {
  const pd = G.pending;
  if (!pd || pd.pi !== pi) return G;
  const p = G.players[pi];
  const opp = G.players[1 - pi];
  let chosen = ['skip'];

  // filterKey または filter を使って候補を絞る
  function filterCands(cards){
    if(pd.filter){try{return cards.filter(c=>pd.filter(c));}catch(e){}}
    const k=pd.filterKey;
    if(!k)return cards;
    if(k==='ingredient')return cards.filter(c=>!c._isRec);
    if(k==='recipe')return cards.filter(c=>c._isRec);
    if(k==='protein'||k==='protein_ing')return cards.filter(c=>c.cat==='protein'&&!c._isRec);
    if(k==='carb'||k==='carb_ing')return cards.filter(c=>c.cat==='carb'&&!c._isRec);
    if(k==='fat'||k==='fat_ing')return cards.filter(c=>c.cat==='fat'&&!c._isRec);
    if(k==='vitamin'||k==='vitamin_ing')return cards.filter(c=>c.cat==='vitamin'&&!c._isRec);
    if(k==='mineral'||k==='mineral_ing')return cards.filter(c=>c.cat==='mineral'&&!c._isRec);
    return cards;
  }

  const wantedIds=new Set(p.hand.filter(c=>c._isRec).flatMap(r=>r.req));

  if(pd.source==='hand'||!pd.source&&(pd.type==='discardHand'||pd.type==='retHand')){
    const cands=filterCands(p.hand.filter(c=>!c._hidden));
    if(!cands.length){chosen=['skip'];}
    else if(pd.type==='retHand'){
      // 手札を山札に戻す：不要な食材を優先して返す
      const dis=cands.find(c=>!c._isRec&&!wantedIds.has(c.id))||cands[0];
      chosen=[dis._uid];
    } else if(pd.type==='discardHand'){
      // 手札を捨てる：不要な食材を優先
      const dis=cands.find(c=>!c._isRec&&!wantedIds.has(c.id))||cands[0];
      if(pd.canSkip&&!dis)chosen=['skip'];
      else if(dis)chosen=[dis._uid];
    } else {
      chosen=[cands[0]._uid];
    }
  } else if(pd.source==='ingZone'||pd.type==='pork_step1'||pd.type==='pork_step2'){
    if(pd.type==='pork_step1'){
      // 豚肉step1：2枚選ぶ
      const cands=p.ingZone;
      if(cands.length>=2)chosen=[cands[0]._uid,cands[1]._uid];
    } else {
      const cands=filterCands(p.ingZone);
      if(cands.length)chosen=[cands[0]._uid];
    }
  } else if(pd.source==='oppIngZone'||pd.type?.startsWith('selectOppZone')){
    // 相手食材ゾーンから選ぶ：相手の完成に最も近いレシピの食材を優先的に除去
    const cands=filterCands(opp.ingZone);
    if(cands.length){
      const oppRecs=opp.hand.filter(c=>c._isRec);
      const oppZoneIds=new Set(opp.ingZone.map(z=>z.id));
      // 各食材が何枚のレシピに貢献しているか
      const scored=cands.map(c=>({
        c,
        score:oppRecs.filter(r=>r.req.includes(c.id)&&r.req.every(id=>oppZoneIds.has(id))).length*10
          +oppRecs.filter(r=>r.req.includes(c.id)).length
      })).sort((a,b)=>b.score-a.score);
      chosen=[scored[0].c._uid];
    }
  } else if(pd.source==='trash'){
    const cands=filterCands(p.trash);
    if(cands.length){
      // ごみ箱回収：最も有用な食材（wantedIds優先）を選ぶ
      const best=cands.find(c=>!c._isRec&&wantedIds.has(c.id))||cands[0];
      chosen=[best._uid];
    }
  } else if(pd.source==='recDeck'){
    const cands=Array.isArray(p.recDeck)?filterCands(p.recDeck):[];
    if(cands.length)chosen=[cands[0]._uid];
  } else if(pd.source==='ingDeck'){
    const cands=Array.isArray(p.ingDeck)?filterCands(p.ingDeck):[];
    if(cands.length)chosen=[cands[0]._uid];
  }

  return resolvePending(G, chosen);
}


function validateDeck(ing,rec){
  const iT=Object.values(ing).reduce((a,b)=>a+b,0);
  const rT=Object.values(rec).reduce((a,b)=>a+b,0);
  const e=[];
  if(iT<30)e.push(`食材デッキ ${iT}/30（あと${30-iT}枚）`);
  if(iT>30)e.push(`食材デッキ ${iT}/30（${iT-30}枚超過）`);
  if(rT<15)e.push(`レシピデッキ ${rT}/15（あと${15-rT}枚）`);
  if(rT>15)e.push(`レシピデッキ ${rT}/15（${rT-15}枚超過）`);
  return e;
}

// SELECTION MODAL COMPONENT
// ============================================================
function SelectionModal({G,onResolve,canOperate}){
  const pd=G.pending;
  const [picked,setPicked]=useState([]);
  if(!pd)return null;

  const pi=pd.pi;
  const multi=pd.multi||1;
  const canSkip=!!pd.canSkip;

  // 選択肢のカード一覧を source から生成
  // filter関数はJSONシリアライズで失われる場合があるため、filterKeyで再解決
  function resolveFilter(c){
    if(!pd.filter&&!pd.filterKey)return true;
    if(pd.filter){try{return pd.filter(c);}catch(e){}}
    const k=pd.filterKey;
    if(!k)return true;
    if(k==='ingredient')return !c._isRec;
    if(k==='recipe')return c._isRec;
    if(k==='protein'||k==='protein_ing')return c.cat==='protein'&&!c._isRec;
    if(k==='carb'||k==='carb_ing')return c.cat==='carb'&&!c._isRec;
    if(k==='fat'||k==='fat_ing')return c.cat==='fat'&&!c._isRec;
    if(k==='vitamin'||k==='vitamin_ing')return c.cat==='vitamin'&&!c._isRec;
    if(k==='mineral'||k==='mineral_ing')return c.cat==='mineral'&&!c._isRec;
    if(k.startsWith('id:')){
      const ids=k.slice(3).split(',');
      return ids.includes(c.id)&&!c._isRec;
    }
    return true;
  }
  // source が未設定の場合（サーバー側game-engineが生成したpendingなど）、typeから推定
  function inferSource(type){
    if(!type)return'hand';
    if(type==='discardHand'||type==='retHand')return'hand';
    if(type.startsWith('selectHand'))return'hand';
    if(type==='trash_to_hand'||type==='trash_to_hand_multi'||type==='trash_to_ingdeck'||type==='trash_to_hand_rec')return'trash';
    if(type.startsWith('selectIngZone')||type==='pork_step1'||type==='markIngZone')return'ingZone';
    if(type.startsWith('selectOppZone'))return'oppIngZone';
    if(type==='searchIngDeck')return'ingDeck';
    if(type==='searchRecDeck')return'recDeck';
    return'hand';
  }
  const resolvedSource=pd.source||inferSource(pd.type);

  let candidates=[];
  const p=G.players[pi];
  const opp=G.players[1-pi];
  // _hiddenカード（相手の隠し手札）は候補から除外
  const visibleHand=p.hand.filter(c=>!c._hidden);
  // pd.candidatesが直接渡されている場合はそれを優先（ingDeck/recDeckがオンライン時に数値になる問題対策）
  if(pd.candidates&&pd.candidates.length){
    candidates=pd.candidates;
  } else if(resolvedSource==='hand')candidates=visibleHand.filter(resolveFilter);
  else if(resolvedSource==='ingZone')candidates=p.ingZone.filter(resolveFilter);
  else if(resolvedSource==='trash')candidates=p.trash.filter(resolveFilter);
  else if(resolvedSource==='oppIngZone')candidates=opp.ingZone.filter(resolveFilter);
  else if(resolvedSource==='recDeck')candidates=Array.isArray(p.recDeck)?p.recDeck.filter(resolveFilter):[];
  else if(resolvedSource==='ingDeck')candidates=Array.isArray(p.ingDeck)?p.ingDeck.filter(resolveFilter):[];

  function toggle(uid_){
    if(!canOperate)return;
    setPicked(prev=>{
      if(prev.includes(uid_))return prev.filter(u=>u!==uid_);
      if(prev.length>=multi)return[...prev.slice(1),uid_];
      return[...prev,uid_];
    });
  }
  function confirm(){
    if(!canOperate)return;
    if(picked.length===0&&!canSkip)return;
    onResolve(picked.length>0?picked:['skip']);
    setPicked([]);
  }
  function skip(){
    if(!canOperate)return;
    onResolve(['skip']);setPicked([]);
  }

  return h('div',{className:'sel-overlay'},
    h('div',{className:'sel-box'},
      h('div',{className:'sel-title'},
        h('span',{style:{fontSize:'10px',color:'var(--goldL)',background:'rgba(180,120,0,.3)',border:'1px solid var(--goldD)',borderRadius:'4px',padding:'2px 8px',marginRight:'8px'}},`P${pi+1}が選択`),
        pd.title||'カードを選択'
      ),
      !canOperate&&h('div',{style:{fontSize:'12px',color:'#f8a040',background:'rgba(200,100,0,.2)',border:'1px solid rgba(200,100,0,.4)',borderRadius:'6px',padding:'6px 10px',marginBottom:'8px',textAlign:'center'}},
        `P${pi+1}の操作番です。P${pi+1}の方が選択してください。`
      ),
      h('div',{className:'sel-desc'},pd.desc||(multi>1?`${multi}枚選んでください`:'1枚選んでください')),
      h('div',{className:'sel-cards',style:{opacity:canOperate?1:0.5,pointerEvents:canOperate?'auto':'none'}},
        candidates.length===0&&h('div',{style:{fontSize:'11px',color:'var(--muted)',padding:'10px'}},'対象のカードがありません'),
        candidates.map(c=>{
          const isRec=c._isRec;
          return h('div',{key:c._uid,
            className:`sel-card${c.cat?' '+c.cat:''}${isRec?' recipe-type':''}${picked.includes(c._uid)?' picked':''}`,
            onClick:()=>toggle(c._uid)},
            h('div',{className:'sc-sub'},isRec?'レシピ':(c.catL||'')),
            h('div',{className:'sc-name'},c.name),
            isRec&&h('div',{className:'sc-sat'},`+${c.sat}`)
          );
        })
      ),
      h('div',{className:'sel-footer'},
        canSkip&&h('span',{className:'sel-skip',onClick:skip,style:{opacity:canOperate?1:0.4,pointerEvents:canOperate?'auto':'none'}},'スキップ（効果なし）'),
        h('button',{className:'btn primary',
          onClick:confirm,
          disabled:!canOperate||(!canSkip&&picked.length<Math.min(multi,candidates.length))},
          canOperate
            ?(picked.length>0?`${picked.length}枚選択中 → 決定`:'決定')
            :`P${pi+1}が操作中...`
        )
      )
    )
  );
}

            return h('div',{key:rid,className:`dp-req-chip${have?' have':''}`},
              ING_NAME[rid]||rid
            );
          })
        )
      ),

      // ingredient category info
      !isRec&&c.cat&&h('div',{className:'dp-section'},
        h('div',{className:'dp-section-title'},'▶ カテゴリ'),
        h('div',{style:{display:'flex',alignItems:'center',gap:'8px'}},
          h('span',{style:{fontSize:'11px',color:catColor,fontWeight:'bold'}},c.catL)
        )
      )
    )
  );
}

// ============================================================
// DECK BUILDER
// ============================================================
function DeckBuilder({onBack,savedDecks,onSaveDecks}){
  const [tab,setTab]=useState('ing');
  const [filter,setFilter]=useState('all');
  const [search,setSearch]=useState('');
  const [recSort,setRecSort]=useState('default'); // 'default'|'sat'|'kana'
  const [ing,setIng]=useState({});
  const [rec,setRec]=useState({});
  const [name,setName]=useState('マイデッキ');
  const [viewSaved,setViewSaved]=useState(false);
  const [showBackConfirm,setShowBackConfirm]=useState(false);
  const [showCodeModal,setShowCodeModal]=useState(false);   // コード発行モーダル
  const [showImportModal,setShowImportModal]=useState(false); // コード読み込みモーダル
  const [importInput,setImportInput]=useState('');
  const [importError,setImportError]=useState('');
  const [copyDone,setCopyDone]=useState(false);
  // 最後に保存した状態のスナップショット（保存後に変更がなければダイアログ不要）
  const [savedSnap,setSavedSnap]=useState(null); // {ing,rec,name} or null

  // 現在の状態が保存済みスナップショットと一致するか
  const isSaved=savedSnap!==null
    &&JSON.stringify(savedSnap.ing)===JSON.stringify(ing)
    &&JSON.stringify(savedSnap.rec)===JSON.stringify(rec)
    &&savedSnap.name===name;
  // デッキが編集されているかどうか（1枚以上あり、かつ未保存）
  const isDirty=(Object.values(ing).some(v=>v>0)||Object.values(rec).some(v=>v>0))&&!isSaved;

  const iT=Object.values(ing).reduce((a,b)=>a+b,0);
  const rT=Object.values(rec).reduce((a,b)=>a+b,0);
  const errs=validateDeck(ing,rec);
  const isOk=!errs.length;

  const iShow=useMemo(()=>ING_DEFS.filter(d=>(filter==='all'||d.cat===filter)&&(!search||d.name.includes(search)||(d.eff||'').includes(search))),[filter,search]);
  const rShow=useMemo(()=>{
    const filtered=REC_DEFS.filter(d=>{
      if(!search)return true;
      if(d.name.includes(search)||(d.eff||'').includes(search))return true;
      const matchIngId=ING_DEFS.find(i=>i.name.includes(search))?.id;
      if(matchIngId&&d.req&&d.req.includes(matchIngId))return true;
      return false;
    });
    // 五十音ソート用の読みマップ（漢字カード）
    const YOMI={
      '卵かけご飯':'たまごかけごはん',
      '焼き鳥':'やきとり',
      'ステーキ':'すてーき',
      'さばの味噌煮':'さばのみそに',
      'ぶり大根':'ぶりだいこん',
      '温野菜サラダ':'おんやさいさらだ',
      '冷やっこ':'ひやっこ',
      'ほうれん草のソテー':'ほうれんそうのそてー',
      '野菜のナムル':'やさいのなむる',
      '揚げ出し豆腐':'あげだしどうふ',
      '牛丼':'ぎゅうどん',
      '豚の生姜焼き':'ぶたのしょうがやき',
      '味噌汁':'みそしる',
      '焼きそば':'やきそば',
      '親子丼':'おやこどん',
      '鮭のムニエル':'さけのむにえる',
      '麻婆豆腐':'まーぼーどうふ',
      '野菜炒め':'やさいいため',
      '豚汁':'とんじる',
      '肉じゃが':'にくじゃが',
      'お好み焼き':'おこのみやき',
      'お子様ランチ':'おこさまらんち',
    };
    function yomi(name){return YOMI[name]||name;}
    if(recSort==='sat')return [...filtered].sort((a,b)=>a.sat-b.sat);
    if(recSort==='kana')return [...filtered].sort((a,b)=>yomi(a.name).localeCompare(yomi(b.name),'ja'));
    return filtered;
  },[search,recSort]);

  function add(id,isR){const dk=isR?rec:ing;const set=isR?setRec:setIng;const cur=dk[id]||0;if(cur>=4)return;const tot=Object.values(dk).reduce((a,b)=>a+b,0);if(tot>=(isR?15:30))return;set({...dk,[id]:cur+1});}
  function rm(id,isR){const dk=isR?rec:ing;const set=isR?setRec:setIng;const cur=dk[id]||0;if(!cur)return;const n={...dk};if(cur===1)delete n[id];else n[id]=cur-1;set(n);}
  function auto(){
    const ni={...ing};const nr={...rec};
    let iN=Object.values(ni).reduce((a,b)=>a+b,0),rN=Object.values(nr).reduce((a,b)=>a+b,0);
    const iP=ING_DEFS.map(d=>d.id),rP=REC_DEFS.map(d=>d.id);
    let a=0;while(iN<30&&a<600){a++;const id=iP[0|Math.random()*iP.length];if((ni[id]||0)<4){ni[id]=(ni[id]||0)+1;iN++;}}
    a=0;while(rN<15&&a<600){a++;const id=rP[0|Math.random()*rP.length];if((nr[id]||0)<4){nr[id]=(nr[id]||0)+1;rN++;}}
    setIng(ni);setRec(nr);
  }
  function save(silent=false){
    const d={name,ingDeck:ing,recDeck:rec,savedAt:new Date().toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})};
    onSaveDecks([...savedDecks,d]);
    setSavedSnap({ing,rec,name});
    if(!silent)alert(`「${name}」を保存しました`);
  }
  function loadD(d){setIng(d.ingDeck);setRec(d.recDeck);setName(d.name);setViewSaved(false);}
  // タイトルへ戻るボタン処理
  function copyCode(){
    const code=encodeDeckCode(name,ing,rec);
    if(!code)return;
    navigator.clipboard.writeText(code).then(()=>{
      setCopyDone(true);setTimeout(()=>setCopyDone(false),2000);
    }).catch(()=>{
      // clipboard API が使えない場合はselect
      const el=document.createElement('textarea');
      el.value=code;document.body.appendChild(el);
      el.select();document.execCommand('copy');
      document.body.removeChild(el);
      setCopyDone(true);setTimeout(()=>setCopyDone(false),2000);
    });
  }
  function doImport(){
    setImportError('');
    const result=decodeDeckCode(importInput);
    if(!result){setImportError('コードが正しくありません。');return;}
    setIng(result.ingDeck);setRec(result.recDeck);setName(result.name);
    setSavedSnap(null);setImportInput('');setShowImportModal(false);
  }
  function handleBack(){
    if(isDirty){setShowBackConfirm(true);}
    else{onBack();}
  }
  function delD(i){onSaveDecks(savedDecks.filter((_,j)=>j!==i));}

  const iEnt=Object.entries(ing).sort(([a],[b])=>(ING_MAP[a]?.cat||'').localeCompare(ING_MAP[b]?.cat||''));
  const rEnt=Object.entries(rec).sort(([a],[b])=>(REC_MAP[b]?.sat||0)-(REC_MAP[a]?.sat||0));
  const cats={protein:0,carb:0,fat:0,vitamin:0,mineral:0};
  iEnt.forEach(([id,n])=>{const d=ING_MAP[id];if(d&&cats[d.cat]!==undefined)cats[d.cat]+=n;});

  if(viewSaved)return h('div',{className:'saved-screen'},
    h('div',{className:'saved-header'},
      h('button',{className:'btn sm',onClick:()=>setViewSaved(false)},'← 戻る'),
      h('span',{style:{fontSize:'13px',color:'var(--goldL)',fontWeight:'bold'}},'保存済みデッキ')
    ),
    h('div',{className:'saved-list'},
      !savedDecks.length&&h('div',{style:{fontSize:'12px',color:'var(--muted)',textAlign:'center',padding:'24px'}},'保存済みデッキがありません'),
      savedDecks.map((d,i)=>h('div',{key:i,className:'saved-item'},
        h('div',{style:{flex:1}},
          h('div',{className:'si-name'},d.name),
          h('div',{className:'si-info'},`食材${Object.values(d.ingDeck).reduce((a,b)=>a+b,0)}枚 / レシピ${Object.values(d.recDeck).reduce((a,b)=>a+b,0)}枚 — ${d.savedAt}`)
        ),
        h('div',{className:'si-btns'},
          h('button',{className:'btn sm',onClick:()=>loadD(d)},'読み込む'),
          h('button',{className:'btn sm danger',onClick:()=>delD(i)},'削除')
        )
      ))
    )
  );

  return h('div',{className:'db-screen'},
    h('div',{className:'db-header'},
      h('div',{className:'db-title'},'デッキ構築'),
      h('div',{className:'db-tabs'},
        h('button',{className:`db-tab${tab==='ing'?' active':''}`,onClick:()=>{setTab('ing');setFilter('all');}},'食材カード'),
        h('button',{className:`db-tab${tab==='rec'?' active':''}`,onClick:()=>{setTab('rec');setFilter('all');}},'レシピカード')
      ),
      h('div',{className:'deck-info'},
        h('span',{className:`deck-count${iT===30?' ok':iT>30?' over':''}`},`食材 ${iT}/30`),
        h('span',{className:`deck-count${rT===15?' ok':rT>15?' over':''}`},`レシピ ${rT}/15`),
        h('input',{className:'deck-name-input',value:name,onChange:e=>setName(e.target.value),placeholder:'デッキ名'})
      )
    ),
    h('div',{className:'db-body'},
      h('div',{className:'card-library'},
        h('div',{className:'lib-filters'},
          tab==='ing'&&['all','protein','carb','fat','vitamin','mineral'].map(f=>
            h('button',{key:f,className:`filter-btn f-${f}${filter===f?' active':''}`,onClick:()=>setFilter(f)},
              f==='all'?'すべて':CAT_LABELS[f]||f)
          ),
          tab==='rec'&&[
            h('span',{key:'cnt',style:{fontSize:'10px',color:'var(--muted)',marginRight:'4px'}},`全${REC_DEFS.length}種`),
            h('span',{key:'lbl',style:{fontSize:'10px',color:'var(--muted)'}},'ソート:'),
            ...[['default','デフォルト'],['sat','満腹度'],['kana','五十音']].map(([v,label])=>
              h('button',{key:v,className:`filter-btn${recSort===v?' active':''}`,
                style:recSort===v?{background:'#7a5020',borderColor:'transparent',color:'#fff'}:{},
                onClick:()=>setRecSort(v)},label)
            ),
          ],
          h('input',{className:'search-input',value:search,onChange:e=>setSearch(e.target.value),placeholder:'カード検索...'})
        ),
        h('div',{className:'card-grid'},
          tab==='ing'&&iShow.map(def=>{
            const cnt=ing[def.id]||0;const mx=cnt>=4||(iT>=30&&!cnt);
            return h('div',{key:def.id,className:`lib-card${cnt?' in-deck':''}${mx?' maxed':''}`,onClick:()=>add(def.id,false),title:def.eff||def.name},
              h('span',{className:`lc-badge badge-${def.cat}`},def.catL),
              h('div',{className:'lc-name'},def.name),
              h('div',{className:'lc-eff'},def.eff||'効果なし'),
              cnt>0&&h('div',{className:'lc-count'},`×${cnt}`),
              !mx&&h('div',{className:'lc-add'},'＋追加')
            );
          }),
          tab==='rec'&&rShow.map(def=>{
            const cnt=rec[def.id]||0;const mx=cnt>=4||(rT>=15&&!cnt);
            return h('div',{key:def.id,className:`lib-card${cnt?' in-deck':''}${mx?' maxed':''}`,onClick:()=>add(def.id,true),title:def.eff||def.name},
              h('span',{className:'lc-badge badge-recipe'},'レシピ'),
              h('div',{className:'lc-name'},def.name),
              h('div',{className:'lc-req'},def.req.map(r=>h('span',{key:r,className:'lc-req-chip'},ING_NAME[r]||r))),
              h('div',{className:'lc-eff'},def.eff||''),
              h('div',{className:'lc-sat'},`+${def.sat}`),
              cnt>0&&h('div',{className:'lc-count'},`×${cnt}`),
              !mx&&h('div',{className:'lc-add'},'＋追加')
            );
          })
        )
      ),
      h('div',{className:'deck-panel'},
        h('div',{className:'deck-section'},
          h('h3',null,'食材デッキ',h('span',null,`${iT}/30`)),
          h('div',{style:{maxHeight:'175px',overflowY:'auto'}},
            iEnt.map(([id,cnt])=>{const d=ING_MAP[id];if(!d)return null;
              return h('div',{key:id,className:'deck-entry'},
                h('div',{className:'cat-dot',style:{background:CAT_COLORS[d.cat]||'#a08060'}}),
                h('div',{className:'de-name'},d.name),
                h('div',{className:'de-cnt'},`×${cnt}`),
                h('button',{className:'de-rm',onClick:()=>rm(id,false)},'－')
              );
            }),
            !iT&&h('div',{style:{fontSize:'10px',color:'#7a6050',padding:'8px'}},'食材カードを追加')
          )
        ),
        h('div',{className:'deck-section'},
          h('h3',null,'レシピデッキ',h('span',null,`${rT}/15`)),
          h('div',{style:{maxHeight:'135px',overflowY:'auto'}},
            rEnt.map(([id,cnt])=>{const d=REC_MAP[id];if(!d)return null;
              return h('div',{key:id,className:'deck-entry'},
                h('div',{className:'cat-dot',style:{background:'#c86820'}}),
                h('div',{className:'de-name'},d.name),
                h('div',{className:'de-cnt'},`×${cnt}`),
                h('div',{className:'de-sat'},`+${d.sat}`),
                h('button',{className:'de-rm',onClick:()=>rm(id,true)},'－')
              );
            }),
            !rT&&h('div',{style:{fontSize:'10px',color:'#7a6050',padding:'8px'}},'レシピカードを追加')
          )
        ),
        h('div',{className:'deck-stats'},
          h('div',{style:{fontSize:'8px',color:'var(--muted)',marginBottom:'5px',letterSpacing:'1px'}},'食材カテゴリ分布'),
          Object.entries(cats).map(([cat,val])=>
            h('div',{key:cat,className:'stat-row'},
              h('div',{className:'stat-label'},CAT_LABELS[cat]),
              h('div',{className:'stat-bar'},h('div',{className:'stat-fill',style:{width:Math.min(100,iT?val/iT*100:0)+'%',background:CAT_COLORS[cat]}})),
              h('div',{className:'stat-num'},val)
            )
          )
        )
      )
    ),
    h('div',{className:'db-footer'},
      h('button',{className:'btn sm',onClick:handleBack},'← タイトル'),
      h('button',{className:'btn sm',onClick:()=>setViewSaved(true)},`保存済み(${savedDecks.length})`),
      h('button',{className:'btn sm',onClick:auto},'オートフィル'),
      h('button',{className:'btn sm danger',onClick:()=>{setIng({});setRec({});}},'クリア'),
      h('div',{className:'sp'}),
      !isOk&&h('span',{className:'validation-msg'},errs[0]),
      isOk&&h('span',{className:'validation-ok'},'✓ デッキ完成'),
      h('button',{className:'btn sm',onClick:()=>setShowImportModal(true)},'📥 コード読込'),
      h('button',{className:'btn sm',onClick:()=>isOk&&setShowCodeModal(true),disabled:!isOk},'📤 コード発行'),
      h('button',{className:'btn sm',onClick:()=>save(false),disabled:!isOk},'保存')
    ),

    // デッキコード発行モーダル
    showCodeModal&&h('div',{className:'trash-modal-overlay',onClick:()=>setShowCodeModal(false)},
      h('div',{className:'trash-modal',style:{maxWidth:'480px'},onClick:e=>e.stopPropagation()},
        h('div',{className:'trash-modal-header'},
          h('h3',null,'📤 デッキコード'),
          h('button',{className:'trash-modal-close',onClick:()=>setShowCodeModal(false)},'✕')
        ),
        h('div',{style:{padding:'14px 16px'}},
          h('div',{style:{fontSize:'11px',color:'var(--muted)',marginBottom:'8px'}},
            'このコードをコピーしてフレンドに共有できます。コードは無期限で有効です。'
          ),
          h('div',{style:{
            fontFamily:'monospace',fontSize:'11px',
            background:'rgba(255,248,220,.8)',border:'1px solid rgba(140,100,40,.3)',
            borderRadius:'5px',padding:'10px 12px',
            wordBreak:'break-all',lineHeight:1.6,color:'#1a1008',
            userSelect:'all',cursor:'text',maxHeight:'120px',overflowY:'auto',
          }},encodeDeckCode(name,ing,rec)||''),
          h('div',{style:{display:'flex',gap:'8px',marginTop:'12px',justifyContent:'flex-end'}},
            h('button',{className:'btn sm',onClick:copyCode},
              copyDone?'✅ コピーしました！':'📋 クリップボードにコピー'
            ),
            h('button',{className:'btn sm',onClick:()=>setShowCodeModal(false)},'閉じる')
          )
        )
      )
    ),

    // デッキコード読み込みモーダル
    showImportModal&&h('div',{className:'trash-modal-overlay',onClick:()=>setShowImportModal(false)},
      h('div',{className:'trash-modal',style:{maxWidth:'480px'},onClick:e=>e.stopPropagation()},
        h('div',{className:'trash-modal-header'},
          h('h3',null,'📥 デッキコードを読み込む'),
          h('button',{className:'trash-modal-close',onClick:()=>setShowImportModal(false)},'✕')
        ),
        h('div',{style:{padding:'14px 16px'}},
          h('div',{style:{fontSize:'11px',color:'var(--muted)',marginBottom:'8px'}},
            'デッキコードを貼り付けてください。現在のデッキは上書きされます。'
          ),
          h('textarea',{
            value:importInput,
            onChange:e=>setImportInput(e.target.value),
            placeholder:'デッキコードをここに貼り付け...',
            style:{
              width:'100%',height:'90px',resize:'vertical',
              fontFamily:'monospace',fontSize:'11px',
              background:'rgba(255,248,220,.8)',border:'1px solid rgba(140,100,40,.3)',
              borderRadius:'5px',padding:'8px 10px',color:'#1a1008',outline:'none',
              fontWeight:'500',
            }
          }),
          importError&&h('div',{style:{fontSize:'11px',color:'#900808',marginTop:'4px',fontWeight:'600'}},
            '⚠ '+importError
          ),
          h('div',{style:{display:'flex',gap:'8px',marginTop:'12px',justifyContent:'flex-end'}},
            h('button',{className:'btn sm primary',onClick:doImport,disabled:!importInput.trim()},'読み込む'),
            h('button',{className:'btn sm',onClick:()=>{setShowImportModal(false);setImportError('');setImportInput('');}},'キャンセル')
          )
        )
      )
    ),

    // 未保存確認ダイアログ
    showBackConfirm&&h('div',{className:'trash-modal-overlay',onClick:()=>setShowBackConfirm(false)},
      h('div',{className:'trash-modal',style:{maxWidth:'360px'},onClick:e=>e.stopPropagation()},
        h('div',{className:'trash-modal-header'},
          h('h3',null,'⚠️ デッキが保存されていません'),
          h('button',{className:'trash-modal-close',onClick:()=>setShowBackConfirm(false)},'✕')
        ),
        h('div',{style:{padding:'16px',fontSize:'13px',color:'var(--text)',lineHeight:1.7}},
          'デッキが保存されていません。保存しますか？'
        ),
        h('div',{style:{display:'flex',gap:'10px',padding:'0 16px 16px',justifyContent:'flex-end'}},
          h('button',{className:'btn sm',onClick:()=>{setShowBackConfirm(false);onBack();}},'保存しない'),
          h('button',{className:'btn sm primary',disabled:!isOk,onClick:()=>{
            if(isOk){save(true);}
            setShowBackConfirm(false);
            onBack();
          }},isOk?'保存する':'保存する（デッキ未完成）')
        )
      )
    )
  );
}

function CoinFlipScreen({first,myPi,onDone}){
  const iFirst=first===myPi;
  const label=iFirst?'⚔️ 先攻！':'🛡️ 後攻！';
  const sub=iFirst?'1ターン目はドロー・料理提供なし':'相手が先に動きます';
  useEffect(()=>{const t=setTimeout(onDone,2200);return()=>clearTimeout(t);},[]);
  return h('div',{className:'coin-flip-screen'},
    h('div',{className:'coin-flip-coin'},'🪙'),
    h('div',{className:'coin-flip-result'},label),
    h('div',{className:'coin-flip-sub'},sub),
    h('div',{className:'coin-flip-bar'},h('div',{className:'coin-flip-bar-fill'}))
  );
}

function MulliganScreen({players,onConfirm,isAI,aiPi=1}){
  const [sel,setSel]=useState([new Set(),new Set()]);
  const [hovered,setHovered]=useState(null);
  useEffect(()=>{
    if(!isAI)return;
    const p=players[aiPi];const ii=new Set(p.hand.filter(c=>!c._isRec).map(c=>c.id));
    const as=new Set(p.hand.filter(c=>c._isRec&&!c.req.some(r=>ii.has(r))).map(c=>c._uid));
    setSel(prev=>{const n=[...prev];n[aiPi]=as;return n;});
  },[]);
  function tog(pi,uid_){if(pi===aiPi&&isAI)return;setSel(prev=>{const n=[...prev];const s=new Set(n[pi]);s.has(uid_)?s.delete(uid_):s.add(uid_);n[pi]=s;return n;});}
  function card(c,pi){
    const sel_=sel[pi].has(c._uid),back=pi===aiPi&&isAI;
    return h('div',{
      key:c._uid,
      className:`mull-card${sel_?' selected':''}${back?' back':''}`,
      onClick:()=>!back&&tog(pi,c._uid),
      onMouseEnter:()=>!back&&setHovered(c),
      onMouseLeave:()=>setHovered(null),
    },
      !back&&[
        h('div',{key:'t',className:'mc-type'},c._isRec?'レシピ':'食材'),
        h('div',{key:'n',className:'mc-name'},c.name),
        c._isRec
          ?h('div',{key:'s',className:'mc-sat'},`+${c.sat}`)
          :h('div',{key:'c',className:'mc-cat',style:{color:CAT_COLORS[c.cat]||''}},c.catL)
      ]
    );
  }
  // プレイヤーのpi（左側に表示）
  const myMullPi=1-aiPi;
  const oppMullPi=aiPi;
  return h('div',{className:'mulligan-screen'},
    h('div',{className:'mull-header'},
      h('h2',null,'🃏 マリガン'),
      h('p',null,'戻したいカードを選択（選択なしでもOK）')
    ),
    h('div',{className:'mull-area'},
      // 自分（プレイヤー）手札 — 左側固定
      h('div',{className:'mull-player'},
        h('h3',null,'あなたの手札'),
        h('div',{className:'mull-hand'},players[myMullPi].hand.map(c=>card(c,myMullPi))),
        h('div',{className:'mull-info'},sel[myMullPi].size?`${sel[myMullPi].size}枚を戻して引き直し`:'変更なし')
      ),
      // 中央プレビュー
      h('div',{className:'mull-preview-wrap',style:{width:'220px',flexShrink:0,display:'flex',flexDirection:'column'}},
        h(CardDetailPanel,{hovered,ingZone:[]})
      ),
      // 相手（AI）手札 — 右側固定
      h('div',{className:`mull-player${isAI?' ai-panel':''}`},
        h('h3',null,isAI?'🤖 AI の手札（非公開）':'相手の手札'),
        h('div',{className:'mull-hand'},players[oppMullPi].hand.map(c=>card(c,oppMullPi))),
        h('div',{className:'mull-info',style:{color:'var(--faint)'}},
          isAI?'AI が自動選択中...':sel[oppMullPi].size?`${sel[oppMullPi].size}枚を戻して引き直し`:'変更なし')
      )
    ),
    h('div',{className:'mull-footer'},
      h('button',{className:'btn primary',onClick:()=>onConfirm(sel)},'マリガン確定 → ゲーム開始')
    )
  );
}

// ============================================================
// GAME SCREEN
// ============================================================
const PHASE_LABELS={draw:'ドロー',place:'食材配置',activate:'起動',serve:'料理提供',discard:'廃棄'};

function GameScreen({initG,isAI,aiPi=1,isOnline=false,myOnlinePi=null,onAction=null,myName='あなた',oppName=null,difficulty='normal'}){
  const [G,setG]=useState(initG);
  const [selH,setSelH]=useState(null);
  const [selZ,setSelZ]=useState([]);
  const [msg,setMsg]=useState('');
  const [aiThink,setAiThink]=useState(false);
  const [hovered,setHovered]=useState(null);
  const [showTrash,setShowTrash]=useState(null);
  const [serveAnim,setServeAnim]=useState(null);
  const [drawAnim,setDrawAnim]=useState(null);
  const [damageAnims,setDamageAnims]=useState([]);
  const [placeFlyAnim,setPlaceFlyAnim]=useState(null); // {name,cat,catL,x,y}
  const [turnBanner,setTurnBanner]=useState(null);     // 'my'|'opp'|null

  // BGM開始
  useEffect(()=>{
    Audio.playBgm('bgm_main');
    return()=>Audio.stopBgm();
  },[]);
  const aiRef=useRef(false);
  const msgRef=useRef(null);
  const prevGRef=useRef(null); // 前フレームのGを保持して変化検出に使う

  // オンラインモードでは myOnlinePi が自分。ローカルは currentPlayer
  // pending中は選択を要求されているプレイヤー（pending.pi）が操作主
  const basePid=isOnline?(myOnlinePi??G.currentPlayer):G.currentPlayer;
  const pid=(!isOnline&&G.pending)?G.pending.pi:basePid;
  const p=G.players[pid];
  // myPiLocal: 画面左側に表示するプレイヤーのpi（常に「自分」）
  const myPiLocal=isOnline?myOnlinePi:(1-aiPi);
  const isAiTurn=isAI&&G.currentPlayer===aiPi;
  const isMyTurn=isOnline?(G.currentPlayer===myOnlinePi):true;

  function showMsg(m){setMsg(m);if(msgRef.current)clearTimeout(msgRef.current);msgRef.current=setTimeout(()=>setMsg(''),2600);}

  // ── G変化を監視して相手（AI・オンライン）の演出を発火 ──
  useEffect(()=>{
    const prev=prevGRef.current;
    prevGRef.current=G;
    if(!prev||G.winner!=null)return;
    const oppPi=1-myPiLocal;
    const prevOpp=prev.players[oppPi];
    const currOpp=G.players[oppPi];
    const prevMe=prev.players[myPiLocal];
    const currMe=G.players[myPiLocal];

    // ターン切り替え検出
    if(prev.currentPlayer!==G.currentPlayer){
      const isMyTurnNow=G.currentPlayer===myPiLocal;
      setTurnBanner(isMyTurnNow?'my':'opp');
      setTimeout(()=>setTurnBanner(null),950);
      Audio.se(isMyTurnNow?'se_turn_start':'se_turn_end');
    }

    // 相手の料理完成検出
    if(currOpp.recZone.length>prevOpp.recZone.length){
      const newRec=currOpp.recZone[currOpp.recZone.length-1];
      if(newRec){
        setServeAnim({name:newRec.name,sat:newRec.sat,icon:newRec.icon||'🍽️'});
        setTimeout(()=>setServeAnim(null),1500);
        Audio.se('se_serve');
      }
    }
    // 自分の満腹度増加検出
    if(currMe.satiety>prevMe.satiety){
      const gain=currMe.satiety-prevMe.satiety;
      const id=Date.now()+Math.random();
      setTimeout(()=>{
        setDamageAnims(prev=>[...prev,{id,val:gain,x:28,y:12,color:'#ff6644'}]);
        setTimeout(()=>setDamageAnims(prev=>prev.filter(d=>d.id!==id)),1200);
      },400);
    }
    // 相手のドロー検出
    const prevOppHandLen=Array.isArray(prevOpp.hand)?prevOpp.hand.length:0;
    const currOppHandLen=Array.isArray(currOpp.hand)?currOpp.hand.length:0;
    if(currOppHandLen>prevOppHandLen){
      setDrawAnim({name:'？',_isRec:false,_hidden:true});
      setTimeout(()=>setDrawAnim(null),550);
      Audio.se('se_draw');
    }
  },[G]);

  // 満腹度変化アニメーション
  function fireDamage(val,targetPi){
    // 相手の満腹度バー位置を推定（右上エリア）
    const x=targetPi===myPiLocal?28:72; // %位置
    const y=12;
    const id=Date.now()+Math.random();
    const color=val>0?'#ff6644':'#44dd88';
    setDamageAnims(prev=>[...prev,{id,val,x,y,color}]);
    setTimeout(()=>setDamageAnims(prev=>prev.filter(d=>d.id!==id)),1200);
  }

  // 料理完成アニメーション
  function fireServe(name,sat,icon){
    setServeAnim({name,sat,icon});
    setTimeout(()=>setServeAnim(null),1500);
  }

  // ドローアニメーション
  function fireDraw(card){
    setDrawAnim(card);
    setTimeout(()=>setDrawAnim(null),550);
  }

  // オンライン: initGが変わったらGを更新
  useEffect(()=>{if(isOnline)setG(initG);},[initG]);
  useEffect(()=>{
    if(isOnline||!isAI||G.winner!=null||aiRef.current)return;
    if(!G.pending)return;
    // pendingがAIの選択を要求している場合は自動解決
    if(G.pending.pi!==aiPi)return;
    aiRef.current=true;
    setTimeout(()=>{
      setG(prev=>{
        if(!prev.pending||prev.pending.pi!==aiPi)return prev;
        let s=aiResolvePending(prev,aiPi);
        s=checkWin(s);
        return s;
      });
      aiRef.current=false;
    },600);
  },[G.pending]);

  useEffect(()=>{
    if(isOnline||!isAiTurn||G.winner!=null||aiRef.current||G.pending)return;
    aiRef.current=true;setAiThink(true);setHovered(null);
    const delay=difficulty==='easy'?1500:difficulty==='hard'?400:900;
    setTimeout(()=>{setG(prev=>{const nx=aiTurn(prev,aiPi,difficulty);return endTurn(nx);});setAiThink(false);aiRef.current=false;},delay);
  },[isAiTurn,G.turn,G.pending]);

  function drawCard(type){
    if(isOnline){onAction&&onAction('draw',{deckType:type});return;}
    if(G.phase!=='draw'||isAiTurn)return;
    const p0=G.players[pid];
    const s=type==='ing'?drawI(G,pid,1):drawR(G,pid,1);
    // 引いたカードを特定してアニメ
    const newCards=s.players[pid].hand.filter(c=>!p0.hand.some(h=>h._uid===c._uid));
    if(newCards.length>0)fireDraw(newCards[0]);
    Audio.se('se_draw');
    setG({...s,phase:'place'});setSelH(null);setSelZ([]);
  }
  // pending 選択完了ハンドラ
  function onPendingResolve(chosen){
    if(isOnline){onAction&&onAction('resolve',{chosen});return;}
    setG(prev=>{
      let s=resolvePending(prev,chosen);
      s=checkWin(s);
      return s;
    });
  }

  function nextPhase(){
    if(isOnline&&!isMyTurn)return;
    if(isOnline){onAction&&onAction('nextPhase');return;}
    if(isAiTurn)return;
    const phases=['draw','place','activate','serve','discard'];
    const idx=phases.indexOf(G.phase);
    // 先攻1ターン目はactivate→serveをスキップしてdiscardへ
    if(G.firstTurn&&G.turn===1&&G.phase==='activate'){
      setG(prev=>({...prev,phase:'discard'}));setSelH(null);setSelZ([]);return;
    }
    // noServeデバフがある場合はserveフェーズをスキップし、noServeを消費
    if(G.phase==='activate'&&G.players[pid]?.debuffs?.noServe){
      setG(prev=>{
        const db={...prev.players[pid].debuffs,noServe:0};
        return {...ovP(prev,pid,{debuffs:db}),phase:'discard'};
      });
      setSelH(null);setSelZ([]);return;
    }
    if(idx<phases.length-1)setG(prev=>({...prev,phase:phases[idx+1]}));
    else{setSelH(null);setSelZ([]);setG(prev=>{Audio.se('se_turn_end');return endTurn(prev);});}
    setSelH(null);setSelZ([]);
  }
  function clickHand(c){
    if(isAiTurn)return;
    if(isOnline&&!isMyTurn)return;
    if(isOnline){
      if(G.phase==='place'&&!c._isRec){onAction&&onAction('place',{cardUid:c._uid});return;}
      if(G.phase==='serve'){if(c._isRec){setSelH(c._uid);setSelZ([]);} return;}
      if(G.phase==='discard'){onAction&&onAction('discard',{cardUid:c._uid,from:'hand'});return;}
      return;
    }
    if(G.phase==='place'&&!c._isRec){
      if(p.ingZone.length>=7){showMsg('食材ゾーンは最大7枚！');return;}
      Audio.se('se_place');
      // 配置アニメ（カードが吸い込まれる）
      setPlaceFlyAnim({name:c.name,cat:c.cat,catL:c.catL});
      setTimeout(()=>setPlaceFlyAnim(null),480);
      setG(prev=>addLog(ovP(prev,pid,{hand:prev.players[pid].hand.filter(x=>x._uid!==c._uid),ingZone:[...prev.players[pid].ingZone,{...c,_placedThisTurn:true,_satBuff:0,_used:false}]}),`P${pid+1}: ${c.name}を配置`));return;
    }
    if(G.phase==='serve'){
      if(c._isRec){setSelH(c._uid);setSelZ([]);} return;
    }
    if(G.phase==='discard'){
      setG(prev=>{
        const next=addLog(ovP(prev,pid,{hand:prev.players[pid].hand.filter(x=>x._uid!==c._uid),trash:[...prev.players[pid].trash,c]}),`P${pid+1}: ${c.name}廃棄`);
        return endTurn(next);
      });
      setSelH(null);setSelZ([]);
      return;
    }
  }
  function clickZone(c,fpi){
    if(isAiTurn||fpi!==pid)return;
    if(isOnline&&!isMyTurn)return;
    if(G.phase==='place'){
      if(isOnline){onAction&&onAction('return',{cardUid:c._uid});return;}
      if(!c._placedThisTurn){showMsg('このターンに配置したカードのみ戻せます');return;}
      setG(prev=>addLog(ovP(prev,pid,{
        ingZone:prev.players[pid].ingZone.filter(x=>x._uid!==c._uid),
        hand:[...prev.players[pid].hand,{...c,_placedThisTurn:false}]
      }),`P${pid+1}: ${c.name}を手札に戻した`));return;
    }
    if(G.phase==='activate'){
      if(c._used){showMsg('起動効果は使用済み');return;}
      if(!ING_FN[c.id]){showMsg(`${c.name}は起動効果なし`);return;}
      if(p.activatedThisTurn){showMsg('起動効果は1ターン1回まで');return;}
      if(isOnline){onAction&&onAction('activate',{cardUid:c._uid});return;}
      const iz=p.ingZone.map(x=>x._uid===c._uid?{...x,_used:true}:x);
      let s=ovP(G,pid,{ingZone:iz,activatedThisTurn:true});
      Audio.se('se_activate');
      try{s=ING_FN[c.id](s,pid);}catch(e){console.error(e);}
      if(!s.pending)s=addLog(s,`P${pid+1}: ${c.name}の効果発動`);
      setG(checkWin(s));return;
    }
    if(G.phase==='serve'&&selH){
      const rec=p.hand.find(x=>x._uid===selH);if(!rec)return;
      const already=selZ.map(u=>p.ingZone.find(x=>x._uid===u)?.id);
      const still=rec.req.filter(r=>!already.includes(r));
      if(!still.includes(c.id)){showMsg(`${c.name}はこのレシピに不要`);return;}
      if(selZ.includes(c._uid)){setSelZ(prev=>prev.filter(u=>u!==c._uid));return;}
      setSelZ(prev=>[...prev,c._uid]);
    }
    if(G.phase==='discard'){
      if(isOnline){onAction&&onAction('discard',{cardUid:c._uid,from:'ingZone'});return;}
      setG(prev=>{
        const next=addLog(ovP(prev,pid,{
          ingZone:prev.players[pid].ingZone.filter(x=>x._uid!==c._uid),
          trash:[...prev.players[pid].trash,c]
        }),`P${pid+1}: ${c.name}を食材ゾーンから廃棄`);
        return endTurn(next);
      });
      setSelH(null);setSelZ([]);
    }
  }
  function serve(){
    if(!selH)return;
    if(isOnline&&!isMyTurn)return;
    if(isOnline){onAction&&onAction('serve',{recUid:selH,ingUids:selZ});setSelH(null);setSelZ([]);return;}
    const rec=p.hand.find(x=>x._uid===selH);if(!rec)return;
    const si=selZ.map(u=>p.ingZone.find(x=>x._uid===u)?.id).filter(Boolean);
    const need=[...rec.req].sort();const got=[...si].sort();
    if(need.length!==got.length||!need.every((n,i)=>n===got[i])){
      const miss=rec.req.filter(r=>!si.includes(r)).map(r=>ING_NAME[r]||r);
      showMsg(miss.length?`食材不足: ${miss.join('・')}`:'組み合わせが違います');return;
    }

    const prevSat=G.players[1-pid].satiety;
    const afterServe=serveRecipe(G,pid,selH,selZ);
    const newSat=afterServe.players[1-pid].satiety;
    const gain=newSat-prevSat;
    // 料理完成アニメ・SE
    fireServe(rec.name, rec.sat, rec.icon||'🍽️');
    Audio.se('se_serve');
    // 演出の待機時間（1.5秒）後にゲーム状態を更新・効果発動
    setSelH(null);setSelZ([]);
    setTimeout(()=>{
      if(gain>0)fireDamage(gain,1-myPiLocal);
      setG(afterServe);
    },1500);
  }

  const selRec=selH&&p.hand.find(x=>x._uid===selH);
  const needed=selRec?selRec.req:[];
  const zIds=p.ingZone.map(c=>c.id);
  const sZids=selZ.map(u=>p.ingZone.find(x=>x._uid===u)?.id).filter(Boolean);
  const canServe=selH&&needed.length&&needed.every(n=>zIds.includes(n))&&selZ.length===needed.length&&!serveAnim;

  // ホイールイベントを詳細パネルに転送するハンドラ
  function onCardWheel(e){
    const dp=dpScrollRef.current;
    if(!dp)return;
    e.preventDefault();
    dp.scrollTop+=e.deltaY;
  }
  // カードホバー開始：state更新＋ホイールリスナー登録
  function onEnter(card,el){
    setHovered(card);
    if(el)el.addEventListener('wheel',onCardWheel,{passive:false});
  }
  // カードホバー終了：state更新＋ホイールリスナー解除
  function onLeave(el){
    setHovered(null);
    if(el)el.removeEventListener('wheel',onCardWheel);
  }

  function renderField(fpi){
    const fp=G.players[fpi];
    const ingDeckLen=Array.isArray(fp.ingDeck)?fp.ingDeck.length:(fp.ingDeck||0);
    const recDeckLen=Array.isArray(fp.recDeck)?fp.recDeck.length:(fp.recDeck||0);
    const isAct=isOnline?(fpi===myOnlinePi&&G.currentPlayer===myOnlinePi):(fpi===pid);
    const isMine=fpi===myPiLocal;
    const isAIp=isAI&&fpi===aiPi;
    // 表示名：自分=myName、相手=oppName or AI
    const fieldLabel=isAIp?'🤖 AI':isMine?`👤 ${myName}`:(oppName?`👤 ${oppName}`:`👤 相手`);
    // 空き食材スロット数
    const ingSlotEmpty=Math.max(0,7-fp.ingZone.length);
    // 空き手札スロット数
    const handSlotEmpty=Math.max(0,10-fp.hand.length);
    return h('div',{key:fpi,className:`pfield${isAct?' active':''}${isAIp?' ai-field':''}`},
      h('div',{className:'plabel'},`${isAct?'▶ ':''}${fieldLabel} ${isAct?'['+PHASE_LABELS[G.phase]+']':''} ${fp.debuffs.noServe?'⚠料理不可':''}`),
      h('div',{className:'zlabel'},`食材ゾーン (${fp.ingZone.length}/7)`),
      h('div',{className:'ing-zone'},
        h('div',{className:'ing-slots'},
          fp.ingZone.map(c=>{
            const isSel=selZ.includes(c._uid);
            const isHi=isAct&&G.phase==='serve'&&selH&&needed.includes(c.id)&&!sZids.includes(c.id);
            return h('div',{key:c._uid,
              className:`ing-card ${c.cat||''}${isSel?' sel':''}${isHi?' highlight':''}${c._used?' activated':''}${isAct&&G.phase==='place'&&c._placedThisTurn?' placed-this-turn':''}${c._satBuff?' toast-mark':''}`,
              style:{cursor:isAct?'pointer':'default'},
              onClick:()=>clickZone(c,fpi),
              onMouseEnter:e=>onEnter(c,e.currentTarget),
              onMouseLeave:e=>onLeave(e.currentTarget)},
              // 画像エリア（画像があれば表示）
              h('div',{className:'ic-img-wrap'},
                h(CardImg,{id:c.id,style:{borderRadius:'3px 3px 0 0'}})
              ),
              h('div',{className:'ic-cat',style:{color:CAT_COLORS[c.cat]||''}},c.catL),
              h('div',{className:'ic-name'},c.name),
              ING_FN[c.id]&&!c._used&&h('div',{className:'ic-dot'}),
              c._used&&h('div',{className:'ic-act'},'使用済'),
              c._satBuff>0&&h('div',{className:'ic-satbuff'},`★+${c._satBuff}`)
            );
          }),
          // 空きスロット枠（最大7枚）
          Array.from({length:ingSlotEmpty},(_,i)=>h('div',{key:'e'+i,className:'ing-slot-empty'}))
        )
      ),
      h('div',{className:'zlabel'},'完成料理'),
      h('div',{className:'recipe-zone'},
        h('div',{className:'card-row'},
          fp.recZone.map(r=>h('div',{key:r._uid,className:'rcard-done',
            onMouseEnter:e=>onEnter(r,e.currentTarget),
            onMouseLeave:e=>onLeave(e.currentTarget)},
            h('div',{className:'rn'},r.name),h('div',{className:'rs'},`+${r.sat}`)
          ))
        )
      ),
      h('div',{className:'hand-row-hdr'},
        h('div',{className:'zlabel'},`手札 ${fp.hand.length}/10`)
      ),
      h('div',{className:'hand-area',style:{display:'flex',gap:'6px',alignItems:'flex-start',flexWrap:'wrap'}},
        // 自分：クリック可能な山札・ごみ箱
        isMine&&h('div',{className:'hand-decks'},
          h('div',{
            className:`deck-mini ing-deck${isMine&&G.phase==='draw'&&(!isOnline||isMyTurn)&&ingDeckLen?' clickable':' disabled-deck'}`,
            onClick:()=>{if(isMine&&G.phase==='draw'&&(!isOnline||isMyTurn)&&ingDeckLen)drawCard('ing');},
          },
            h('div',{className:'dm-icon'},'🥕'),
            h('div',{className:'dm-count'},ingDeckLen),
            h('div',{className:'dm-label'},'食材山札')
          ),
          h('div',{
            className:`deck-mini rec-deck${isMine&&G.phase==='draw'&&(!isOnline||isMyTurn)&&recDeckLen?' clickable':' disabled-deck'}`,
            onClick:()=>{if(isMine&&G.phase==='draw'&&(!isOnline||isMyTurn)&&recDeckLen)drawCard('rec');},
          },
            h('div',{className:'dm-icon'},'📖'),
            h('div',{className:'dm-count'},recDeckLen),
            h('div',{className:'dm-label'},'レシピ山札')
          ),
          h('div',{
            className:'deck-mini trash-pile clickable',
            onClick:()=>setShowTrash({pi:fpi}),
          },
            h('div',{className:'dm-icon'},'🗑'),
            h('div',{className:'dm-count'},fp.trash.length),
            h('div',{className:'dm-label'},'ごみ箱')
          )
        ),
        // 相手：表示のみ（操作不可）の山札・ごみ箱
        !isMine&&h('div',{className:'hand-decks'},
          h('div',{className:'deck-mini ing-deck disabled-deck'},
            h('div',{className:'dm-icon'},'🥕'),
            h('div',{className:'dm-count'},ingDeckLen),
            h('div',{className:'dm-label'},'食材山札')
          ),
          h('div',{className:'deck-mini rec-deck disabled-deck'},
            h('div',{className:'dm-icon'},'📖'),
            h('div',{className:'dm-count'},recDeckLen),
            h('div',{className:'dm-label'},'レシピ山札')
          ),
          h('div',{className:'deck-mini trash-pile clickable',onClick:()=>setShowTrash({pi:fpi})},
            h('div',{className:'dm-icon'},'🗑'),
            h('div',{className:'dm-count'},fp.trash.length),
            h('div',{className:'dm-label'},'ごみ箱')
          )
        ),
        h('div',{className:'card-row',style:{flex:1,flexWrap:'wrap'}},
          !fp.hand.length&&h('div',{className:'empty-hint'},'手札なし'),
          fp.hand.map(c=>{
            const back=isAIp&&!fp.revealed;
            return h('div',{key:c._uid,
              className:`hcard${isAct&&selH===c._uid?' sel':''}${!isAct?' disabled':''}${back?' back':''}`,
              onClick:()=>isAct&&!back&&clickHand(c),
              onMouseEnter:e=>{if(!back)onEnter(c,e.currentTarget);},
              onMouseLeave:e=>onLeave(e.currentTarget)},
              !back&&h('div',{key:'img',className:'hcard-img-wrap'},
                h(CardImg,{id:c.id,style:{borderRadius:'5px 5px 0 0'}})
              ),
              !back&&[
                h('div',{key:'t',className:`hc-type ${c._isRec?'rec':'ing'}`},c._isRec?'レシピ':'食材'),
                h('div',{key:'n',className:'hc-name'},c.name),
                c._isRec&&h('div',{key:'s',className:'hc-sat'},`+${c.sat}`)
              ]
            );
          }),
          // 空き手札スロット枠（最大10枚）
          isMine&&Array.from({length:handSlotEmpty},(_,i)=>h('div',{key:'hs'+i,className:'hand-slot-empty'}))
        )
      )

// ============================================================
// ONLINE LOBBY
// ============================================================
// ============================================================
// SERVER URL 解決ロジック
// 優先順位:
//   1. window.__GRIMOIRE_SERVER_URL  ← server-config.js で外部サーバーを指定
//   2. Electron内蔵サーバー (localhost:動的ポート)
//   3. window.location.origin        ← ブラウザ直接アクセス時
// ============================================================
let SERVER_URL = window.__GRIMOIRE_SERVER_URL || window.location.origin;
let _serverUrlReady = false;

async function resolveServerURL() {
  // 設定ファイルで外部サーバーが指定されていればそれを優先
  if (window.__GRIMOIRE_SERVER_URL) {
    SERVER_URL = window.__GRIMOIRE_SERVER_URL;
    console.log('[Grimoire] Using configured server:', SERVER_URL);
    _serverUrlReady = true;
    return SERVER_URL;
  }
  // Electron内蔵サーバー
  if (window.electronAPI) {
    const port = await window.electronAPI.getServerPort();
    SERVER_URL = `http://localhost:${port}`;
    console.log('[Grimoire] Using embedded server:', SERVER_URL);
    _serverUrlReady = true;
    return SERVER_URL;
  }
  // ブラウザ直接アクセス
  SERVER_URL = window.location.origin;
  console.log('[Grimoire] Using origin:', SERVER_URL);
  _serverUrlReady = true;
  return SERVER_URL;
}

// 起動時に即解決しておく
resolveServerURL();
