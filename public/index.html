function OnlineLobby({onBack,savedDecks,onSaveDecks,initialMode='menu'}){
  const [mode,setMode]=useState(initialMode);
  const [playerName,setPlayerName]=useState('');
  const [roomId,setRoomId]=useState('');
  const [inputRoom,setInputRoom]=useState('');
  const [roomInfo,setRoomInfo]=useState(null);
  const [mulHand,setMulHand]=useState([]);
  const [mulSel,setMulSel]=useState(new Set());
  const [coinFirst,setCoinFirst]=useState(0);
  const [onlineG,setOnlineG]=useState(null);
  const [onlineMyPi,setOnlineMyPi]=useState(null);
  const [errMsg,setErrMsg]=useState('');
  const [playerDeck,setPlayerDeck]=useState(null);
  const [showResult,setShowResult]=useState(null);
  const [rematchSec,setRematchSec]=useState(null);
  const [opponentWantsRematch,setOpponentWantsRematch]=useState(false);
  const [iWantRematch,setIWantRematch]=useState(false);
  const [queueSize,setQueueSize]=useState(0);       // 待機人数
  const [matchOpponent,setMatchOpponent]=useState(''); // マッチした相手の名前
  const sockRef=useRef(null);

  useEffect(()=>{
    if(typeof io==='undefined'){setErrMsg('Socket.ioが読み込まれていません');return;}
    let sock=null;
    resolveServerURL().then(url=>{
      sock=io(url,{transports:['websocket','polling'],reconnection:true,reconnectionAttempts:5,reconnectionDelay:1000});
      sockRef.current=sock;
      sock.on('connect',()=>{setErrMsg('');});
      sock.on('connect_error',(e)=>{setErrMsg(`サーバーに接続できません`);});
      sock.on('disconnect',(reason)=>{if(reason!=='io client disconnect')setErrMsg('接続が切れました');});
      sock.on('error',msg=>setErrMsg(msg));
      sock.on('roomCreated',({roomId:id})=>{setRoomId(id);setMode('wait');});
      sock.on('roomJoined',({roomId:id,myPi:pi})=>{setRoomId(id);setOnlineMyPi(pi);setMode('wait');});
      sock.on('roomInfo',info=>setRoomInfo(info));
      sock.on('coinFlip',({first,myPi:pi})=>{setOnlineMyPi(pi);setCoinFirst(first);setMode('coin-flip');});
      sock.on('mulliganStart',({hand,myPi:pi})=>{setMulHand(hand);setOnlineMyPi(pi);setMulSel(new Set());setMode('mulligan');});
      sock.on('state',({G,myPi:pi})=>{setOnlineG(G);setOnlineMyPi(pi);setShowResult(null);setMode('game');});
      // ランダムマッチ
      sock.on('queueJoined',({queueSize:qs})=>{setQueueSize(qs);});
      sock.on('queueUpdate',({queueSize:qs})=>{setQueueSize(qs);});
      sock.on('matchFound',({opponent,roomId:id,myPi:pi})=>{
        setMatchOpponent(opponent);
        setOnlineMyPi(pi);
        setRoomId(id);
        setMode('match-found');
        // 2秒後に自動でready送信
        setTimeout(()=>{ sock.emit('ready',{deck:playerDeck}); setMode('wait-ready'); },2000);
      });
      sock.on('gameOver',({winnerName,reason})=>{
        setShowResult({winnerName,reason});
        setRematchSec(null);setIWantRematch(false);setOpponentWantsRematch(false);
        Audio.stopBgm();
        Audio.se(winnerName===playerName?'se_win':'se_lose');
      });
      sock.on('opponentLeft',({msg})=>{setErrMsg(msg);setMode('menu');setShowResult(null);setRematchSec(null);setIWantRematch(false);setOpponentWantsRematch(false);});
      sock.on('rematchCountdown',({sec,fromOpponent})=>{
        // fromOpponentがtrueなら相手が押した（自分はまだ押していない可能性）
        if(fromOpponent){setOpponentWantsRematch(true);}
        else{setRematchSec(sec);}
      });
      sock.on('rematchMatched',()=>{setShowResult(null);setRematchSec(null);setIWantRematch(false);setOpponentWantsRematch(false);setPlayerDeck(null);setMode('deck-select-rematch');});
      sock.on('rematchExpired',()=>{setRematchSec(null);setIWantRematch(false);setOpponentWantsRematch(false);setShowResult(null);goTitle();});
    });
    return()=>{if(sock)sock.disconnect();};
  },[]);

  function emit(ev,data){sockRef.current&&sockRef.current.emit(ev,data);}
  function sendAction(type,payload={}){emit('action',{type,payload});}
  function doCreate(){if(!playerName.trim()){setErrMsg('名前を入力してください');return;}setErrMsg('');emit('createRoom',{name:playerName,deck:playerDeck});}
  function doJoin(){if(!playerName.trim()||!inputRoom.trim()){setErrMsg('名前とルームIDを入力してください');return;}setErrMsg('');emit('joinRoom',{roomId:inputRoom.trim().toUpperCase(),name:playerName,deck:playerDeck});}
  function doReady(){emit('ready',{deck:playerDeck});setMode('wait-ready');}
  function doMulConfirm(){emit('mulliganDone',{sel:[...mulSel]});setMode('wait');}
  function doRematch(){emit('ready',{deck:playerDeck});setMode('wait-ready');}
  function goTitle(){setRematchSec(null);sockRef.current&&sockRef.current.disconnect();onBack();}
  function doJoinQueue(){
    if(!playerName.trim()){setErrMsg('名前を入力してください');return;}
    if(!playerDeck){setErrMsg('デッキを選択してください');return;}
    setErrMsg('');setQueueSize(0);
    emit('joinCasualQueue',{name:playerName,deck:playerDeck});
    setMode('queue-waiting');
  }
  function doLeaveQueue(){emit('leaveQueue',{});setMode('random-match');}

  // ── ランダムマッチ：デッキ選択 ──
  const myNameOnline2=playerName||'あなた';
  const oppNameOnline2=roomInfo?.players?.find((_,i)=>i!==onlineMyPi)?.name||'相手';
  const errDiv=errMsg&&h('div',{style:{color:'var(--red)',fontSize:'12px',margin:'4px 0'}},'⚠ '+errMsg);

  if(mode==='random-match')return h('div',{className:'title-screen'},
    h('div',{className:'logo'},
      h('h1',null,'🎲 ランダムマッチ'),
      h('div',{className:'logo-en'},'CASUAL MATCH')
    ),
    errDiv,
    h('div',{style:{display:'flex',flexDirection:'column',gap:'6px',alignItems:'center',width:'100%',maxWidth:'400px'}},
      h('div',{style:{fontSize:'12px',color:'var(--text)',fontWeight:'700',marginBottom:'4px'}},'プレイヤー名'),
      h('input',{value:playerName,onChange:e=>setPlayerName(e.target.value),placeholder:'プレイヤー名を入力',
        style:{fontSize:'13px',padding:'8px 12px',borderRadius:'5px',border:'1px solid var(--borderG)',
          background:'rgba(255,255,255,.85)',color:'#1a1008',fontFamily:'inherit',width:'100%',fontWeight:'600',marginBottom:'8px'}}),
      h('div',{style:{fontSize:'12px',color:'var(--text)',fontWeight:'700',marginBottom:'4px'}},'デッキを選択'),
      savedDecks.length===0
        ? h('div',{style:{fontSize:'12px',color:'var(--muted)',padding:'12px'}},'保存済みデッキがありません')
        : savedDecks.map((d,i)=>h('button',{key:i,
            className:`mbtn${playerDeck===d?' primary':''}`,
            style:{width:'100%',textAlign:'left',padding:'10px 14px'},
            onClick:()=>setPlayerDeck(d)},
            h('span',{style:{marginRight:'8px'}},'🃏'),
            h('span',{style:{fontWeight:'700',fontSize:'13px'}},d.name||`デッキ${i+1}`),
            playerDeck===d&&h('span',{style:{marginLeft:'auto',fontSize:'11px',color:'var(--goldD)'}},'✓ 選択中')
          ))
    ),
    h('div',{className:'title-menu',style:{marginTop:'8px'}},
      h('button',{className:'mbtn primary',onClick:doJoinQueue,disabled:!playerDeck||!playerName.trim()},'🔍 対戦相手を探す'),
      h('button',{className:'mbtn sm',onClick:onBack},'← タイトルへ戻る')
    )
  );

  // ── ランダムマッチ：マッチング待機中 ──
  if(mode==='queue-waiting')return h('div',{className:'title-screen'},
    h('div',{className:'logo'},
      h('h1',{style:{fontSize:'28px'}},'🔍 対戦相手を探しています...'),
    ),
    h('div',{style:{
      fontSize:'16px',color:'var(--muted)',fontWeight:'600',
      animation:'fadeInOut 1.5s ease-in-out infinite alternate',
    }},`待機中 ${queueSize}人`),
    h('style',null,`@keyframes fadeInOut{from{opacity:.4}to{opacity:1}}`),
    h('div',{style:{marginTop:'8px',fontSize:'13px',color:'var(--dim)'}},
      `プレイヤー名: ${playerName}　デッキ: ${playerDeck?.name||''}` ),
    h('div',{className:'title-menu',style:{marginTop:'20px'}},
      h('button',{className:'mbtn sm danger',onClick:doLeaveQueue},'✕ キャンセル')
    )
  );

  // ── ランダムマッチ：マッチング成立 ──
  if(mode==='match-found')return h('div',{className:'title-screen'},
    h('div',{className:'logo'},
      h('h1',{style:{fontSize:'32px',color:'#1a6010'}},'✅ マッチング成立！'),
      h('div',{className:'logo-en',style:{color:'#2a8020'}},'MATCH FOUND'),
    ),
    h('div',{style:{fontSize:'18px',fontWeight:'700',color:'var(--text)',marginTop:'8px'}},
      `対戦相手: ${matchOpponent}`
    ),
    h('div',{style:{fontSize:'13px',color:'var(--muted)',marginTop:'6px'}},'ゲームを開始します...'),
  );

  if(mode==='game'&&onlineG&&!showResult){
    return h(GameScreen,{initG:onlineG,isAI:false,isOnline:true,myOnlinePi:onlineMyPi,onAction:sendAction,myName:myNameOnline2,oppName:oppNameOnline2});
  }
  if(mode==='coin-flip')return h(CoinFlipScreen,{first:coinFirst,myPi:onlineMyPi,onDone:()=>{}});
  if(mode==='mulligan')return h(OnlineMulliganScreen,{hand:mulHand,sel:mulSel,setSel:setMulSel,onConfirm:doMulConfirm,myPi:onlineMyPi});

  const nameBox=h('input',{value:playerName,onChange:e=>setPlayerName(e.target.value),placeholder:'プレイヤー名',
    style:{fontSize:'13px',padding:'8px 12px',borderRadius:'5px',border:'1px solid var(--borderG)',background:'var(--bg3)',color:'var(--text)',fontFamily:'inherit',width:'200px'}});

  function deckBtn(d,i,selected,onClick){
    return h('button',{key:i,className:`mbtn${selected?' primary':''}`,style:{width:'360px',textAlign:'left',padding:'12px 18px'},onClick},
      h('span',{style:{marginRight:'10px'}},'🃏'),
      h('div',{style:{display:'flex',flexDirection:'column',gap:'2px',flex:1}},
        h('span',{style:{fontWeight:'bold',fontSize:'13px'}},d.name||`デッキ${i+1}`),
        h('span',{style:{fontSize:'10px',color:'var(--muted)'}},`保存日: ${d.savedAt||''}`)
      ),
      selected&&h('span',{style:{marginLeft:'auto',fontSize:'11px',color:'#f8d888'}},'✓ 選択中')
    );
  }

  function DeckSelectView({title,nextLabel,onNext,onBack2}){
    return h('div',{className:'title-screen'},
      h('div',{className:'logo',style:{marginBottom:'16px'}},h('h1',null,title)),
      errDiv,
      h('div',{style:{display:'flex',flexDirection:'column',gap:'10px',alignItems:'center',width:'100%',maxWidth:'420px',maxHeight:'55vh',overflowY:'auto',padding:'4px 8px'}},
        h('button',{className:`mbtn${playerDeck===null?' primary':''}`,style:{width:'360px',textAlign:'left',padding:'12px 18px'},onClick:()=>setPlayerDeck(null)},
          h('span',{style:{marginRight:'10px'}},'🎲'),
          h('span',{style:{fontWeight:'bold'}},'ランダムデッキ'),
          playerDeck===null&&h('span',{style:{marginLeft:'auto',fontSize:'11px',color:'#f8d888'}},' ✓ 選択中')
        ),
        savedDecks.length===0
          ? h('div',{style:{fontSize:'12px',color:'#a08868',padding:'12px',textAlign:'center'}},'保存済みデッキがありません')
          : savedDecks.map((d,i)=>deckBtn(d,i,playerDeck===d,()=>setPlayerDeck(d)))
      ),
      h('div',{className:'title-menu',style:{marginTop:'16px'}},
        h('button',{className:'mbtn primary',onClick:onNext},nextLabel),
        onBack2&&h('button',{className:'mbtn sm',onClick:onBack2},'← 戻る')
      )
    );
  }

  // ゲーム終了後
  if(showResult){
    // 勝利判定（プレイヤー名が自分のnameと一致するか）
    const iWinOnline=showResult.winnerName===playerName;
    // パーティクル（useMemoで固定）
    const onlineParticles=Array.from({length:30},(_,i)=>({
      id:i,left:Math.random()*100,
      size:8+Math.random()*16,
      color:['#f8d888','#ff6644','#44dd88','#88aaff','#ff88cc'][i%5],
      delay:Math.random()*1.5,dur:2+Math.random()*2,
    }));
    return h('div',{className:'winner-overlay'},
      // パーティクル
      h('div',{className:'winner-particles'},
        onlineParticles.map(p=>h('div',{key:p.id,className:'winner-particle',style:{
          left:`${p.left}%`,width:`${p.size}px`,height:`${p.size}px`,
          background:p.color,animationDuration:`${p.dur}s`,animationDelay:`${p.delay}s`,
        }}))
      ),
      h('div',{className:'winner-title'},iWinOnline?'🎉 勝利！':'😢 敗北...'),
      h('div',{className:'winner-sub'},
        iWinOnline?'相手を満腹にさせました！':'相手に満腹にされました...'
      ),
      showResult.reason&&h('div',{style:{fontSize:'14px',color:'rgba(255,255,255,.7)',marginTop:'-8px',textShadow:'0 1px 3px #000'}},showResult.reason),
      // 相手が再戦希望通知
      opponentWantsRematch&&!iWantRematch&&h('div',{style:{fontSize:'15px',color:'#80ffb0',fontWeight:'700',textShadow:'0 1px 3px #000'}},
        '🔔 相手が再戦を希望しています！'
      ),
      // 自分が押した後の待機
      iWantRematch&&h('div',{style:{fontSize:'15px',color:'#ffe080',fontWeight:'700',textShadow:'0 1px 3px #000'}},
        rematchSec!==null?`⏳ 相手の応答を待っています... ${rematchSec}秒`:'⏳ 相手の応答を待っています...'
      ),
      // ボタン群
      h('div',{className:'winner-btns',style:{flexDirection:'column',gap:'12px',alignItems:'center'}},
        !iWantRematch&&h('button',{
          className:'btn primary',
          style:{color:'#ffffff',textShadow:'-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000',fontSize:'16px',padding:'12px 32px',fontWeight:'800'},
          onClick:()=>{setIWantRematch(true);emit('rematch',{deck:playerDeck});}
        },'🔄 再戦する'),
        iWantRematch&&h('button',{
          className:'btn',
          style:{color:'#ffffff',textShadow:'-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000',fontSize:'14px',padding:'10px 28px',fontWeight:'700',opacity:.7,cursor:'default'}
        },'✅ 再戦申請中...'),
        h('button',{
          className:'btn',
          style:{color:'#ffffff',textShadow:'-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000',fontSize:'16px',padding:'12px 32px',fontWeight:'800'},
          onClick:goTitle
        },'← タイトルへ戻る')
      )
    );
  }

  // 再戦デッキ選択
  if(mode==='deck-select-rematch')return h(DeckSelectView,{
    title:'🔄 再戦 — デッキを選択',nextLabel:'✅ このデッキで再戦準備完了',
    onNext:doRematch,onBack2:goTitle
  });

  // ルーム参加後のデッキ選択（初回）
  if(mode==='deck-select')return h(DeckSelectView,{
    title:'🃏 デッキを選択して準備完了',nextLabel:'✅ 準備完了',
    onNext:doReady,onBack2:()=>setMode('wait')
  });

  // 準備完了後の待機
  if(mode==='wait-ready')return h('div',{className:'title-screen'},
    h('div',{className:'logo'},
      h('h1',null,'⏳ 相手の準備を待っています...'),
      roomId&&h('div',{style:{fontSize:'24px',color:'var(--goldL)',letterSpacing:'8px',margin:'12px 0',fontFamily:'monospace',background:'var(--bg3)',padding:'10px 20px',borderRadius:'8px',border:'1px solid var(--goldD)'}},roomId)
    ),
    errDiv,
    roomInfo&&h('div',{style:{display:'flex',gap:'20px',justifyContent:'center',margin:'16px 0'}},
      roomInfo.players.map((p,i)=>h('div',{key:i,style:{padding:'10px 18px',borderRadius:'7px',minWidth:'120px',textAlign:'center',
        background:p.ready?'rgba(48,160,80,.2)':'var(--bg3)',border:`1px solid ${p.ready?'#38a068':'var(--border)'}`}},
        h('div',{style:{fontWeight:'bold',color:'var(--text)',marginBottom:'4px'}},p.name||`P${i+1}`),
        h('div',{style:{fontSize:'12px',color:p.ready?'#6eda98':'var(--muted)'}},p.ready?'✅ 準備完了':'⏳ 待機中')
      ))
    ),
    h('div',{className:'title-menu'},
      h('button',{className:'mbtn sm',onClick:()=>setMode('deck-select')},'← デッキを変更する'),
      h('button',{className:'mbtn sm danger',onClick:goTitle},'退出')
    )
  );

  // ルーム待機（デッキ選択前 or 再戦待機）
  if(mode==='wait')return h('div',{className:'title-screen'},
    h('div',{className:'logo'},
      h('h1',null,'🏠 ルーム待機中'),
      roomId&&h('div',{style:{fontSize:'32px',color:'var(--goldL)',letterSpacing:'8px',margin:'12px 0',fontFamily:'monospace',background:'var(--bg3)',padding:'12px 24px',borderRadius:'8px',border:'1px solid var(--goldD)'}},roomId),
      h('div',{style:{fontSize:'10px',color:'var(--muted)'}},'このIDを相手に伝えてください')
    ),
    errDiv,
    roomInfo&&h('div',{style:{display:'flex',gap:'20px',justifyContent:'center',margin:'16px 0'}},
      roomInfo.players.map((p,i)=>h('div',{key:i,style:{padding:'10px 18px',borderRadius:'7px',minWidth:'120px',textAlign:'center',
        background:p.ready?'rgba(48,160,80,.2)':'var(--bg3)',border:`1px solid ${p.ready?'#38a068':'var(--border)'}`}},
        h('div',{style:{fontWeight:'bold',color:'var(--text)',marginBottom:'4px'}},p.name||`P${i+1}`),
        h('div',{style:{fontSize:'12px',color:p.ready?'#6eda98':'var(--muted)'}},p.ready?'✅ 再戦準備完了':'⏳ 待機中')
      ))
    ),
    h('div',{className:'title-menu'},
      h('button',{className:'mbtn primary',onClick:()=>setMode('deck-select')},'🃏 デッキを選択して準備完了'),
      h('button',{className:'mbtn sm danger',onClick:goTitle},'退出')
    )
  );

  // メニュー（ルーム作成・参加）
  if(mode==='menu')return h('div',{className:'title-screen'},
    h('div',{className:'logo'},
      h('h1',null,'🏠 ルームマッチ'),h('div',{className:'logo-en'},'ROOM MATCH')
    ),
    errDiv,nameBox,
    h('div',{className:'title-menu',style:{marginTop:'12px'}},
      h('button',{className:'mbtn primary',onClick:doCreate},'🏠 ルームを作成'),
      h('button',{className:'mbtn',onClick:()=>setMode('join')},'🚪 ルームに参加'),
      h('button',{className:'mbtn sm',onClick:onBack},'← タイトルへ戻る')
    )
  );

  if(mode==='join')return h('div',{className:'title-screen'},
    h('div',{className:'logo'},h('h1',null,'ルームに参加')),errDiv,
    h('div',{className:'title-menu'},nameBox,
      h('input',{value:inputRoom,onChange:e=>setInputRoom(e.target.value.toUpperCase()),placeholder:'ルームID（6文字）',maxLength:6,
        style:{fontSize:'18px',padding:'8px 12px',borderRadius:'5px',border:'1px solid var(--goldD)',background:'var(--bg3)',color:'var(--goldL)',fontFamily:'monospace',width:'200px',textAlign:'center',letterSpacing:'4px'}}),
      h('button',{className:'mbtn primary',onClick:doJoin},'参加する'),
      h('button',{className:'mbtn sm',onClick:()=>setMode('menu')},'← 戻る')
    )
  );

  return null;
}

// ── Electronバージョンバッジ ──
function ElectronVersionBadge(){
  const [ver,setVer]=useState('');
  useEffect(()=>{
    if(window.electronAPI)window.electronAPI.getVersion().then(v=>setVer(v));
  },[]);
  return h('div',{style:{
    position:'fixed',bottom:'10px',right:'12px',
    fontSize:'9px',color:'var(--faint)',letterSpacing:'1px',pointerEvents:'none'
  }},`v${ver}`);
}

// ============================================================
// ROOT
// ============================================================
function App(){
  const [screen,setScreen]=useState('title');
  // ランダム/ランクマッチ
  const [matchType,setMatchType]=useState(null);         // 'casual'|'ranked'
  const [myRating,setMyRating]=useState(()=>parseInt(localStorage.getItem('grimoire_rating')||'1500'));
  const [queueDeckSel,setQueueDeckSel]=useState(null);   // キュー用デッキ選択済みか
  // タイトル画面でBGM再生（ゲーム画面に入るとGameScreen側で切り替え）
  useEffect(()=>{
    if(screen==='title')Audio.playBgm('bgm_title');
  },[screen]);
  const [savedDecks,setSavedDecks]=useState(LS.load);
  const [isAI,setIsAI]=useState(false);
  const [aiPi,setAiPi]=useState(1);
  const [aiDifficulty,setAiDifficulty]=useState('normal'); // 'easy'|'normal'|'hard'
  const [firstPi,setFirstPi]=useState(0);
  const [myLocalPi,setMyLocalPi]=useState(0);
  const [playerDeck,setPlayerDeck]=useState(null);
  const [myDeck,setMyDeck]=useState(null);   // クイックスタートで選んだ自分のデッキ
  const [aiDeck,setAiDeck]=useState(null);
  const [mulPl,setMulPl]=useState(null);
  const [gameG,setGameG]=useState(null);
  const [aiSelectFrom,setAiSelectFrom]=useState('title');

  function handleSave(d){setSavedDecks(d);LS.save(d);}

  function startCoinFlip(c0,c1,ai){
    const pl=initPlayers(c0,c1);
    const first=Math.random()<0.5?0:1;
    setMulPl(pl);
    setIsAI(ai);
    setAiPi(1);
    setFirstPi(first);
    setMyLocalPi(0);
    setScreen('coin-flip');
  }

  function onCoinFlipDone(){setScreen('mulligan');}

  function onMulConfirm(sel){
    const pl=doMulligan(mulPl,sel);
    setGameG({players:pl,currentPlayer:firstPi,phase:'place',turn:1,firstTurn:true,winner:null,
      log:[{msg:`ゲーム開始！${firstPi===0?'P1':'P2'}の先攻です（1ターン目はドロー・料理提供なし）`,type:'hl',id:'init'}]});
    setScreen('game');
  }

  // クイックスタート：①自分のデッキ選択 → ②AIのデッキ選択
  function openMySelect(){setMyDeck(null);setAiDeck(null);setScreen('my-deck-select');}
  function openAiSelect(from){setAiSelectFrom(from);setScreen('ai-deck-select');}
  function startMul(c0,c1,ai){startCoinFlip(c0,c1,ai);}

  // Electronメニューからのタイトル遷移フック
  useEffect(()=>{window.__gotoTitle=()=>setScreen('title');},[]);

  if(screen==='title')return h('div',{className:'title-screen'},
    h('div',{className:'logo'},h('h1',null,'調理魔導書'),h('div',{className:'logo-en'},'《 RECIPE GRIMOIRE 》'),h('div',{className:'logo-tagline'},'食材とレシピを集め、先に"満腹"を叩き込め')),
    h('div',{className:'title-menu'},
      h('button',{className:'mbtn primary',onClick:()=>setScreen('deckbuild')},'🃏 デッキを構築して対戦'),
      h('button',{className:'mbtn',onClick:()=>openMySelect()},'🤖 クイックスタート（VS AI）'),
      h('button',{className:'mbtn',style:{borderColor:'#1a5a1a',color:'#0e3a0e'},onClick:()=>setScreen('online')},'🏠 ルームマッチ'),
      h('button',{className:'mbtn',style:{borderColor:'#1a5a2a',color:'#0e3a1a'},onClick:()=>setScreen('random-match')},'🎲 ランダムマッチ'),
      h('button',{className:'mbtn',style:{borderColor:'#7a3a00',color:'#4a1a00',opacity:.6},onClick:()=>alert('🏆 ランクマッチは実装予定です！\nSteam版でお楽しみに！')},'🏆 ランクマッチ（実装予定）')
    ),
    
    window.electronAPI&&h(ElectronVersionBadge,null)
  );

  // ── AI デッキ選択画面 ──
  // ── 自分のデッキ選択画面 ──
  if(screen==='my-deck-select'){
    function DeckBtn({d,selected,onClick}){
      return h('button',{
        className:`mbtn${selected?' primary':''}`,
        style:{width:'360px',textAlign:'left',padding:'12px 18px'},
        onClick,
      },
        h('span',{style:{marginRight:'10px'}},'🃏'),
        h('div',{style:{display:'flex',flexDirection:'column',gap:'2px',flex:1}},
          h('span',{style:{fontWeight:'bold',fontSize:'13px'}},d.name||'デッキ'),
          h('span',{style:{fontSize:'10px',color:'var(--muted)'}},`保存日: ${d.savedAt||''}`)
        ),
        selected&&h('span',{style:{marginLeft:'auto',fontSize:'11px',color:'#f8d888'}},'✓ 選択中')
      );
    }
    return h('div',{className:'title-screen'},
      h('div',{className:'logo',style:{marginBottom:'16px'}},
        h('h1',null,'🃏 自分のデッキを選択'),
        h('div',{className:'logo-en'},'YOUR DECK SELECT')
      ),
      h('div',{style:{display:'flex',flexDirection:'column',gap:'10px',alignItems:'center',width:'100%',maxWidth:'420px',maxHeight:'55vh',overflowY:'auto',padding:'4px 8px'}},
        h('button',{
          className:`mbtn${myDeck===null?' primary':''}`,
          style:{width:'360px',textAlign:'left',padding:'12px 18px'},
          onClick:()=>setMyDeck(null)
        },
          h('span',{style:{marginRight:'10px'}},'🎲'),
          h('span',{style:{fontWeight:'bold'}},'ランダムデッキ'),
          myDeck===null&&h('span',{style:{marginLeft:'auto',fontSize:'11px',color:'#f8d888'}},' ✓ 選択中')
        ),
        savedDecks.length===0
          ? h('div',{style:{fontSize:'12px',color:'#a08868',padding:'12px',textAlign:'center'}},
              '保存済みデッキがありません\nデッキ構築画面でデッキを保存してください')
          : savedDecks.map((d,i)=>h('button',{
              key:i,
              className:`mbtn${myDeck===d?' primary':''}`,
              style:{width:'360px',textAlign:'left',padding:'12px 18px'},
              onClick:()=>setMyDeck(d)
            },
              h('span',{style:{marginRight:'10px'}},'🃏'),
              h('div',{style:{display:'flex',flexDirection:'column',gap:'2px',flex:1}},
                h('span',{style:{fontWeight:'bold',fontSize:'13px'}},d.name||`デッキ${i+1}`),
                h('span',{style:{fontSize:'10px',color:'var(--muted)'}},`保存日: ${d.savedAt||''}`)
              ),
              myDeck===d&&h('span',{style:{marginLeft:'auto',fontSize:'11px',color:'#f8d888'}},'✓ 選択中')
            ))
      ),
      h('div',{className:'title-menu',style:{marginTop:'16px'}},
        h('button',{className:'mbtn primary',onClick:()=>openAiSelect('title')},'次へ → AIのデッキを選択'),
        h('button',{className:'mbtn sm',onClick:()=>setScreen('title')},'← 戻る')
      )
    );
  }

  if(screen==='ai-deck-select'){
    const backScreen='title';
    return h('div',{className:'title-screen'},
      h('div',{className:'logo',style:{marginBottom:'16px'}},
        h('h1',null,'🤖 AIのデッキを選択'),
        h('div',{className:'logo-en'},'AI DECK SELECT')
      ),
      h('div',{style:{
        display:'flex',flexDirection:'column',gap:'10px',alignItems:'center',
        width:'100%',maxWidth:'420px',maxHeight:'55vh',overflowY:'auto',
        padding:'4px 8px',
      }},
        h('button',{
          className:`mbtn${aiDeck===null?' primary':''}`,
          style:{width:'360px',textAlign:'left',padding:'12px 18px'},
          onClick:()=>setAiDeck(null)
        },
          h('span',{style:{marginRight:'10px'}},'🎲'),
          h('span',{style:{fontWeight:'bold'}},'ランダムデッキ'),
          aiDeck===null&&h('span',{style:{marginLeft:'auto',fontSize:'11px',color:'#f8d888'}}, ' ✓ 選択中')
        ),
        savedDecks.length===0
          ? h('div',{style:{fontSize:'12px',color:'#a08868',padding:'12px',textAlign:'center'}},
              '保存済みデッキがありません\nデッキ構築画面でデッキを保存してください')
          : savedDecks.map((d,i)=>h('button',{
              key:i,
              className:`mbtn${aiDeck===d?' primary':''}`,
              style:{width:'360px',textAlign:'left',padding:'12px 18px'},
              onClick:()=>setAiDeck(d)
            },
              h('span',{style:{marginRight:'10px'}},'🃏'),
              h('div',{style:{display:'flex',flexDirection:'column',gap:'2px',flex:1}},
                h('span',{style:{fontWeight:'bold',fontSize:'13px'}},d.name||`デッキ${i+1}`),
                h('span',{style:{fontSize:'10px',color:'var(--muted)'}},`保存日: ${d.savedAt||''}`)
              ),
              aiDeck===d&&h('span',{style:{marginLeft:'auto',fontSize:'11px',color:'#f8d888'}},'✓ 選択中')
            ))
      ),
      h('div',{className:'title-menu',style:{marginTop:'16px'}},
        // 難易度選択
        h('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',gap:'8px',marginBottom:'8px'}},
          h('div',{style:{fontSize:'12px',color:'var(--text)',fontWeight:'700',letterSpacing:'2px'}},'🎯 難易度'),
          h('div',{style:{display:'flex',gap:'8px'}},
            [['easy','かんたん','#2a7a2a'],['normal','ふつう','#1a3d6e'],['hard','むずかしい','#8a1010']].map(([val,label,col])=>
              h('button',{key:val,
                style:{
                  padding:'7px 16px',borderRadius:'6px',fontFamily:'inherit',
                  fontWeight:'700',fontSize:'12px',cursor:'pointer',
                  border:`2px solid ${aiDifficulty===val?col:'rgba(140,100,40,.3)'}`,
                  background:aiDifficulty===val?`${col}22`:'rgba(255,248,220,.5)',
                  color:aiDifficulty===val?col:'var(--text)',
                  transition:'all .15s',
                },
                onClick:()=>setAiDifficulty(val)
              },label)
            )
          )
        ),
        h('button',{className:'mbtn primary',onClick:()=>startMul(myDeck,aiDeck,true)},
          '🤖 対戦開始！'),
        h('button',{className:'mbtn sm',onClick:()=>setScreen('my-deck-select')},'← 自分のデッキ選択へ戻る')
      )
    );
  }

  if(screen==='deckbuild')return h(DeckBuilder,{onBack:()=>setScreen('title'),savedDecks,onSaveDecks:handleSave});
  // コインフリップ画面：自分のpiは ローカル=1-aiPi、オンラインはonlineMyPi
  if(screen==='coin-flip')return h(CoinFlipScreen,{first:firstPi,myPi:myLocalPi,onDone:onCoinFlipDone});
  if(screen==='mulligan')return h(MulliganScreen,{players:mulPl,onConfirm:onMulConfirm,isAI,aiPi});
  if(screen==='game'&&gameG)return h(GameScreen,{initG:gameG,isAI,aiPi,difficulty:aiDifficulty});
  if(screen==='online')return h(OnlineLobby,{onBack:()=>setScreen('title'),savedDecks,onSaveDecks:handleSave,initialMode:'menu'});
  if(screen==='random-match')return h(OnlineLobby,{onBack:()=>setScreen('title'),savedDecks,onSaveDecks:handleSave,initialMode:'random-match'});
  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
