<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>調理魔導書《レシピグリモワール》</title>
<!-- 外部サーバーURL設定: server-config.js を編集してください -->
<script src="server-config.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#c0aa88}
body{font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:#1e2530;font-weight:500}
#root{height:100vh;display:flex;flex-direction:column}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:rgba(0,0,0,.12)}
::-webkit-scrollbar-thumb{background:#8a6840;border-radius:3px}

:root{
  /* ── ナチュラル×木目キッチンテーマ ── */
  --bg:#c8b898;--bg2:#d4c4a8;--bg3:#ddd0b8;--bg4:#e8dcc8;--bg5:#f2ead8;
  /* アクセント：深いウォームブラウン */
  --gold:#4a2c08;--goldL:#6a3e10;--goldD:#301a04;--goldXD:#180c00;
  /* ボーダー */
  --border:#9a8060;--borderG:#7a6040;--borderL:#5a4020;
  /* テキスト */
  --text:#1a1008;
  --muted:#2e1e0a;
  --dim:#4a3018;
  --faint:#6a4c28;
  /* カテゴリ色（木目背景用：濃く調整） */
  --protein:#980e10;--proteinL:#c02020;
  --carb:#0a3880;--carbL:#1850a8;
  --fat:#145808;--fatL:#207818;
  --vitamin:#0a5c30;--vitaminL:#187848;
  --mineral:#4a1090;--mineralL:#6828b8;
  --red:#980e10;--green:#145808;--blue:#0a3880;
  --shadow:rgba(0,0,0,0.22);
}

/* ── SHARED ── */
.btn{padding:5px 14px;border-radius:5px;border:1px solid var(--borderG);background:rgba(255,248,220,.65);color:var(--goldD);cursor:pointer;font:11px/1.4 'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;font-weight:600;transition:all .15s;letter-spacing:.5px}
.btn:hover{background:rgba(255,248,220,.95);border-color:var(--goldL)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
.btn.primary{background:rgba(14,37,69,.18);border-color:var(--goldD);color:var(--goldD);font-weight:bold;font-size:12px}
.btn.primary:hover{background:rgba(14,37,69,.25)}
.btn.danger{background:rgba(140,20,20,.12);border-color:#a02020;color:#801010}
.btn.sm{font-size:10px;padding:3px 10px}
.btn.xs{font-size:9px;padding:2px 7px}
.sp{flex:1}

/* ── TITLE ── */
.title-screen{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  height:100vh;position:relative;overflow:hidden;
  background:
    repeating-linear-gradient(88deg,
      transparent 0px,transparent 22px,
      rgba(100,64,20,.07) 22px,rgba(100,64,20,.07) 26px,
      transparent 26px,transparent 50px,
      rgba(80,48,12,.04) 50px,rgba(80,48,12,.04) 52px
    ),
    radial-gradient(ellipse 70% 50% at 30% 20%,rgba(255,240,200,.2) 0%,transparent 55%),
    radial-gradient(ellipse 60% 40% at 80% 30%,rgba(240,220,170,.15) 0%,transparent 50%),
    radial-gradient(ellipse 80% 60% at 50% 110%,rgba(140,90,30,.18) 0%,transparent 55%),
    linear-gradient(180deg,#d8c8a0 0%,#ccbc90 30%,#c4b488 60%,#b8a878 100%);
}
.title-screen::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 50% 40% at 15% 35%,rgba(255,240,200,.18) 0%,transparent 55%),
    radial-gradient(ellipse 40% 30% at 85% 25%,rgba(255,230,170,.12) 0%,transparent 45%);
  pointer-events:none;
}
.title-screen::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,245,220,.15) 0%,transparent 35%);
  pointer-events:none;
}
.logo{text-align:center;position:relative;z-index:1}
.logo h1{font-size:32px;color:#1a0e04;letter-spacing:5px;text-shadow:0 2px 4px rgba(255,240,200,.6),0 1px 0 rgba(255,255,255,.5);font-weight:800}
.logo-en{font-size:18px;color:#3a1a04;letter-spacing:4px;margin-top:8px;font-weight:700;text-shadow:0 1px 2px rgba(255,240,200,.5)}
.logo-tagline{font-size:17px;color:#2a1404;margin-top:12px;font-style:italic;letter-spacing:1px;font-weight:600;text-shadow:0 1px 2px rgba(255,240,200,.4)}
.title-menu{display:flex;flex-direction:column;gap:10px;align-items:center;position:relative;z-index:1}
.mbtn{width:260px;padding:13px;border-radius:7px;border:1px solid var(--borderG);background:rgba(255,248,220,.65);color:#1a0e04;font-size:13px;cursor:pointer;transition:all .2s;font-family:inherit;letter-spacing:1px;text-align:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-weight:700}
.mbtn:hover{background:rgba(255,255,255,.8);border-color:var(--goldL);transform:scale(1.02);box-shadow:0 4px 16px rgba(0,0,0,.1)}
.mbtn.primary{border-color:#3a1a04;color:#1a0e04;font-weight:800;font-size:14px;background:rgba(255,248,220,.75)}
.mbtn.sm{width:180px;font-size:11px;padding:8px}
.title-note{font-size:9px;color:var(--faint);text-align:center;line-height:2;letter-spacing:.5px}

/* ── DECK BUILDER ── */
.db-screen{display:grid;grid-template-rows:auto 1fr auto;height:100vh;overflow:hidden}
.db-header{display:flex;align-items:center;gap:10px;padding:7px 14px;background:rgba(200,180,140,.7);border-bottom:1px solid rgba(140,100,40,.4);flex-wrap:wrap;backdrop-filter:blur(6px)}
.db-title{font-size:13px;color:#1a1008;font-weight:800;letter-spacing:2px;flex-shrink:0}
.db-tabs{display:flex;gap:4px}
.db-tab{font-size:11px;padding:4px 14px;border-radius:4px;border:1px solid rgba(140,100,40,.4);background:rgba(255,248,220,.4);color:#2e1e0a;cursor:pointer;font-family:inherit;transition:all .15s;font-weight:600}
.db-tab.active{background:rgba(74,44,8,.25);border-color:rgba(100,60,10,.6);color:#1a1008;font-weight:700}
.deck-info{margin-left:auto;display:flex;align-items:center;gap:10px}
.deck-count{font-size:11px;color:#2e1e0a;padding:2px 8px;border-radius:4px;border:1px solid rgba(140,100,40,.4);background:rgba(255,248,220,.5);font-weight:700}
.deck-count.ok{color:#145808;border-color:rgba(30,100,40,.5);background:rgba(200,240,210,.4)}
.deck-count.over{color:#900808;border-color:rgba(160,20,20,.5);background:rgba(255,210,210,.4)}
.deck-name-input{font-size:11px;padding:4px 10px;border-radius:4px;border:1px solid rgba(140,100,40,.5);background:rgba(255,255,255,.85);color:#1a1008;font-family:inherit;width:150px;font-weight:600}
.deck-name-input:focus{outline:none;border-color:rgba(100,60,10,.7);background:#ffffff;color:#1a1008}
.db-body{display:grid;grid-template-columns:1fr 300px;overflow:hidden}
.card-library{display:flex;flex-direction:column;overflow:hidden;border-right:1px solid #6a4822}
.lib-filters{display:flex;gap:5px;padding:7px 10px;background:var(--bg);border-bottom:1px solid rgba(140,100,40,.3);flex-wrap:wrap;align-items:center}
.filter-btn{font-size:11px;padding:4px 12px;border-radius:12px;border:1px solid #7a5530;background:rgba(60,36,10,.6);color:#d4b888;cursor:pointer;font-family:inherit;transition:all .12s}
.filter-btn:hover{border-color:rgba(100,60,10,.6);background:rgba(255,248,220,.9)}
.filter-btn.active{color:#1a1008;border-color:rgba(100,60,10,.5);font-weight:700}
.filter-btn.f-all.active{background:rgba(160,110,40,.25)}
.filter-btn.f-protein.active{background:rgba(180,40,40,.2);color:#800808}
.filter-btn.f-carb.active{background:rgba(40,80,180,.2);color:#0a3080}
.filter-btn.f-fat.active{background:rgba(60,140,20,.2);color:#1a6008}
.filter-btn.f-vitamin.active{background:rgba(20,150,80,.2);color:#0a6030}
.filter-btn.f-mineral.active{background:rgba(120,30,160,.2);color:#5a1080}
.search-input{font-size:11px;padding:4px 12px;border-radius:4px;border:1px solid rgba(140,100,40,.5);background:rgba(255,255,255,.85);color:#1a1008;font-family:inherit;width:140px;margin-left:auto;font-weight:600}
.search-input:focus{outline:none;border-color:rgba(100,60,10,.7);background:#ffffff;color:#1a1008}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:12px;overflow-y:auto;align-content:start}
.lib-card{border-radius:8px;background:#38240e;border:1px solid #7a5530;padding:12px;cursor:pointer;transition:all .15s;position:relative;user-select:none;display:flex;flex-direction:column}
.lib-card:hover{border-color:#c49040;transform:translateY(-2px);background:#422a10;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.lib-card.in-deck{border-color:#c49040;background:#3e2c10}
.lib-card.maxed{opacity:.5;cursor:default}
.lib-card.maxed:hover{transform:none;background:#38240e;box-shadow:none}
.lib-card .lc-badge{font-size:11px;padding:3px 7px;border-radius:4px;font-weight:bold;display:inline-block;margin-bottom:6px}
.badge-protein{background:rgba(208,80,80,.4);color:#ffb8a0;border:1px solid rgba(208,80,80,.6)}
.badge-carb{background:rgba(74,142,216,.4);color:#a8d4ff;border:1px solid rgba(74,142,216,.6)}
.badge-fat{background:rgba(112,192,48,.4);color:#c0f080;border:1px solid rgba(112,192,48,.6)}
.badge-vitamin{background:rgba(48,200,120,.4);color:#80ffcc;border:1px solid rgba(48,200,120,.6)}
.badge-mineral{background:rgba(176,64,208,.4);color:#f0a8ff;border:1px solid rgba(176,64,208,.6)}
.badge-recipe{background:rgba(210,110,40,.4);color:#ffb870;border:1px solid rgba(210,110,40,.6)}
.lib-card .lc-name{font-size:14px;font-weight:bold;color:#fff8e8;line-height:1.4;margin-bottom:6px}
.lib-card .lc-req{font-size:11px;color:#d4b888;line-height:1.6;display:flex;flex-wrap:wrap;gap:3px 5px;margin-bottom:5px}
.lib-card .lc-req-chip{font-size:11px;color:#e8c898;background:rgba(255,200,100,.15);border:1px solid rgba(200,150,60,.5);border-radius:4px;padding:2px 7px;white-space:nowrap}
.lib-card .lc-eff{font-size:12px;color:#d4b080;line-height:1.6;margin-top:4px;flex:1}
.lib-card .lc-sat{font-size:18px;color:#f8d888;font-weight:bold;text-align:right;margin-top:5px}
.lib-card .lc-count{position:absolute;top:7px;right:7px;font-size:11px;background:rgba(0,0,0,.8);border-radius:10px;padding:2px 8px;color:#f8d888;font-weight:bold}
.lib-card .lc-add{display:block;width:100%;margin-top:8px;font-size:11px;background:rgba(140,85,10,.9);border-radius:4px;padding:4px 0;color:#f8d888;border:1px solid #c49040;text-align:center;box-sizing:border-box}
.lib-card:hover .lc-add{background:rgba(180,120,20,.95);border-color:#f8d888}
.deck-panel{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.deck-section{padding:6px 10px;border-bottom:1px solid rgba(140,100,40,.3);background:var(--bg)}
.deck-section h3{font-size:10px;color:#1a1008;letter-spacing:1px;margin-bottom:4px;display:flex;justify-content:space-between;font-weight:700}
.deck-section h3 span{color:#4a2c08;font-weight:800}
.deck-entry{display:flex;align-items:center;gap:6px;padding:3px 10px;border-bottom:1px solid rgba(140,100,40,.15);transition:background .1s}
.deck-entry:hover{background:rgba(255,248,220,.6)}
.de-name{font-size:10px;color:#1a1008;flex:1;line-height:1.4;font-weight:600}
.de-cnt{font-size:9px;color:#4a2c08;width:18px;text-align:center;font-weight:800}
.de-sat{font-size:9px;color:#301a04;width:22px;text-align:right;font-weight:700}
.de-rm{background:transparent;border:none;color:#7a5030;cursor:pointer;padding:0 3px;font-size:13px;line-height:1;transition:color .1s}
.de-rm:hover{color:#900}
.cat-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.deck-stats{padding:8px 10px;border-top:1px solid rgba(140,100,40,.3);margin-top:auto}
.stat-row{display:flex;align-items:center;gap:5px;margin-bottom:4px}
.stat-label{font-size:8px;color:#2e1e0a;width:54px;flex-shrink:0;font-weight:700}
.stat-bar{flex:1;height:5px;background:rgba(0,0,0,.18);border-radius:3px;overflow:hidden}
.stat-fill{height:100%;border-radius:3px;transition:width .3s}
.stat-num{font-size:8px;color:#2e1e0a;width:18px;text-align:right;font-weight:700}
.db-footer{display:flex;gap:7px;align-items:center;padding:7px 12px;background:rgba(200,180,140,.7);border-top:1px solid rgba(140,100,40,.4);flex-wrap:wrap}
.validation-msg{font-size:10px;color:#900808;font-weight:700}
.validation-ok{font-size:10px;color:#145808;font-weight:700}
.saved-screen{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.saved-header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(200,180,140,.7);border-bottom:1px solid rgba(140,100,40,.4)}
.saved-list{padding:12px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex:1}
.saved-item{background:rgba(255,248,220,.7);border:1px solid rgba(140,100,40,.35);border-radius:7px;padding:10px 14px;display:flex;align-items:center;gap:10px;transition:border-color .15s}
.saved-item:hover{border-color:rgba(100,60,10,.7);background:rgba(255,248,220,.9)}
.si-name{font-size:12px;color:#1a1008;font-weight:800;flex:1}
.si-info{font-size:9px;color:#3a2010;font-weight:600}
.si-btns{display:flex;gap:5px}

/* ── MULLIGAN ── */
.mulligan-screen{display:flex;flex-direction:column;height:100vh;background:var(--bg);padding:10px;gap:8px}
.mull-header{text-align:center;padding:8px}
.mull-header h2{font-size:18px;color:var(--goldL);letter-spacing:2px}
.mull-header p{font-size:11px;color:var(--muted);margin-top:4px}
.mull-area{display:flex;gap:10px;flex:1;overflow:hidden;align-items:stretch}
.mull-player{flex:1;background:var(--bg2);border-radius:10px;border:1px solid var(--border);padding:10px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.mull-player h3{font-size:11px;color:var(--gold);text-align:center;letter-spacing:1px}
.mull-player.ai-panel h3{color:var(--muted)}
.mull-hand{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:8px 0}
.mull-card{width:144px;height:180px;border-radius:10px;border:2px solid var(--border);background:var(--bg3);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;transition:all .15s;position:relative;user-select:none}
.mull-card:hover{transform:translateY(-6px);border-color:var(--gold);box-shadow:0 10px 24px var(--shadow)}
.mull-card.selected{border-color:#e44;box-shadow:0 0 0 3px rgba(228,68,68,.45);transform:translateY(-8px)}
.mull-card.selected::after{content:'返す';position:absolute;top:6px;left:6px;font-size:11px;background:#c22;color:#fff;padding:2px 8px;border-radius:4px}
.mull-card .mc-type{font-size:11px;color:var(--muted);width:100%;text-align:center}
.mull-card .mc-name{font-size:16px;font-weight:bold;text-align:center;line-height:1.4;color:var(--text);margin-top:8px}
.mull-card .mc-cat{font-size:12px;text-align:center;margin-top:6px}
.mull-card .mc-sat{font-size:22px;color:var(--gold);font-weight:bold;margin-top:8px}
.mull-card.back{background:repeating-linear-gradient(45deg,#16100a 0,#16100a 8px,#1a1409 8px,#1a1409 16px);cursor:default;border:1.5px solid var(--border)}
.mull-card.back:hover{transform:none;border-color:var(--border);box-shadow:none}
.mull-footer{display:flex;justify-content:center;gap:10px;padding:5px}
.mull-info{font-size:10px;color:var(--muted);text-align:center;margin-top:4px}
/* マリガン中央プレビューパネル: grid外で使うのでgrid指定を上書き */
.mull-preview-wrap .detail-panel{grid-column:unset;grid-row:unset;height:100%}

/* ── GAME SCREEN ── */
.game-screen{
  display:grid;
  grid-template-rows:40px 1fr 50px;
  grid-template-columns:1fr 220px 1fr;
  gap:3px;padding:3px;height:100vh;overflow:hidden;
  background:
    repeating-linear-gradient(88deg,
      transparent 0px,transparent 22px,
      rgba(100,64,20,.06) 22px,rgba(100,64,20,.06) 26px,
      transparent 26px,transparent 50px,
      rgba(80,48,12,.04) 50px,rgba(80,48,12,.04) 52px
    ),
    radial-gradient(ellipse 60% 40% at 20% 30%,rgba(255,240,200,.12) 0%,transparent 55%),
    radial-gradient(ellipse 50% 35% at 80% 20%,rgba(255,230,180,.1) 0%,transparent 50%),
    radial-gradient(ellipse 70% 50% at 50% 110%,rgba(140,90,30,.15) 0%,transparent 55%),
    linear-gradient(180deg,#d8c8a0 0%,#ccbc90 30%,#c4b488 60%,#b8a878 100%);
}

/* ── スマホ対応（縦画面） ── */
@media(max-width:700px){
  html,body{overflow:auto}
  #root{height:auto;min-height:100dvh}

  .game-screen{
    display:flex;flex-direction:column;
    height:auto;min-height:100dvh;overflow-y:auto;overflow-x:hidden;
    padding:4px;gap:4px;
  }
  /* ヘッダー：縦2行に */
  .g-header{
    grid-column:unset;grid-row:unset;
    grid-template-columns:1fr 1fr;
    flex-shrink:0;padding:4px 8px;gap:4px;
  }
  .g-header-center{display:none} /* タイトルは省略 */
  .sat-bar-left,.sat-bar-right{font-size:8px;padding:2px 5px}
  .sat-track{min-width:40px}
  .sat-num{font-size:10px;width:28px}

  /* フィールド：縦並び */
  .fields-area-self,.fields-area-opp{
    grid-column:unset;grid-row:unset;
    height:auto;min-height:0;
  }
  .pfield{height:auto}

  /* 中央パネル */
  .center-panel{
    grid-column:unset;grid-row:unset;
    flex-direction:row;gap:4px;
    min-height:0;
  }
  .detail-panel{flex:1;min-height:80px;max-height:140px}
  .center-btns{flex:0 0 auto;width:120px;padding:5px;gap:4px}
  .center-btn{font-size:12px;padding:8px 6px}

  /* ログ */
  .g-bottom{grid-column:unset;grid-row:unset;height:auto}
  .g-log{max-height:60px}

  /* 食材カード縮小 */
  .ing-card{width:58px;height:72px}
  .ic-img-wrap{height:32px;margin:-3px -3px 2px;width:calc(100% + 6px)}
  .ic-name{font-size:10px}
  .ic-cat{font-size:6px}
  .ing-slot-empty{width:58px;height:72px}

  /* 手札カード縮小 */
  .hcard{width:76px;height:92px}
  .hcard-img-wrap{height:42px;margin:-5px -5px 3px;width:calc(100% + 10px)}
  .hc-name{font-size:10px}
  .hc-type{font-size:7px}
  .hc-sat{font-size:12px}
  .hand-slot-empty{width:76px;height:92px}

  /* deck-mini縮小 */
  .deck-mini{width:54px;height:68px}
  .dm-icon{font-size:14px}
  .dm-count{font-size:15px}
  .dm-label{font-size:6.5px}

  /* 完成料理 */
  .rcard-done{min-width:44px;padding:3px}
  .rcard-done .rn{font-size:8px}
  .rcard-done .rs{font-size:11px}

  /* ターンバナー */
  .turn-banner-inner{font-size:20px;padding:12px 32px}

  /* 勝利タイトル */
  .winner-title{font-size:64px}
  .winner-sub{font-size:20px}

  /* タイトル画面 */
  .title-screen{padding:20px 12px;gap:16px}
  .logo h1{font-size:22px;letter-spacing:3px}
  .logo-en{font-size:14px}
  .logo-tagline{font-size:13px}
  .mbtn{width:90%;max-width:300px;font-size:13px;padding:12px}

  /* デッキビルダー */
  .db-body{flex-direction:column}
  .db-lib{width:100%;border-right:none;border-bottom:1px solid rgba(140,100,40,.3);height:55vh}
  .deck-panel{height:45vh;overflow-y:auto}
  .dp-preview{display:none} /* スマホではカード詳細プレビューを非表示 */
  .db-footer{flex-wrap:wrap;gap:5px}
  .db-footer .btn{font-size:10px;padding:4px 8px}
}
/* ヘッダー */
.g-header{
  grid-column:1/4;grid-row:1/2;
  display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;padding:3px 12px;gap:8px;
  background:rgba(255,248,230,.55);border-radius:5px;
  border:1px solid rgba(140,100,40,.3);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 1px 4px rgba(0,0,0,.12);
}
.g-header-center{display:flex;flex-direction:column;align-items:center;gap:2px}
.g-title{font-size:12px;color:var(--goldD);font-weight:800;letter-spacing:2px;white-space:nowrap;font-size:12px}
.phase-badge{font-size:10px;padding:2px 10px;border-radius:10px;border:1px solid var(--borderG);color:var(--goldD);background:rgba(74,44,8,.12);white-space:nowrap;font-weight:700}
.turn-info{font-size:10px;color:var(--muted);white-space:nowrap;font-weight:600}
/* 満腹度バー */
.sat-bar-left{display:flex;align-items:center;gap:5px;padding:2px 6px;background:rgba(255,248,220,.4);border-radius:4px;border:1px solid rgba(140,100,40,.25);justify-content:flex-start}
.sat-bar-right{display:flex;align-items:center;gap:5px;padding:2px 6px;background:rgba(255,248,220,.4);border-radius:4px;border:1px solid rgba(140,100,40,.25);justify-content:flex-end}
.sat-label{font-size:9px;color:var(--muted);width:auto;flex-shrink:0;font-weight:600}
.sat-track{flex:1;height:8px;background:rgba(0,0,0,.18);border-radius:4px;overflow:hidden;min-width:60px}
.sat-fill{height:100%;border-radius:4px;transition:width .5s ease}
.sat-fill.p0{background:linear-gradient(90deg,#208850,#40b870)}
.sat-fill.p1{background:linear-gradient(90deg,#b84018,#e06030)}
.sat-num{font-size:11px;font-weight:bold;width:34px;text-align:right;flex-shrink:0}

/* 赤: 自分フィールド（col1 / row2） */
/* 青: 相手フィールド（col3 / row2） */
.fields-area-self{grid-column:1/2;grid-row:2/3;overflow:hidden;display:flex;flex-direction:column;gap:0;min-height:0}
.fields-area-opp{grid-column:3/4;grid-row:2/3;overflow:hidden;display:flex;flex-direction:column;gap:0;min-height:0}
/* pfield は各エリアの全体を使う */
.pfield{display:flex;flex-direction:column;gap:2px;background:rgba(255,248,225,.45);border-radius:5px;padding:5px;border:1px solid rgba(140,100,40,.28);overflow:hidden;min-height:0;height:100%;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pfield.active{border-color:rgba(100,60,10,.5);background:rgba(255,248,220,.7);box-shadow:0 0 12px rgba(100,60,10,.15)}
.pfield.ai-field{border-color:rgba(120,80,160,.3);background:rgba(240,230,255,.35)}
.plabel{font-size:10px;color:var(--text);text-align:center;padding:1px 0;letter-spacing:1px;font-weight:700;flex-shrink:0}
.zlabel{font-size:8px;color:var(--dim);margin-bottom:1px;padding-left:2px;letter-spacing:.5px;flex-shrink:0;font-weight:600}
/* 食材ゾーン */
.ing-zone{background:rgba(255,245,210,.3);border-radius:4px;padding:4px;border:1px solid rgba(140,100,40,.2);flex:2;min-height:0;overflow-y:auto}
.ing-slots{display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;justify-content:center}
.ing-slot-empty{width:72px;height:88px;border-radius:5px;border:1px dashed rgba(140,100,40,.35);background:rgba(255,245,210,.12);flex-shrink:0}
.card-row{display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;justify-content:center}
.hand-area .card-row{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-start;align-content:flex-start;overflow-y:auto}
.empty-hint{font-size:9px;color:var(--faint);padding:6px}
/* 手札スロット枠 */
.hand-slots{display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start}
.hand-slot-empty{width:102px;height:123px;border-radius:6px;border:1px dashed rgba(140,100,40,.28);background:rgba(255,245,210,.1);flex-shrink:0}
/* 中央パネル */
.center-panel{grid-column:2/3;grid-row:2/3;display:flex;flex-direction:column;gap:3px;min-height:0;overflow:hidden}
.center-btns{background:rgba(255,248,220,.55);border-radius:6px;border:1px solid rgba(140,100,40,.28);padding:8px;display:flex;flex-direction:column;gap:6px;flex-shrink:0;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.center-btn{font-size:15px;padding:10px 12px;border-radius:6px;border:1px solid var(--borderG);background:rgba(74,44,8,.15);color:var(--goldD);cursor:pointer;font-family:inherit;font-weight:bold;transition:all .15s;width:100%;text-align:center}
.center-btn:hover{background:rgba(14,37,69,.25);border-color:var(--goldL)}
.center-btn.primary{background:rgba(74,44,8,.25);border-color:var(--goldD);color:var(--goldD)}
.center-btn.primary:hover{background:rgba(74,44,8,.35)}
.center-btn:disabled{opacity:.4;cursor:not-allowed}
.center-hint{font-size:20px;color:#1a1008;text-align:center;padding:6px 8px;line-height:1.6;font-weight:600}
.center-missing{font-size:16px;color:#900808;text-align:center;padding:6px 8px;font-weight:700}

/* 相手山札・ごみ箱ミニ表示（相手フィールド上部） */
.opp-deck-row{display:flex;gap:4px;justify-content:center;margin-bottom:3px;flex-shrink:0}
.opp-deck-chip{font-size:9px;color:var(--muted);background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:4px;padding:2px 7px;cursor:pointer;transition:background .1s}
.opp-deck-chip:hover{background:rgba(255,255,255,.06);color:var(--text)}

/* ingredient card in zone */
/* 食材カード画像エリア */
.ic-img-wrap{width:100%;height:42px;overflow:hidden;border-radius:3px 3px 0 0;flex-shrink:0;background:rgba(0,0,0,.06);margin:-4px -4px 3px;width:calc(100% + 8px)}
/* 手札カード画像エリア */
.hcard-img-wrap{width:100%;height:58px;overflow:hidden;border-radius:5px 5px 0 0;flex-shrink:0;background:rgba(0,0,0,.06);margin:-8px -6px 4px;width:calc(100% + 12px)}
.ing-card{width:72px;height:88px;border-radius:5px;background:rgba(255,250,230,.8);border:1px solid rgba(140,100,40,.35);padding:4px;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:all .15s;position:relative;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.ing-card:hover{transform:translateY(-3px);box-shadow:0 5px 14px rgba(0,0,0,.15);z-index:2}
.ing-card.sel{box-shadow:0 0 0 2px var(--goldL);border-color:var(--goldL)}
.ing-card.activated{opacity:.55;border-color:#38a068}
.ing-card.highlight{box-shadow:0 0 0 2px var(--vitaminL);border-color:var(--vitaminL)}
.ing-card.placed-this-turn{border-style:dashed;border-color:var(--goldL);opacity:.85}
.ing-card.toast-mark{box-shadow:0 0 0 2px #e88020,0 0 8px rgba(232,128,32,.4);border-color:#e88020}
.ing-card.toast-mark::after{content:'★';position:absolute;top:2px;right:2px;font-size:9px;line-height:1;color:#e88020;font-weight:bold}
.ing-card.placed-this-turn:hover::after{content:'手札に戻す';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap;background:rgba(0,0,0,.75);color:var(--goldL);padding:2px 6px;border-radius:3px;pointer-events:none}
.ing-card .ic-cat{font-size:8px;color:var(--dim);width:100%;text-align:center;margin-bottom:2px;font-weight:600}
.ing-card .ic-name{font-size:12px;font-weight:700;text-align:center;line-height:1.3;color:var(--text)}
.ing-card .ic-dot{width:5px;height:5px;border-radius:50%;background:var(--gold);margin-top:3px}
.ing-card .ic-act{font-size:8px;color:#38a068;margin-top:2px}
.ing-card .ic-satbuff{font-size:8px;color:#e88020;font-weight:bold;text-align:center;margin-top:1px;line-height:1}
.ing-card.protein{border-top:3px solid var(--protein)}
.ing-card.carb{border-top:3px solid var(--carb)}
.ing-card.fat{border-top:3px solid var(--fat)}
.ing-card.vitamin{border-top:3px solid var(--vitamin)}
.ing-card.mineral{border-top:3px solid var(--mineral)}

/* recipe zone */
.recipe-zone{background:rgba(0,0,0,.18);border-radius:4px;padding:4px;border:1px solid var(--border);flex:1;min-height:0;overflow-y:auto}
.rcard-done{
  width:72px;height:58px;
  background:rgba(80,46,6,.55);border:1px solid var(--goldD);border-radius:5px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:4px;flex-shrink:0;cursor:default;transition:all .15s;
}
.rcard-done:hover{transform:translateY(-2px);box-shadow:0 4px 10px var(--shadow)}
.rcard-done .rn{font-size:9px;color:#1a1008;text-align:center;line-height:1.4;font-weight:700}
.rcard-done .rs{font-size:13px;color:#301a04;font-weight:800;margin-top:2px}

/* hand */
.hand-row-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;flex-shrink:0}
.hand-area{background:rgba(0,0,0,.18);border-radius:4px;padding:6px;border:1px solid var(--border);flex:4;min-height:0;overflow-y:auto}
.hcard{
  width:102px;height:123px;
  border-radius:6px;border:1px solid var(--borderG);background:var(--bg3);
  display:flex;flex-direction:column;align-items:center;padding:5px;
  cursor:pointer;transition:all .15s;flex-shrink:0;
}
.hcard:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 6px 16px var(--shadow);z-index:2}
.hcard.sel{box-shadow:0 0 0 2px var(--goldL);transform:translateY(-6px);border-color:var(--goldL)}
.hcard.disabled{opacity:.35;cursor:not-allowed}
.hcard .hc-type{font-size:9px;padding:1px 5px;border-radius:2px;width:100%;text-align:center;margin-bottom:3px;font-weight:700}
.hc-type.ing{background:rgba(14,72,152,.15);color:#0a3880;border:1px solid rgba(14,72,152,.2)}
.hc-type.rec{background:rgba(152,14,16,.12);color:#780a0a;border:1px solid rgba(152,14,16,.18)}
.hcard .hc-name{font-size:12px;font-weight:700;text-align:center;color:var(--text);line-height:1.3;margin-top:4px}
.hcard .hc-sat{font-size:14px;color:var(--goldD);font-weight:800;margin-top:5px}
.hcard.back{background:repeating-linear-gradient(45deg,#16100a 0,#16100a 5px,#1a1409 5px,#1a1409 10px);cursor:default;border:1px solid var(--border)}
.hcard.back:hover{transform:none;box-shadow:none;border-color:var(--border)}
.deck-btns{display:flex;gap:3px}
.dbtn{font-size:9px;padding:2px 7px;border-radius:3px;border:1px solid var(--borderG);background:rgba(70,44,4,.35);color:var(--gold);cursor:pointer;font-family:inherit;transition:all .12s}
.dbtn:hover{background:rgba(110,70,8,.5);border-color:var(--gold)}
.dbtn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}

/* ── deck/trash mini cards in hand-area ── */
.hand-decks{display:flex;gap:6px;align-items:flex-start;flex-shrink:0;padding:2px 0}
.deck-mini{
  width:72px;height:90px;border-radius:6px;border:1px solid var(--borderG);
  background:rgba(255,248,220,.7);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;cursor:pointer;transition:all .15s;flex-shrink:0;
  position:relative;user-select:none;
}
.deck-mini.clickable:hover{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 6px 14px var(--shadow)}
.deck-mini.disabled-deck{opacity:.6;cursor:not-allowed}
.deck-mini .dm-label{font-size:9px;color:#1a1008;letter-spacing:.5px;font-weight:700}
.deck-mini .dm-count{font-size:20px;font-weight:bold;color:#1a1008}
.deck-mini .dm-icon{font-size:18px}
.deck-mini.ing-deck{border-color:rgba(14,72,152,.5);background:rgba(220,235,255,.7)}
.deck-mini.ing-deck .dm-label{color:#0a3060}
.deck-mini.rec-deck{border-color:rgba(152,60,14,.5);background:rgba(255,230,210,.7)}
.deck-mini.rec-deck .dm-label{color:#700808}
.deck-mini.trash-pile{border-color:rgba(140,100,40,.4);background:rgba(255,248,220,.7)}
.deck-mini.trash-pile .dm-label{color:#3a2010}
.deck-mini.clickable.ing-deck:hover{border-color:rgba(14,72,152,.7);box-shadow:0 6px 14px rgba(14,72,152,.2)}
.deck-mini.clickable.rec-deck:hover{border-color:rgba(152,60,14,.7);box-shadow:0 6px 14px rgba(152,60,14,.2)}
/* ごみ箱モーダル */
.trash-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;display:flex;align-items:center;justify-content:center}
.trash-modal{background:var(--bg2);border:1px solid var(--border);border-radius:10px;width:560px;max-width:90vw;max-height:75vh;display:flex;flex-direction:column;overflow:hidden}
.trash-modal-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border)}
.trash-modal-header h3{font-size:14px;color:var(--goldL);letter-spacing:1px}
.trash-modal-close{background:transparent;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;padding:0 4px}
.trash-modal-close:hover{color:var(--text)}
.trash-modal-body{padding:12px;overflow-y:auto;display:flex;flex-wrap:wrap;gap:8px}
.trash-card-item{
  width:110px;border-radius:7px;border:1px solid var(--border);
  background:var(--bg3);padding:8px;display:flex;flex-direction:column;gap:3px;
  cursor:pointer;transition:border-color .15s;
}
.trash-card-item:hover{border-color:var(--muted)}
.trash-card-item .ti-type{font-size:9px;color:var(--muted)}
.trash-card-item .ti-name{font-size:11px;font-weight:bold;color:var(--text);line-height:1.3}
.trash-card-item .ti-sat{font-size:13px;color:var(--gold);font-weight:bold}
.trash-modal-empty{padding:24px;color:var(--faint);font-size:12px;text-align:center;width:100%}

/* ── ANIMATIONS ── */
/* 料理完成オーバーレイ */
.serve-overlay{position:fixed;inset:0;z-index:400;pointer-events:none;display:flex;align-items:center;justify-content:center}
.serve-burst{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  animation:servePop 1.35s cubic-bezier(.17,.67,.35,1.3) forwards;
}
@keyframes servePop{
  0%{transform:scale(0) rotate(-12deg);opacity:0}
  40%{transform:scale(1.18) rotate(3deg);opacity:1}
  65%{transform:scale(0.96) rotate(-1deg)}
  80%{transform:scale(1.04) rotate(0deg);opacity:1}
  100%{transform:scale(1) rotate(0deg);opacity:0}
}
.serve-card-big{
  width:200px;background:linear-gradient(135deg,#3a1a06,#5a2e0e);
  border:2px solid var(--gold);border-radius:14px;padding:18px 14px;
  box-shadow:0 0 60px rgba(224,184,96,.7),0 0 120px rgba(224,184,96,.3);
  text-align:center;
}
.serve-card-big .sc-label{font-size:11px;color:var(--muted);letter-spacing:2px;margin-bottom:6px}
.serve-card-big .sc-name{font-size:22px;font-weight:bold;color:#fff8e8;line-height:1.3;margin-bottom:8px}
.serve-card-big .sc-sat{font-size:40px;font-weight:bold;color:var(--goldL);line-height:1}
.serve-card-big .sc-icon{font-size:48px;margin-bottom:6px}
.serve-ribbon{font-size:18px;font-weight:bold;color:#fff;background:linear-gradient(90deg,#c84020,#e86030);padding:6px 24px;border-radius:20px;letter-spacing:2px;box-shadow:0 4px 16px rgba(200,64,32,.5)}

/* ダメージ数字 */
.damage-num{
  position:fixed;font-size:52px;font-weight:bold;pointer-events:none;z-index:450;
  text-shadow:0 0 20px currentColor,0 2px 6px rgba(0,0,0,.8);
  animation:dmgFloat 1.1s ease-out forwards;
}
@keyframes dmgFloat{
  0%{transform:translateY(0) scale(.6);opacity:0}
  20%{transform:translateY(-10px) scale(1.2);opacity:1}
  60%{transform:translateY(-60px) scale(1);opacity:1}
  100%{transform:translateY(-110px) scale(.9);opacity:0}
}

/* ドローアニメ */
.draw-flash{
  position:fixed;inset:0;z-index:350;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
}
.draw-card-anim{
  width:102px;height:123px;border-radius:8px;
  border:2px solid var(--gold);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:8px;text-align:center;
  animation:drawSlide .5s cubic-bezier(.25,.46,.45,.94) forwards;
}
@keyframes drawSlide{
  0%{transform:translateY(160px) scale(.7);opacity:0;box-shadow:0 0 0 transparent}
  60%{transform:translateY(-16px) scale(1.05);opacity:1;box-shadow:0 0 40px rgba(224,184,96,.6)}
  100%{transform:translateY(0) scale(1);opacity:0;box-shadow:0 0 0 transparent}
}
.draw-card-anim.ing{background:linear-gradient(135deg,#0e2a3a,#1a3a4a)}
.draw-card-anim.rec{background:linear-gradient(135deg,#2a140a,#3a200e)}
.draw-card-anim.hidden{background:repeating-linear-gradient(45deg,#16100a 0,#16100a 8px,#1a1409 8px,#1a1409 16px);border-color:var(--borderG)}

/* 勝利画面強化 */
.winner-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:400;animation:winFadeIn .6s ease-out}
@keyframes winFadeIn{from{opacity:0}to{opacity:1}}
.winner-particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.winner-particle{
  position:absolute;border-radius:50%;
  animation:partFloat linear forwards;
}
@keyframes partFloat{
  0%{transform:translateY(100vh) rotate(0deg);opacity:1}
  100%{transform:translateY(-20vh) rotate(720deg);opacity:0}
}
.winner-title{
  font-size:96px;font-weight:900;
  color:#ffffff;
  letter-spacing:6px;text-align:center;
  text-shadow:
    -3px -3px 0 #000,
     3px -3px 0 #000,
    -3px  3px 0 #000,
     3px  3px 0 #000,
     0    0   20px rgba(255,220,80,.8),
     0    0   50px rgba(255,180,40,.4);
  animation:winPop .8s cubic-bezier(.17,.67,.35,1.4) .2s both;
}
@keyframes winPop{
  0%{transform:scale(0);opacity:0}
  70%{transform:scale(1.15)}
  100%{transform:scale(1);opacity:1}
}
.winner-sub{
  font-size:26px;font-weight:800;
  color:#ffffff;
  letter-spacing:3px;text-align:center;
  text-shadow:
    -2px -2px 0 #000,
     2px -2px 0 #000,
    -2px  2px 0 #000,
     2px  2px 0 #000,
     0    0   12px rgba(0,0,0,.8);
  animation:winFadeIn .6s ease-out .5s both;
}
.winner-btns{display:flex;gap:10px;margin-top:12px;animation:winFadeIn .6s ease-out .8s both}

/* ── カード配置アニメ ── */
.place-anim-overlay{position:fixed;inset:0;z-index:380;pointer-events:none;}
.place-card-fly{
  position:fixed;z-index:381;pointer-events:none;
  width:72px;height:88px;border-radius:6px;
  border:2px solid var(--gold);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:4px;text-align:center;
  box-shadow:0 0 24px rgba(224,184,96,.6);
  font-size:11px;color:#fff8e8;font-weight:bold;
  background:linear-gradient(135deg,#1a3a2a,#2a4a3a);
  animation:flyToZone .45s cubic-bezier(.4,0,.2,1) forwards;
}
@keyframes flyToZone{
  0%{transform:scale(1.1);opacity:1}
  60%{transform:scale(.85);opacity:.9}
  100%{transform:scale(.8);opacity:0}
}

/* ── ターン切り替えバナー ── */
.turn-banner{
  position:fixed;inset:0;z-index:390;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
}
.turn-banner-inner{
  padding:16px 48px;border-radius:12px;
  font-size:28px;font-weight:bold;letter-spacing:4px;
  border:2px solid var(--gold);
  box-shadow:0 0 40px rgba(224,184,96,.5),0 0 80px rgba(224,184,96,.2);
  animation:bannerSlide .9s cubic-bezier(.22,.61,.36,1) forwards;
}
.turn-banner-inner.my-turn{
  background:linear-gradient(135deg,rgba(15,45,15,.9),rgba(20,60,20,.9));
  color:#e8ffe8;border-color:#40c870;text-shadow:0 1px 3px rgba(0,0,0,.5);
  box-shadow:0 0 40px rgba(96,208,168,.5);
}
.turn-banner-inner.opp-turn{
  background:linear-gradient(135deg,rgba(50,15,15,.9),rgba(70,20,20,.9));
  color:#ffe8e8;border-color:#e04030;text-shadow:0 1px 3px rgba(0,0,0,.5);
  box-shadow:0 0 40px rgba(208,112,96,.5);
}
@keyframes bannerSlide{
  0%{transform:translateX(-60px) scale(.9);opacity:0}
  25%{transform:translateX(8px) scale(1.02);opacity:1}
  60%{transform:translateX(0) scale(1);opacity:1}
  80%{transform:translateX(0) scale(1);opacity:1}
  100%{transform:translateX(60px) scale(.9);opacity:0}
}

/* 既存のcoin-flip・msg-toast */
.coin-flip-screen{display:flex;flex-direction:column;height:100vh;background:var(--bg);align-items:center;justify-content:center;gap:24px}
.coin-flip-coin{font-size:80px;animation:coinSpin .6s ease-out}
@keyframes coinSpin{0%{transform:rotateY(0deg) scale(.5);opacity:0}60%{transform:rotateY(720deg) scale(1.2)}100%{transform:rotateY(1080deg) scale(1);opacity:1}}
.coin-flip-result{font-size:28px;font-weight:bold;color:var(--goldL);letter-spacing:2px;text-align:center}
.coin-flip-sub{font-size:14px;color:var(--muted);text-align:center}
.coin-flip-bar{width:200px;height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:8px}
.coin-flip-bar-fill{height:100%;background:var(--gold);border-radius:2px;animation:cfBar 2s linear forwards}
@keyframes cfBar{from{width:0%}to{width:100%}}

/* controls & log */
.g-controls{display:flex;gap:6px;padding:3px 10px;background:var(--bg2);border-radius:5px;border:1px solid var(--border);flex-wrap:wrap;align-items:center;flex-shrink:0}
.phase-hint{font-size:10px;color:var(--muted)}
.missing-hint{font-size:10px;color:#f84}
.g-bottom{grid-column:1/4;grid-row:3/4;display:flex;flex-direction:column;gap:3px;overflow:hidden;min-height:0}
.g-log{background:var(--bg2);border-radius:5px;border:1px solid var(--border);padding:2px 10px;overflow-y:auto;flex:1}
.log-line{font-size:9px;color:var(--muted);padding:1px 0;border-bottom:1px solid rgba(255,255,255,.04);line-height:1.5}
.log-line.hl{color:var(--goldL)}
.log-line.warn{color:#f08040}
.log-line.ai-log{color:#b090e0}
.msg-toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:rgba(140,50,0,.85);border:1px solid #e84;border-radius:6px;padding:5px 16px;font-size:11px;color:#fca;z-index:300;pointer-events:none}

/* ── CARD DETAIL PANEL ── */
.detail-panel{display:flex;flex-direction:column;gap:0;background:rgba(255,248,220,.55);border-radius:6px;border:1px solid rgba(140,100,40,.28);padding:0;overflow:hidden;flex:1;min-height:0;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.dp-empty{display:flex;align-items:center;justify-content:center;flex:1;flex-direction:column;gap:6px}
.dp-empty-icon{font-size:32px;opacity:.25}
.dp-empty-text{font-size:10px;color:var(--faint);text-align:center;line-height:1.8}
/* dp-card はホイールでスクロールできるよう overflow-y:scroll を使う */
.dp-card{display:flex;flex-direction:column;gap:8px;flex:1;overflow-y:scroll;padding:8px;scroll-behavior:smooth}
.dp-card::-webkit-scrollbar{width:4px}
.dp-card::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* big card preview */
.dp-preview{
  width:100%;aspect-ratio:2.5/3.5;
  border-radius:8px;border:2px solid var(--borderG);
  background:var(--bg3);display:flex;flex-direction:column;
  padding:10px;position:relative;flex-shrink:0;
  box-shadow:0 4px 16px rgba(0,0,0,.5);
}
.dp-preview.protein{border-top:5px solid var(--protein)}
.dp-preview.carb{border-top:5px solid var(--carb)}
.dp-preview.fat{border-top:5px solid var(--fat)}
.dp-preview.vitamin{border-top:5px solid var(--vitamin)}
.dp-preview.mineral{border-top:5px solid var(--mineral)}
.dp-preview.recipe-type{border-top:5px solid #c86820}
.dp-type-badge{font-size:9px;padding:2px 8px;border-radius:3px;font-weight:bold;display:inline-block;margin-bottom:8px}
.dp-card-name{font-size:17px;font-weight:bold;color:var(--goldL);line-height:1.3;margin-bottom:5px}
.dp-cat-label{font-size:10px;color:var(--muted);margin-bottom:8px}
.dp-illust-area{flex:1;display:flex;align-items:center;justify-content:center;border-radius:5px;background:rgba(255,248,220,.4);border:1px solid rgba(140,100,40,.25);margin-bottom:8px;min-height:110px;overflow:hidden;position:relative}
.dp-sat-big{font-size:26px;font-weight:bold;color:var(--gold);text-align:right;position:absolute;bottom:10px;right:12px}
.dp-sat-label{font-size:9px;color:var(--muted);position:absolute;bottom:38px;right:12px}

/* detail sections */
.dp-section{background:var(--bg);border-radius:5px;padding:9px 11px;border:1px solid rgba(140,100,40,.3)}
.dp-section-title{font-size:9px;color:#1a1008;letter-spacing:1px;margin-bottom:6px;border-bottom:1px solid rgba(140,100,40,.25);padding-bottom:4px;font-weight:800}
.dp-eff-text{font-size:12px;color:var(--text);line-height:1.9}
.dp-eff-text.no-eff{color:var(--faint);font-style:italic;font-size:11px}
.dp-keyword-box{margin-top:8px;padding:6px 8px;background:rgba(232,128,32,.12);border:1px solid rgba(232,128,32,.4);border-radius:5px}
.dp-keyword-title{font-size:10px;font-weight:800;color:#4a2c08;margin-bottom:3px}
.dp-keyword-desc{font-size:11px;color:var(--text);line-height:1.6}
.dp-req-list{display:flex;flex-wrap:wrap;gap:5px}
.dp-req-chip{font-size:10px;padding:3px 8px;border-radius:10px;background:rgba(0,0,0,.3);border:1px solid var(--border);color:var(--muted)}
.dp-req-chip.have{border-color:rgba(30,100,40,.5);color:#145808;background:rgba(180,240,190,.3)}

/* AI overlay */
.ai-thinking-overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(8,6,24,.92);border:1px solid #5a3a9a;border-radius:10px;padding:16px 26px;text-align:center;z-index:100}
.ai-thinking-overlay p{font-size:13px;color:#c8a8f0;margin-bottom:8px}
.ai-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#9070c0;margin:0 3px;animation:aib .8s infinite}
.ai-dot:nth-child(2){animation-delay:.25s}.ai-dot:nth-child(3){animation-delay:.5s}

/* ── SELECTION MODAL ── */
.sel-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:150}

.sel-card.carb{border-top:2px solid var(--carb)}
.sel-card.fat{border-top:2px solid var(--fat)}
.sel-card.vitamin{border-top:2px solid var(--vitamin)}
.sel-card.mineral{border-top:2px solid var(--mineral)}
.sel-footer{display:flex;gap:8px;justify-content:center;flex-shrink:0;flex-wrap:wrap}
.sel-skip{font-size:10px;color:var(--muted);text-align:center;cursor:pointer;text-decoration:underline;padding:4px}

@keyframes aib{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}

const uid=()=>Math.random().toString(36).slice(2,8);
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]];}return b;};
const addLog=(G,msg,type='n')=>({...G,log:[{msg,type,id:uid()},...G.log].slice(0,50)});
const ovP=(G,pi,u)=>{const pl=[...G.players];pl[pi]={...pl[pi],...u};return{...G,players:pl};};
const mkI=def=>({...def,_uid:def.id+'_'+uid(),_isRec:false,_used:false});
const mkR=def=>({...def,_uid:def.id+'_r'+uid(),_isRec:true});

function buildDeckFromCfg(ic,rc){
  const i=[];Object.entries(ic).forEach(([id,n])=>{const d=ING_MAP[id];if(d)for(let k=0;k<n;k++)i.push(mkI(d));});
  const r=[];Object.entries(rc).forEach(([id,n])=>{const d=REC_MAP[id];if(d)for(let k=0;k<n;k++)r.push(mkR(d));});
  return{i:shuffle(i),r:shuffle(r)};
}

function initPlayers(c0,c1){

function encodeDeckCode(name, ingDeck, recDeck){
  const data={n:name,i:ingDeck,r:recDeck};
  try{
    return btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  }catch(e){return null;}
}
function decodeDeckCode(code){
  try{
    const data=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    if(!data.i||!data.r)return null;
    return {name:data.n||'インポートデッキ',ingDeck:data.i,recDeck:data.r};
  }catch(e){return null;}
}

const Audio={
  _bgm:null,_vol:0.5,_seVol:0.7,_muted:false,
  _seCache:{},
  se(name){
    if(this._muted)return;
    const path=`sounds/${name}.mp3`;
    let a=this._seCache[name];
    if(!a){a=new window.Audio(path);this._seCache[name]=a;}
    else{a.currentTime=0;}
    a.volume=this._seVol;
    a.play().catch(()=>{});
  },
  playBgm(name){
    if(this._bgm){this._bgm.pause();this._bgm=null;}
    if(this._muted)return;
    const a=new window.Audio(`sounds/${name}.mp3`);
    a.loop=true;a.volume=this._vol;
    a.play().catch(()=>{});
    this._bgm=a;
  },
  stopBgm(){if(this._bgm){this._bgm.pause();this._bgm=null;}},
  setMute(m){
    this._muted=m;
    if(m&&this._bgm)this._bgm.pause();
    else if(!m&&this._bgm)this._bgm.play().catch(()=>{});
  },
  setBgmVol(v){this._vol=v;if(this._bgm)this._bgm.volume=v;},
  setSeVol(v){this._seVol=v;},
};

function checkWin(G){
  if(G.players[0].satiety>=20)return{...G,winner:1};
  if(G.players[1].satiety>=20)return{...G,winner:0};
  // ingDeck/recDeckは数値（オンライン）または配列（ローカル）の両方に対応
  function deckLen(d){return Array.isArray(d)?d.length:(typeof d==='number'?d:0);}
  // 両方の山札が切れたプレイヤーが負け（引こうとした側＝currentPlayerが負け）
  const p=G.players[G.currentPlayer];
  if(deckLen(p.ingDeck)===0&&deckLen(p.recDeck)===0&&p.hand.length===0){
    return{...G,winner:1-G.currentPlayer};
  }
  return G;
}
// ── GAME HELPERS ──
function ph(p,cards){let h=[...p.hand,...cards],t=[...p.trash];if(h.length>10){t=[...t,...h.slice(10)];h=h.slice(0,10);}return{hand:h,trash:t};}
function drawI(G,pi,n){const p=G.players[pi];const d=p.ingDeck.slice(0,Math.min(n,p.ingDeck.length));if(!d.length)return G;const r=ph(p,d);return addLog(ovP(G,pi,{ingDeck:p.ingDeck.slice(d.length),...r}),`P${pi+1}: 食材${d.length}枚ドロー`);}
function drawR(G,pi,n){const p=G.players[pi];const d=p.recDeck.slice(0,Math.min(n,p.recDeck.length));if(!d.length)return G;const r=ph(p,d);return addLog(ovP(G,pi,{recDeck:p.recDeck.slice(d.length),...r}),`P${pi+1}: レシピ${d.length}枚ドロー`);}
function drawToZone(G,pi,n){let s=G;for(let i=0;i<n;i++){const p=s.players[pi];if(!p.ingDeck.length)break;const c={...p.ingDeck[0],_satBuff:0};s=p.ingZone.length<7?ovP(s,pi,{ingDeck:p.ingDeck.slice(1),ingZone:[...p.ingZone,c]}):ovP(s,pi,{ingDeck:p.ingDeck.slice(1),trash:[...p.trash,c]});s=addLog(s,`P${pi+1}: ${c.name}を直接配置`);}return s;}
function bufR(G,pi,n){return addLog(ovP(G,pi,{bufNextRec:(G.players[pi].bufNextRec||0)+n}),`P${pi+1}: 次の料理+${n}バフ`);}
function setDeb(G,pi,k,v){return addLog(ovP(G,pi,{debuffs:{...G.players[pi].debuffs,[k]:v}}),`P${pi+1}: デバフ[${k}]`,'warn');}
function setOppDeb(G,pi,v){const o=1-pi;return addLog(ovP(G,o,{debuffs:{...G.players[o].debuffs,satBuff:(G.players[o].debuffs.satBuff||0)+v}}),`P${pi+1}: 相手次ターン満腹+${v}設定`,'warn');}
function redOpp(G,pi,n){const o=1-pi;return addLog(ovP(G,o,{satiety:Math.max(0,G.players[o].satiety-n)}),`P${pi+1}: 相手満腹-${n}！`,'warn');}
function redSelf(G,pi,n){return addLog(ovP(G,pi,{satiety:Math.max(0,G.players[pi].satiety-n)}),`P${pi+1}: 自満腹-${n}`);}
function destOpp(G,pi,uid_){
  const o=1-pi;const p=G.players[o];if(!p.ingZone.length)return addLog(G,'相手食材なし');
  const c=uid_?p.ingZone.find(x=>x._uid===uid_):p.ingZone[p.ingZone.length-1];
  if(!c)return addLog(G,'対象なし');
  return addLog(ovP(G,o,{ingZone:p.ingZone.filter(x=>x._uid!==c._uid),trash:[...p.trash,c]}),`P${pi+1}: ${c.name}をごみ箱へ！`,'warn');
}
function bounceOpp(G,pi,uid_){
  const o=1-pi;const p=G.players[o];if(!p.ingZone.length)return addLog(G,'相手食材なし');
  const c=uid_?p.ingZone.find(x=>x._uid===uid_):p.ingZone[p.ingZone.length-1];
  if(!c)return addLog(G,'対象なし');
  return addLog(ovP(G,o,{ingZone:p.ingZone.filter(x=>x._uid!==c._uid),ingDeck:shuffle([...p.ingDeck,c])}),`P${pi+1}: ${c.name}を山札へ！`,'warn');
}
function rndBounce(G,pi){
  let s=G;[0,1].forEach(p=>{
    const pl=s.players[p];if(!pl.hand.length)return;
    const idx=0|Math.random()*pl.hand.length;const c=pl.hand[idx];
    const hand=pl.hand.filter((_,i)=>i!==idx);
    s=addLog(ovP(s,p,{hand,...(c._isRec?{recDeck:shuffle([...pl.recDeck,c])}:{ingDeck:shuffle([...pl.ingDeck,c])})}),`P${p+1}: ${c.name}が山札へ`,'warn');
  });return s;
}
function condRec(G,pi,thr,op){
  const o=1-pi;const len=op==='ge'?G.players[o].ingZone.length:G.players[pi].ingZone.length;
  return(op==='ge'?len>=thr:len<=thr)?drawR(G,pi,1):addLog(G,`P${pi+1}: 条件不成立`);
}
function condIng(G,pi,thr,n){
  const len=G.players[pi].ingZone.length;return len<=thr?drawI(G,pi,n):addLog(G,`P${pi+1}: 条件不成立`);
}
function revOpp(G,pi){return addLog(ovP(G,1-pi,{revealed:true}),`P${pi+1}: 相手手札全公開！`,'warn');}

// pending: G に {pending:{type,pi,cardId,step,...}} を乗せて選択待ちにする
function pending(G,obj){return {...G,pending:obj};}
function clearPending(G){const{pending:_,...rest}=G;return rest;}

// BLOCK ENGINE
// ============================================================

function mkPending(G,pd){return{...G,pending:pd,_isPending:true};}

function runBlocks(G,pi,blocks,cardId){
  let s=G;let prevDone=true;
  for(let i=0;i<blocks.length;i++){
    const blk=blocks[i];
    if(blk.type==='ifPrev'){
      if(!prevDone){
        // 条件不成立：ネストブロックなしの場合は次の1ブロックもスキップ
        if(!blk.blocks||!blk.blocks.length)i++;
        prevDone=false;continue;
      }
      if(blk.blocks&&blk.blocks.length){
        const res2=runBlocks(s,pi,blk.blocks,cardId);
        if(res2&&res2._isPending){const r={...res2};delete r._isPending;r.pending={...r.pending,resume:{pi,blocks:blocks.slice(i+1),cardId},prevDone:true};return r;}
        s=res2;s=checkWin(s);if(s.winner!=null)return s;
      }
      continue;
    }
    if(blk.type==='elsePrev'){
      if(prevDone){continue;}
      const res2=runBlocks(s,pi,blk.blocks||[],cardId);
      if(res2&&res2._isPending){const r={...res2};delete r._isPending;r.pending={...r.pending,resume:{pi,blocks:blocks.slice(i+1),cardId},prevDone:false};return r;}
      s=res2;prevDone=false;s=checkWin(s);if(s.winner!=null)return s;continue;
    }
    const res=execBlock(s,pi,blk,cardId);
    if(res&&res._isPending){
      const r={...res};delete r._isPending;
      r.pending={...r.pending,resume:{pi,blocks:blocks.slice(i+1),cardId},prevDone:true};
      return r;
    }
    if(res===null){prevDone=false;}
    else{s=res;prevDone=true;}
    s=checkWin(s);if(s.winner!=null)return s;
  }
  return s;
}

function runBlocksFrom(G,pi,blocks,cardId,prevDone){
  let s=G;
  for(let i=0;i<blocks.length;i++){
    const blk=blocks[i];
    if(blk.type==='ifPrev'){
      if(!prevDone){
        if(!blk.blocks||!blk.blocks.length)i++;
        prevDone=false;continue;
      }
      if(blk.blocks&&blk.blocks.length){
        const res2=runBlocks(s,pi,blk.blocks,cardId);
        if(res2&&res2._isPending){const r={...res2};delete r._isPending;r.pending={...r.pending,resume:{pi,blocks:blocks.slice(i+1),cardId},prevDone:true};return r;}
        s=res2;s=checkWin(s);if(s.winner!=null)return s;
      }
      continue;
    }
    if(blk.type==='elsePrev'){
      if(prevDone){continue;}
      const res2=runBlocks(s,pi,blk.blocks||[],cardId);
      if(res2&&res2._isPending){const r={...res2};delete r._isPending;r.pending={...r.pending,resume:{pi,blocks:blocks.slice(i+1),cardId},prevDone:false};return r;}
      s=res2;prevDone=false;s=checkWin(s);if(s.winner!=null)return s;continue;
    }
    const res=execBlock(s,pi,blk,cardId);
    if(res&&res._isPending){
      const r={...res};delete r._isPending;
      r.pending={...r.pending,resume:{pi,blocks:blocks.slice(i+1),cardId},prevDone};
      return r;
    }
    if(res===null){prevDone=false;}
    else{s=res;prevDone=true;}
    s=checkWin(s);if(s.winner!=null)return s;
  }
  return s;
}

function resumeBlocks(G,chosen){
  const pd=G.pending;if(!pd)return G;
  const{pi,blocks,cardId}=pd.resume||{pi:G.currentPlayer,blocks:[],cardId:''};
  let s=clearPending(G);
  const r=resolveBlockChoice(s,pi,pd,chosen);
  if(r===null){
    if(!blocks||!blocks.length)return s;
    if(blocks[0]&&blocks[0].type==='ifPrev'){
      // prevDone=false: ifPrevとその次のブロック（ネストなしの場合）もスキップ
      const skip=(!blocks[0].blocks||!blocks[0].blocks.length)?2:1;
      return blocks.length>skip?runBlocksFrom(s,pi,blocks.slice(skip),cardId,false):s;
    }
    if(blocks[0]&&blocks[0].type==='elsePrev'){
      const res2=runBlocks(s,pi,blocks[0].blocks||[],cardId);
      return blocks.length>1?runBlocksFrom(res2,pi,blocks.slice(1),cardId,false):res2;
    }
    return runBlocksFrom(s,pi,blocks,cardId,false);
  }
  s=r;s=checkWin(s);if(s.winner!=null)return s;
  if(!blocks||!blocks.length)return s;
  return runBlocksFrom(s,pi,blocks,cardId,true);
}

function execBlock(G,pi,blk,cardId){
  const p=G.players[pi];const opp=1-pi;
  switch(blk.type){
    case 'drawIng':return drawI(G,pi,blk.n||1);
    case 'drawRec':return drawR(G,pi,blk.n||1);
    case 'drawToZone':return drawToZone(G,pi,blk.n||1);
    case 'bufNextRec':return bufR(G,pi,blk.n||1);
    case 'setDebuff':return setDeb(G,pi,blk.key,blk.val);
    case 'setOppDebuff':
      if(blk.key){
        const o=1-pi;
        return addLog(ovP(G,o,{debuffs:{...G.players[o].debuffs,[blk.key]:blk.val}}),`P${pi+1}: 相手にデバフ[${blk.key}]`,'warn');
      }
      return setOppDeb(G,pi,blk.n||3);
    case 'redOppSat':return redOpp(G,pi,blk.n||1);
    case 'redSelfSat':return redSelf(G,pi,blk.n||1);
    case 'revealOpp':return revOpp(G,pi);
    case 'rndBounce':return rndBounce(G,pi);
    case 'retAllHand':return retAll(G,pi,blk.ing||0,blk.rec||0);
    case 'discAllHand':return discAll(G,pi,blk.ing||0,blk.rec||0);
    case 'retAllDrawByOpp':return retByOpp(G,pi);
    case 'selfTrash':{
      const target=p.ingZone.find(c=>c.id===cardId);
      if(!target)return G;
      return addLog(ovP(G,pi,{ingZone:p.ingZone.filter(c=>c._uid!==target._uid),trash:[...p.trash,target]}),`P${pi+1}: ${target.name}をごみ箱へ`);
    }
    case 'condIngZone':{
      const len=p.ingZone.length;
      const ok=blk.op==='le'?len<=blk.n:len>=blk.n;
      if(!ok)return addLog(G,`P${pi+1}: 条件不成立`);
      return runBlocks(G,pi,blk.then,cardId);
    }
    case 'condOppZone':{
      const len=G.players[opp].ingZone.length;
      const ok=blk.op==='le'?len<=blk.n:len>=blk.n;
      if(!ok)return addLog(G,`P${pi+1}: 条件不成立`);
      return runBlocks(G,pi,blk.then,cardId);
    }
    case 'discardHand':{
      if(!p.hand.length)return blk.optional?null:G;
      const multi=blk.n||1;const canSkip=!!blk.optional;
      const cands=blk.filter?p.hand.filter(blk.filter):p.hand;
      if(!cands.length)return blk.optional?null:addLog(G,`P${pi+1}: 手札に対象なし`);
      return mkPending(G,{type:'discardHand',pi,
        title:canSkip?`手札を${multi}枚ごみ箱に送る（任意）`:`手札を${multi}枚ごみ箱へ`,
        desc:canSkip?'送るカードを選んでください（スキップ可）':`${multi}枚選んでください`,
        filter:blk.filter||(()=>true),filterKey:blk.filterKey||null,source:'hand',multi,canSkip});
    }
    case 'retHand':{
      if(p.hand.length<(blk.n||1))return G;
      return mkPending(G,{type:'retHand',pi,
        title:`手札を${blk.n||1}枚山札に戻す`,
        desc:'山札に戻すカードを選んでください',
        filter:()=>true,filterKey:null,source:'hand',multi:blk.n||1});
    }
    case 'recoverTrash':{
      const filter=blk.filter||(c=>!c._isRec);
      const cands=p.trash.filter(filter);
      if(!cands.length)return addLog(G,`P${pi+1}: ごみ箱に対象なし`);
      return mkPending(G,{type:'trash_to_hand',pi,
        title:blk.title||'ごみ箱から手札へ回収',
        desc:'回収するカードを選んでください',
        filter,filterKey:blk.filterKey||null,candidates:cands,source:'trash'});
    }
    case 'recoverTrashToDeck':{
      const cands=p.trash.filter(c=>!c._isRec);
      if(!cands.length)return addLog(G,`P${pi+1}: ごみ箱に食材なし`);
      return mkPending(G,{type:'trash_to_ingdeck',pi,
        title:'ごみ箱から食材を食材山札へ戻す',
        desc:'戻す食材カードを選んでください',
        filter:c=>!c._isRec,filterKey:'ingredient',candidates:cands,source:'trash'});
    }
    case 'selectIngZone':{
      if(!p.ingZone.length)return addLog(G,'食材ゾーンが空');
      return mkPending(G,{type:'selectIngZone_'+blk.then,pi,
        title:blk.title||'食材ゾーンからカードを選ぶ',
        desc:blk.desc||'カードを選んでください',
        filter:c=>p.ingZone.some(z=>z._uid===c._uid),
        source:'ingZone',then:blk.then,multi:blk.multi||1});
    }
    case 'selectOppZone':{
      const oppP=G.players[opp];
      if(!oppP.ingZone.length)return addLog(G,'相手食材ゾーンが空');
      return mkPending(G,{type:'selectOppZone_'+blk.then,pi,
        title:blk.then==='trash'?'相手の食材ゾーンから1枚をごみ箱へ':'相手の食材ゾーンから1枚を山札へ',
        desc:'対象のカードを選んでください',
        filter:c=>oppP.ingZone.some(z=>z._uid===c._uid),
        source:'oppIngZone',then:blk.then});
    }
    case 'selectHand':{
      const filter=blk.filter||(()=>true);
      const cands=p.hand.filter(filter);
      if(!cands.length)return blk.optional?null:addLog(G,`P${pi+1}: 手札に対象なし`);
      const canSkip=!!blk.optional;
      return mkPending(G,{type:'selectHand_'+blk.then,pi,
        title:blk.title||'手札からカードを選ぶ',
        desc:blk.desc||(canSkip?'選んでください（スキップ可）':'選んでください'),
        filter,source:'hand',then:blk.then,canSkip,multi:blk.multi||1});
    }
    case 'selectIngZoneMulti':{
      if(p.ingZone.length<(blk.n||2))return addLog(G,`食材ゾーンに${blk.n||2}枚以上必要`);
      return mkPending(G,{type:'pork_step1',pi,
        title:`食材ゾーンから${blk.n||2}枚選ぶ`,
        desc:`${blk.n||2}枚選んでください（次に手札に戻す方を選びます）`,
        filter:c=>p.ingZone.some(z=>z._uid===c._uid),
        source:'ingZone',multi:blk.n||2});
    }
    case 'searchIngDeck':{
      const filter2=blk.filter||(()=>true);
      const ingArr=Array.isArray(p.ingDeck)?p.ingDeck:[];
      const cands2=ingArr.filter(filter2);
      if(!cands2.length)return addLog(G,`P${pi+1}: 食材山札に対象なし`);
      return mkPending(G,{type:'searchIngDeck',pi,
        title:blk.title||'食材山札からカードを選ぶ',
        desc:'手札に加えるカードを選んでください',
        candidates:cands2,
        filter:filter2,source:'ingDeck'});
    }
    case 'addSelfSat':{
      return addLog(ovP(G,pi,{satiety:Math.min(20,G.players[pi].satiety+(blk.n||1))}),`P${pi+1}: 自満腹+${blk.n||1}`);
    }
    case 'addOppSat':{
      const o=1-pi;
      return addLog(ovP(G,o,{satiety:Math.min(20,G.players[o].satiety+(blk.n||1))}),`P${pi+1}: 相手満腹+${blk.n||1}`,'warn');
    }
    case 'condOppHand':{
      const oppLen=G.players[1-pi].hand.length;
      if(oppLen>=(blk.n||1))return addLog(G,`P${pi+1}: 相手手札${oppLen}枚（条件成立）`);
      return null;
    }
    case 'drawIngOpp':{
      return drawI(G,1-pi,blk.n||1);
    }
    case 'condOppServedLast':{
      if(G.players[1-pi].servedLastTurn)return addLog(G,`P${pi+1}: 相手が前ターンに料理提供（条件成立）`);
      return null;
    }
    case 'recoverTrash2':{
      const filter3=blk.filter||(c=>!c._isRec);
      const cands3=p.trash.filter(filter3);
      if(!cands3.length)return addLog(G,`P${pi+1}: ごみ箱に対象なし`);
      const n3=Math.min(blk.n||2,cands3.length);
      return mkPending(G,{type:'trash_to_hand_multi',pi,
        title:blk.title||`ごみ箱から${n3}枚選んで手札へ`,
        desc:`${n3}枚選んでください`,
        filter:filter3,filterKey:blk.filterKey||null,candidates:cands3,source:'trash',multi:n3});
    }
    case 'markIngZone':{
      if(!p.ingZone.length)return addLog(G,`P${pi+1}: 食材ゾーンが空`);
      return mkPending(G,{type:'markIngZone',pi,
        title:'食材ゾーンのカードを1枚選ぶ',
        desc:'マークするカードを選んでください（そのカードを使った料理完成時に相手満腹+2）',
        filter:()=>true,source:'ingZone'});
    }
    default:return G;
  }
}

function resolveBlockChoice(G,pi,pd,chosen){
  const p=G.players[pi];const opp=1-pi;
  if(chosen[0]==='skip')return null;
  if(pd.type==='discardHand'){
    const cards=chosen.map(u=>p.hand.find(c=>c._uid===u)).filter(Boolean);
    if(!cards.length)return null;
    const hand=p.hand.filter(c=>!chosen.includes(c._uid));
    return addLog(ovP(G,pi,{hand,trash:[...p.trash,...cards]}),`P${pi+1}: ${cards.map(c=>c.name).join('・')}をごみ箱へ`);
  }
  if(pd.type==='retHand'){
    const cards=chosen.map(u=>p.hand.find(c=>c._uid===u)).filter(Boolean);
    if(!cards.length)return null;
    const hand=p.hand.filter(c=>!chosen.includes(c._uid));
    let iD=[...p.ingDeck],rD=[...p.recDeck];
    cards.forEach(c=>{if(c._isRec)rD=shuffle([...rD,c]);else iD=shuffle([...iD,c]);});
    return addLog(ovP(G,pi,{hand,ingDeck:iD,recDeck:rD}),`P${pi+1}: ${cards.map(c=>c.name).join('・')}を山札へ`);
  }
  if(pd.type==='searchIngDeck'){
    const p2=G.players[pi];
    const card=p2.ingDeck.find(c=>c._uid===chosen[0]);
    if(!card)return G;
    const ingDeck=shuffle(p2.ingDeck.filter(c=>c._uid!==card._uid));
    const r=ph(p2,[card]);
    return addLog(ovP(G,pi,{ingDeck,...r}),`P${pi+1}: ${card.name}をサーチ`);
  }
  if(pd.type==='trash_to_hand_multi'){
    const p2=G.players[pi];
    const cards=chosen.map(u=>p2.trash.find(c=>c._uid===u)).filter(Boolean);
    if(!cards.length)return G;
    const p3={...p2,trash:p2.trash.filter(c=>!chosen.includes(c._uid))};
    const r=ph(p3,cards);
    return addLog(ovP(G,pi,r),`P${pi+1}: ${cards.map(c=>c.name).join('・')}を手札へ`);
  }
  if(pd.type==='trash_to_hand'){
    const card=p.trash.find(c=>c._uid===chosen[0]);if(!card)return G;
    const trashRemoved=p.trash.filter(c=>c._uid!==card._uid);
    const p2={...p,trash:trashRemoved};
    const r=ph(p2,[card]);
    return addLog(ovP(G,pi,r),`P${pi+1}: ${card.name}を手札へ`);
  }
  if(pd.type==='trash_to_ingdeck'){
    const card=p.trash.find(c=>c._uid===chosen[0]);if(!card)return G;
    return addLog(ovP(G,pi,{trash:p.trash.filter(c=>c._uid!==card._uid),ingDeck:shuffle([...p.ingDeck,card])}),`P${pi+1}: ${card.name}を食材山札へ`);
  }
  if(pd.type==='selectIngZone_toHand'){
    const card=p.ingZone.find(c=>c._uid===chosen[0]);if(!card)return G;
    const cleanCard={...card,_satBuff:0};
    const r=ph(p,[cleanCard]);
    return addLog(ovP(G,pi,{ingZone:p.ingZone.filter(c=>c._uid!==card._uid),...r}),`P${pi+1}: ${card.name}を手札へ`);
  }
  if(pd.type==='selectIngZone_retAndDraw'){
    const card=p.ingZone.find(c=>c._uid===chosen[0]);if(!card)return G;
    const ingZone=p.ingZone.filter(c=>c._uid!==card._uid);
    const cleanCard={...card,_satBuff:0};
    const ingDeck=shuffle([...p.ingDeck,cleanCard]);
    let s=addLog(ovP(G,pi,{ingZone,ingDeck}),`P${pi+1}: ${card.name}を山札へ戻した`);
    return drawToZone(s,pi,1);
  }
  if(pd.type==='selectIngZone_searchSame'){
    const ref=p.ingZone.find(c=>c._uid===chosen[0]);if(!ref)return G;
    const found=p.ingDeck.find(c=>c.id===ref.id);
    if(!found)return addLog(G,`P${pi+1}: 山札に${ref.name}なし`);
    const ingDeck=shuffle(p.ingDeck.filter(c=>c._uid!==found._uid));
    const r=ph(p,[found]);
    return addLog(ovP(G,pi,{ingDeck,...r}),`P${pi+1}: ${found.name}をサーチ`);
  }
  if(pd.type==='selectHand_retToIngDeck'){
    const card=p.hand.find(c=>c._uid===chosen[0]);if(!card)return G;
    const hand=p.hand.filter(c=>c._uid!==card._uid);
    return addLog(ovP(G,pi,{hand,ingDeck:shuffle([...p.ingDeck,card])}),`P${pi+1}: ${card.name}を食材山札へ`);
  }
  if(pd.type==='selectHand_retToRecDeck'){
    const card=p.hand.find(c=>c._uid===chosen[0]);if(!card)return G;
    const hand=p.hand.filter(c=>c._uid!==card._uid);
    return addLog(ovP(G,pi,{hand,recDeck:shuffle([...p.recDeck,card])}),`P${pi+1}: ${card.name}をレシピ山札へ`);
  }
  if(pd.type==='selectOppZone_trash'){
    const oppP=G.players[opp];
    const card=oppP.ingZone.find(c=>c._uid===chosen[0]);if(!card)return G;
    return addLog(ovP(G,opp,{ingZone:oppP.ingZone.filter(c=>c._uid!==card._uid),trash:[...oppP.trash,card]}),`P${pi+1}: ${card.name}をごみ箱へ！`,'warn');
  }
  if(pd.type==='selectOppZone_deck'){
    const oppP=G.players[opp];
    const card=oppP.ingZone.find(c=>c._uid===chosen[0]);if(!card)return G;
    const cleanCard={...card,_satBuff:0};
    return addLog(ovP(G,opp,{ingZone:oppP.ingZone.filter(c=>c._uid!==card._uid),ingDeck:shuffle([...oppP.ingDeck,cleanCard])}),`P${pi+1}: ${card.name}を山札へ！`,'warn');
  }
  if(pd.type==='selectOppZone_searchSame'){
    const oppP=G.players[opp];
    const ref=oppP.ingZone.find(c=>c._uid===chosen[0]);if(!ref)return G;
    const p2=G.players[pi];
    const found=p2.ingDeck.find(c=>c.id===ref.id);
    if(!found)return addLog(G,`P${pi+1}: 食材山札に${ref.name}なし`);
    return addLog(ovP(G,pi,{ingDeck:shuffle(p2.ingDeck.filter(c=>c._uid!==found._uid)),...ph(p2,[found])}),`P${pi+1}: ${found.name}をサーチ`);
  }
  if(pd.type==='pork_step1'){
    if(chosen.length<2)return addLog(G,'2枚選択してください');
    const resume=pd.resume||{pi,blocks:[],cardId:''};
    return {...G,pending:{type:'pork_step2',pi,uids:chosen,resume,
      title:'どちらを手札に戻す？',
      desc:'手札に戻す方を1枚選んでください（もう一方は山札へ）',
      filter:c=>chosen.includes(c._uid),source:'ingZone',multi:1}};
  }
  if(pd.type==='pork_step2'){
    const cards=pd.uids.map(u=>p.ingZone.find(c=>c._uid===u)).filter(Boolean);
    if(cards.length<2)return G;
    const toHand=cards.find(c=>c._uid===chosen[0]);
    const toDeck=cards.find(c=>c._uid!==chosen[0]);
    if(!toHand||!toDeck)return G;
    const ingZone=p.ingZone.filter(c=>!pd.uids.includes(c._uid));
    const r=ph(p,[toHand]);
    return addLog(ovP(G,pi,{ingZone,ingDeck:shuffle([...p.ingDeck,toDeck]),...r}),`P${pi+1}: ${toHand.name}→手札、${toDeck.name}→山札`);
  }
  // レシピ山札から選択して手札へ
  if(pd.type==='searchRecDeck'){
    const p2=G.players[pi];
    const card=p2.recDeck.find(c=>c._uid===chosen[0]);
    if(!card)return G;
    const recDeck=shuffle(p2.recDeck.filter(c=>c._uid!==card._uid));
    const r=ph(p2,[card]);
    return addLog(ovP(G,pi,{recDeck,...r}),`P${pi+1}: ${card.name}をサーチ`);
  }
  // 食材ゾーンのカードに満腹バフを付与する
  if(pd.type==='markIngZone'){
    const p2=G.players[pi];
    const target=p2.ingZone.find(c=>c._uid===chosen[0]);
    if(!target)return G;
    const ingZone=p2.ingZone.map(c=>c._uid===chosen[0]?{...c,_satBuff:3}:c);
    return addLog(ovP(G,pi,{ingZone}),`P${pi+1}: ${target.name}に【満腹バフ：3】を付与`);
  }
  return G;
}

// ── 選択完了後の処理 ──
// resolvePending は resumeBlocks にブリッジ
function resolvePending(G,chosen){return resumeBlocks(G,chosen);}

function srchCat(G,pi,cat){
  const p=G.players[pi];const f=p.ingDeck.find(c=>c.cat===cat);
  if(!f)return addLog(G,`山札に${cat}なし`);
  const ingDeck=shuffle(p.ingDeck.filter(c=>c._uid!==f._uid));
  const r=ph(p,[f]);
  return addLog(ovP(G,pi,{ingDeck,...r}),`P${pi+1}: ${f.name}サーチ`);
}
function srchRec(G,pi){
  const p=G.players[pi];if(!p.recDeck.length)return addLog(G,'レシピ山札空');
  const f=p.recDeck[0];
  return addLog(ovP(G,pi,{recDeck:shuffle(p.recDeck.slice(1)),...ph(p,[f])}),`P${pi+1}: ${f.name}サーチ`);
}
function discAll(G,pi,in_,re_){
  const p=G.players[pi];let s=ovP(G,pi,{hand:[],trash:[...p.trash,...p.hand]});
  s=drawI(s,pi,in_);return drawR(s,pi,re_);
}
function retAll(G,pi,in_,re_){
  const p=G.players[pi];const i=p.hand.filter(c=>!c._isRec);const r=p.hand.filter(c=>c._isRec);
  let s=ovP(G,pi,{hand:[],ingDeck:shuffle([...p.ingDeck,...i]),recDeck:shuffle([...p.recDeck,...r])});
  s=drawI(s,pi,in_);return drawR(s,pi,re_);
}
function retByOpp(G,pi){
  const o=1-pi;const n=G.players[o].ingZone.length;const p=G.players[pi];
  const i=p.hand.filter(c=>!c._isRec);const r=p.hand.filter(c=>c._isRec);
  let s=ovP(G,pi,{hand:[],ingDeck:shuffle([...p.ingDeck,...i]),recDeck:shuffle([...p.recDeck,...r])});
  return n>0?drawI(s,pi,n):s;
}

function serveRecipe(G,pi,recUid,ingUids){
  const p=G.players[pi];const rec=p.hand.find(c=>c._uid===recUid);if(!rec)return G;
  const buf=p.bufNextRec||0;const gain=rec.sat+buf;const opp=1-pi;
  const used=p.ingZone.filter(c=>ingUids.includes(c._uid));
  const toastBonus=used.reduce((a,c)=>a+(c._satBuff||0),0);
  let G2=ovP(G,pi,{hand:p.hand.filter(c=>c._uid!==recUid),ingZone:p.ingZone.filter(c=>!ingUids.includes(c._uid)),trash:[...p.trash,...used],recZone:[...p.recZone,rec],bufNextRec:0,servedLastTurn:true});
  G2=ovP(G2,opp,{satiety:Math.min(20,G2.players[opp].satiety+gain+toastBonus)});
  const toastMsg=toastBonus>0?`（満腹バフ+${toastBonus}）`:'';
  G2=addLog(G2,`P${pi+1}: 【${rec.name}】完成！相手+${gain+toastBonus}！${toastMsg}`,'hl');
  // 唐辛子バフチェック：opp（唐辛子起動者）がchiliWatchを持っている→opp自身の満腹-1
  if(G2.players[opp]&&G2.players[opp].debuffs&&G2.players[opp].debuffs.chiliWatch){
    G2=ovP(G2,opp,{satiety:Math.max(0,G2.players[opp].satiety-1)});
    G2=addLog(G2,`唐辛子の効果！P${opp+1}の満腹度-1`,'warn');
  }
  G2=checkWin(G2);if(G2.winner!=null)return G2;
  const fn=REC_FN[rec.id];
  if(fn){try{G2=fn(G2,pi);}catch(e){console.error(e);}}
  if(G2.pending)return G2;
  return checkWin(G2);
}
function endTurn(G){
  const pi=G.currentPlayer;const opp=1-pi;let s=G;
  const p=s.players[pi];
  if(p.debuffs.satBuff){
    const v=p.debuffs.satBuff;
    s=ovP(s,pi,{satiety:Math.min(20,p.satiety+v),debuffs:{...p.debuffs,satBuff:0}});
    s=addLog(s,`P${pi+1}: バフで満腹+${v}`,'warn');s=checkWin(s);if(s.winner!=null)return s;
  }
  const np=[...s.players];
  // 現ターンプレイヤー（pi）のリセット
  const piDebuffs={...np[pi].debuffs};
  // noServeはactivate→serve遷移時にチェック・消費するためここでは減らさない
  // chiliWatchはpiのターン中に起動→oppのターン終了時にクリア（ここではクリアしない）
  np[pi]={...np[pi],activatedThisTurn:false,servedLastTurn:false,
    ingZone:np[pi].ingZone.map(c=>({...c,_used:false,_placedThisTurn:false})),
    revealed:false,debuffs:piDebuffs};
  // 次ターンプレイヤー（opp）のリセット
  // opp.chiliWatchクリア：oppのターンが今終わった＝oppが唐辛子起動者だったので効果終了
  const oppDebuffs={...np[opp].debuffs};
  if(oppDebuffs.chiliWatch)oppDebuffs.chiliWatch=0;
  np[opp]={...np[opp],revealed:false,debuffs:oppDebuffs};
  return addLog({...s,players:np,currentPlayer:opp,phase:'draw',turn:s.turn+1,firstTurn:false},`Turn ${s.turn+1} - P${opp+1}のターン`);
}
function doMulligan(players,sels){
  return players.map((p,pi)=>{
    const ret=p.hand.filter(c=>sels[pi].has(c._uid));
    const kept=p.hand.filter(c=>!sels[pi].has(c._uid));
    let iD=[...p.ingDeck],rD=[...p.recDeck];
    ret.forEach(c=>{if(c._isRec)rD=shuffle([...rD,c]);else iD=shuffle([...iD,c]);});
    const inN=ret.filter(c=>!c._isRec).length,reN=ret.filter(c=>c._isRec).length;
    return {
      ...p,
      hand:[...kept,...iD.slice(0,inN),...rD.slice(0,reN)],
      ingDeck:iD.slice(inN),recDeck:rD.slice(reN),
      // ゲーム状態を完全リセット
      ingZone:[],recZone:[],trash:[],
      satiety:0,bufNextRec:0,debuffs:{},
      revealed:false,activatedThisTurn:false,servedLastTurn:false,
    };
  });
}
