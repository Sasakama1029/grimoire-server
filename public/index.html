function checkWin(G){
  if(G.players[0].satiety>=20)return{...G,winner:1,winReason:'satiety'};
  if(G.players[1].satiety>=20)return{...G,winner:0,winReason:'satiety'};
  function deckLen(d){return Array.isArray(d)?d.length:(typeof d==='number'?d:0);}
  for(let pi=0;pi<2;pi++){
    const p=G.players[pi];
    if(deckLen(p.ingDeck)===0&&deckLen(p.recDeck)===0){
      return{...G,winner:1-pi,winReason:'deck'};
    }
  }
  return G;
}
// ── GAME HELPERS ──
function ph(p,cards){let h=[...p.hand,...cards],t=[...p.trash];if(h.length>10){t=[...t,...h.slice(10)];h=h.slice(0,10);}return{hand:h,trash:t};}
function drawI(G,pi,n){const p=G.players[pi];const d=p.ingDeck.slice(0,Math.min(n,p.ingDeck.length));if(!d.length)return G;const r=ph(p,d);return addLog(ovP(G,pi,{ingDeck:p.ingDeck.slice(d.length),...r}),`P${pi+1}: 食材${d.length}枚ドロー`);}
function drawR(G,pi,n){const p=G.players[pi];const d=p.recDeck.slice(0,Math.min(n,p.recDeck.length));if(!d.length)return G;const r=ph(p,d);return addLog(ovP(G,pi,{recDeck:p.recDeck.slice(d.length),...r}),`P${pi+1}: レシピ${d.length}枚ドロー`);}
function drawToZone(G,pi,n){let s=G;for(let i=0;i<n;i++){const p=s.players[pi];if(!p.ingDeck.length)break;const c={...p.ingDeck[0],_satBuff:0};s=p.ingZone.length<7?ovP(s,pi,{ingDeck:p.ingDeck.slice(1),ingZone:[...p.ingZone,c]}):ovP(s,pi,{ingDeck:p.ingDeck.slice(1),trash:[...p.trash,c]});s=addLog(s,`P${pi+1}: ${c.name}を直接配置`);}return s;}
function bufR(G,pi,n){return addLog(ovP(G,pi,{bufNextRec:(G.players[pi].bufNextRec||0)+n}),`P${pi+1}: 次の料理+${n}バフ`);}
function setDeb(G,pi,k,v){return addLog(ovP(G,pi,{debuffs:{...G.players[pi].debuffs,[k]:v}}),`P${pi+1}: デバフ[${k}]`,'warn');}
function setOppDeb(G,pi,v){const o=1-pi;return addLog(ovP(G,o,{debuffs:{...G.players[o].debuffs,satBuff:(G.players[o].debuffs.satBuff||0)+v}}),`P${pi+1}: 相手次ターン満腹+${v}設定`,'warn');}
function redOpp(G,pi,n){const o=1-pi;return addLog(ovP(G,o,{satiety:Math.max(0,G.players[o].satiety-n)}),`P${pi+1}: 相手満腹-${n}！`,'warn');}
function redSelf(G,pi,n){return addLog(ovP(G,pi,{satiety:Math.max(0,G.players[pi].satiety-n)}),`P${pi+1}: 自満腹-${n}`);}
function destOpp(G,pi,uid_){
  const o=1-pi;const p=G.players[o];if(!p.ingZone.length)return addLog(G,'相手食材なし');
  const c=uid_?p.ingZone.find(x=>x._uid===uid_):p.ingZone[p.ingZone.length-1];
  if(!c)return addLog(G,'対象なし');
  return addLog(ovP(G,o,{ingZone:p.ingZone.filter(x=>x._uid!==c._uid),trash:[...p.trash,c]}),`P${pi+1}: ${c.name}をごみ箱へ！`,'warn');
}
function bounceOpp(G,pi,uid_){
  const o=1-pi;const p=G.players[o];if(!p.ingZone.length)return addLog(G,'相手食材なし');
  const c=uid_?p.ingZone.find(x=>x._uid===uid_):p.ingZone[p.ingZone.length-1];
  if(!c)return addLog(G,'対象なし');
  return addLog(ovP(G,o,{ingZone:p.ingZone.filter(x=>x._uid!==c._uid),ingDeck:shuffle([...p.ingDeck,c])}),`P${pi+1}: ${c.name}を山札へ！`,'warn');
}
function rndBounce(G,pi){
  let s=G;[0,1].forEach(p=>{
    const pl=s.players[p];if(!pl.hand.length)return;
    const idx=0|Math.random()*pl.hand.length;const c=pl.hand[idx];
    const hand=pl.hand.filter((_,i)=>i!==idx);
    s=addLog(ovP(s,p,{hand,...(c._isRec?{recDeck:shuffle([...pl.recDeck,c])}:{ingDeck:shuffle([...pl.ingDeck,c])})}),`P${p+1}: ${c.name}が山札へ`,'warn');
  });return s;
}
function condRec(G,pi,thr,op){
  const o=1-pi;const len=op==='ge'?G.players[o].ingZone.length:G.players[pi].ingZone.length;
  return(op==='ge'?len>=thr:len<=thr)?drawR(G,pi,1):addLog(G,`P${pi+1}: 条件不成立`);
}
function condIng(G,pi,thr,n){
  const len=G.players[pi].ingZone.length;return len<=thr?drawI(G,pi,n):addLog(G,`P${pi+1}: 条件不成立`);
}
function revOpp(G,pi){return addLog(ovP(G,1-pi,{revealed:true}),`P${pi+1}: 相手手札全公開！`,'warn');}

// pending: G に {pending:{type,pi,cardId,step,...}} を乗せて選択待ちにする
function pending(G,obj){return {...G,pending:obj};}
function clearPending(G){const{pending:_,...rest}=G;return rest;}

// ============================================================
// BLOCK ENGINE
// ============================================================

function mkPending(G,pd){return{...G,pending:pd,_isPending:true};}

function runBlocks(G,pi,blocks,cardId){
  let s=G;let prevDone=true;
  for(let i=0;i<blocks.length;i++){
    const blk=blocks[i];
    if(blk.type==='ifPrev'){
      if(!prevDone){
        // 条件不成立：ネストブロックなしの場合は次の1ブロックもスキップ
        if(!blk.blocks||!blk.blocks.length)i++;
        prevDone=false;continue;
      }
      if(blk.blocks&&blk.blocks.length){
        const res2=runBlocks(s,pi,blk.blocks,cardId);
        if(res2&&res2._isPending){const r={...res2};delete r._isPending;r.pending={...r.pending,resume:{pi,blocks:blocks.slice(i+1),cardId},prevDone:true};return r;}
        s=res2;s=checkWin(s);if(s.winner!=null)return s;
      }
      continue;
    }
    if(blk.type==='elsePrev'){
      if(prevDone){continue;}
      const res2=runBlocks(s,pi,blk.blocks||[],cardId);
      if(res2&&res2._isPending){const r={...res2};delete r._isPending;r.pending={...r.pending,resume:{pi,blocks:blocks.slice(i+1),cardId},prevDone:false};return r;}
      s=res2;prevDone=false;s=checkWin(s);if(s.winner!=null)return s;continue;
    }
    const res=execBlock(s,pi,blk,cardId);
    if(res&&res._isPending){
      const r={...res};delete r._isPending;
      r.pending={...r.pending,resume:{pi,blocks:blocks.slice(i+1),cardId},prevDone:true};
      return r;
    }
    if(res===null){prevDone=false;}
    else{s=res;prevDone=true;}
    s=checkWin(s);if(s.winner!=null)return s;
  }
  return s;
}

function runBlocksFrom(G,pi,blocks,cardId,prevDone){
  let s=G;
  for(let i=0;i<blocks.length;i++){
    const blk=blocks[i];
    if(blk.type==='ifPrev'){
      if(!prevDone){
        if(!blk.blocks||!blk.blocks.length)i++;
        prevDone=false;continue;
      }
      if(blk.blocks&&blk.blocks.length){
        const res2=runBlocks(s,pi,blk.blocks,cardId);
        if(res2&&res2._isPending){const r={...res2};delete r._isPending;r.pending={...r.pending,resume:{pi,blocks:blocks.slice(i+1),cardId},prevDone:true};return r;}
        s=res2;s=checkWin(s);if(s.winner!=null)return s;
      }
      continue;
    }
    if(blk.type==='elsePrev'){
      if(prevDone){continue;}
      const res2=runBlocks(s,pi,blk.blocks||[],cardId);
      if(res2&&res2._isPending){const r={...res2};delete r._isPending;r.pending={...r.pending,resume:{pi,blocks:blocks.slice(i+1),cardId},prevDone:false};return r;}
      s=res2;prevDone=false;s=checkWin(s);if(s.winner!=null)return s;continue;
    }
    const res=execBlock(s,pi,blk,cardId);
    if(res&&res._isPending){
      const r={...res};delete r._isPending;
      r.pending={...r.pending,resume:{pi,blocks:blocks.slice(i+1),cardId},prevDone};
      return r;
    }
    if(res===null){prevDone=false;}
    else{s=res;prevDone=true;}
    s=checkWin(s);if(s.winner!=null)return s;
  }
  return s;
}

function resumeBlocks(G,chosen){
  const pd=G.pending;if(!pd)return G;
  const{pi,blocks,cardId}=pd.resume||{pi:G.currentPlayer,blocks:[],cardId:''};
  let s=clearPending(G);
  const r=resolveBlockChoice(s,pi,pd,chosen);
  if(r===null){
    if(!blocks||!blocks.length)return s;
    if(blocks[0]&&blocks[0].type==='ifPrev'){
      // prevDone=false: ifPrevとその次のブロック（ネストなしの場合）もスキップ
      const skip=(!blocks[0].blocks||!blocks[0].blocks.length)?2:1;
      return blocks.length>skip?runBlocksFrom(s,pi,blocks.slice(skip),cardId,false):s;
    }
    if(blocks[0]&&blocks[0].type==='elsePrev'){
      const res2=runBlocks(s,pi,blocks[0].blocks||[],cardId);
      return blocks.length>1?runBlocksFrom(res2,pi,blocks.slice(1),cardId,false):res2;
    }
    return runBlocksFrom(s,pi,blocks,cardId,false);
  }
  s=r;s=checkWin(s);if(s.winner!=null)return s;
  if(!blocks||!blocks.length)return s;
  return runBlocksFrom(s,pi,blocks,cardId,true);
}

function execBlock(G,pi,blk,cardId){
  const p=G.players[pi];const opp=1-pi;
  switch(blk.type){
    case 'drawIng':return drawI(G,pi,blk.n||1);
    case 'drawRec':return drawR(G,pi,blk.n||1);
    case 'drawToZone':return drawToZone(G,pi,blk.n||1);
    case 'bufNextRec':return bufR(G,pi,blk.n||1);
    case 'setDebuff':return setDeb(G,pi,blk.key,blk.val);
    case 'setOppDebuff':
      if(blk.key){
        const o=1-pi;
        return addLog(ovP(G,o,{debuffs:{...G.players[o].debuffs,[blk.key]:blk.val}}),`P${pi+1}: 相手にデバフ[${blk.key}]`,'warn');
      }
      return setOppDeb(G,pi,blk.n||3);
    case 'redOppSat':return redOpp(G,pi,blk.n||1);
    case 'redSelfSat':return redSelf(G,pi,blk.n||1);
    case 'revealOpp':return revOpp(G,pi);
    case 'rndBounce':return rndBounce(G,pi);
    case 'retAllHand':return retAll(G,pi,blk.ing||0,blk.rec||0);
    case 'discAllHand':return discAll(G,pi,blk.ing||0,blk.rec||0);
    case 'retAllDrawByOpp':return retByOpp(G,pi);
    case 'selfTrash':{
      // cardIdは文字列ID or カードオブジェクトどちらでも対応
      const cid=cardId&&cardId._uid?cardId._uid:null;
      const cname=cardId&&cardId.id?cardId.id:cardId;
      const target=cid?p.ingZone.find(c=>c._uid===cid):p.ingZone.find(c=>c.id===cname);
      if(!target)return G;
      return addLog(ovP(G,pi,{ingZone:p.ingZone.filter(c=>c._uid!==target._uid),trash:[...p.trash,target]}),`P${pi+1}: ${target.name}をごみ箱へ`);
    }
    case 'condIngZone':{
      const len=p.ingZone.length;
      const ok=blk.op==='le'?len<=blk.n:len>=blk.n;
      if(!ok)return addLog(G,`P${pi+1}: 条件不成立`);
      return runBlocks(G,pi,blk.then,cardId);
    }
    case 'condOppZone':{
      const len=G.players[opp].ingZone.length;
      const ok=blk.op==='le'?len<=blk.n:len>=blk.n;
      if(!ok)return addLog(G,`P${pi+1}: 条件不成立`);
      return runBlocks(G,pi,blk.then,cardId);
    }
    case 'discardHand':{
      if(!p.hand.length)return blk.optional?null:G;
      const multi=blk.n||1;const canSkip=!!blk.optional;
      const cands=blk.filter?p.hand.filter(blk.filter):p.hand;
      if(!cands.length)return blk.optional?null:addLog(G,`P${pi+1}: 手札に対象なし`);
      return mkPending(G,{type:'discardHand',pi,
        title:canSkip?`手札を${multi}枚ごみ箱に送る（任意）`:`手札を${multi}枚ごみ箱へ`,
        desc:canSkip?'送るカードを選んでください（スキップ可）':`${multi}枚選んでください`,
        filter:blk.filter||(()=>true),filterKey:blk.filterKey||null,source:'hand',multi,canSkip});
    }
    case 'retHand':{
      if(p.hand.length<(blk.n||1))return G;
      return mkPending(G,{type:'retHand',pi,
        title:`手札を${blk.n||1}枚山札に戻す`,
        desc:'山札に戻すカードを選んでください',
        filter:()=>true,filterKey:null,source:'hand',multi:blk.n||1});
    }
    case 'recoverTrash':{
      const filter=blk.filter||(c=>!c._isRec);
      const cands=p.trash.filter(filter);
      if(!cands.length)return addLog(G,`P${pi+1}: ごみ箱に対象なし`);
      return mkPending(G,{type:'trash_to_hand',pi,
        title:blk.title||'ごみ箱から手札へ回収',
        desc:'回収するカードを選んでください',
        filter,filterKey:blk.filterKey||null,candidates:cands,source:'trash'});
    }
    case 'recoverTrashToDeck':{
      const cands=p.trash.filter(c=>!c._isRec);
      if(!cands.length)return addLog(G,`P${pi+1}: ごみ箱に食材なし`);
      return mkPending(G,{type:'trash_to_ingdeck',pi,
        title:'ごみ箱から食材を食材山札へ戻す',
        desc:'戻す食材カードを選んでください',
        filter:c=>!c._isRec,filterKey:'ingredient',candidates:cands,source:'trash'});
    }
    case 'selectIngZone':{
      if(!p.ingZone.length)return addLog(G,'食材ゾーンが空');
      return mkPending(G,{type:'selectIngZone_'+blk.then,pi,
        title:blk.title||'食材ゾーンからカードを選ぶ',
        desc:blk.desc||'カードを選んでください',
        filter:c=>p.ingZone.some(z=>z._uid===c._uid),
        source:'ingZone',then:blk.then,multi:blk.multi||1});
    }
    case 'selectOppZone':{
      const oppP=G.players[opp];
      if(!oppP.ingZone.length)return addLog(G,'相手食材ゾーンが空');
      return mkPending(G,{type:'selectOppZone_'+blk.then,pi,
        title:blk.then==='trash'?'相手の食材ゾーンから1枚をごみ箱へ':'相手の食材ゾーンから1枚を山札へ',
        desc:'対象のカードを選んでください',
        filter:c=>oppP.ingZone.some(z=>z._uid===c._uid),
        source:'oppIngZone',then:blk.then});
    }
    case 'selectHand':{
      const filter=blk.filter||(()=>true);
      const cands=p.hand.filter(filter);
      if(!cands.length)return blk.optional?null:addLog(G,`P${pi+1}: 手札に対象なし`);
      const canSkip=!!blk.optional;
      return mkPending(G,{type:'selectHand_'+blk.then,pi,
        title:blk.title||'手札からカードを選ぶ',
        desc:blk.desc||(canSkip?'選んでください（スキップ可）':'選んでください'),
        filter,source:'hand',then:blk.then,canSkip,multi:blk.multi||1});
    }
    case 'selectIngZoneMulti':{
      if(p.ingZone.length<(blk.n||2))return addLog(G,`食材ゾーンに${blk.n||2}枚以上必要`);
      return mkPending(G,{type:'pork_step1',pi,
        title:`食材ゾーンから${blk.n||2}枚選ぶ`,
        desc:`${blk.n||2}枚選んでください（次に手札に戻す方を選びます）`,
        filter:c=>p.ingZone.some(z=>z._uid===c._uid),
        source:'ingZone',multi:blk.n||2});
    }
    case 'searchIngDeck':{
      const filter2=blk.filter||(()=>true);
      const ingArr=Array.isArray(p.ingDeck)?p.ingDeck:[];
      const cands2=ingArr.filter(filter2);
      if(!cands2.length)return addLog(G,`P${pi+1}: 食材山札に対象なし`);
      return mkPending(G,{type:'searchIngDeck',pi,
        title:blk.title||'食材山札からカードを選ぶ',
        desc:'手札に加えるカードを選んでください',
        candidates:cands2,
        filter:filter2,source:'ingDeck'});
    }
    case 'searchRecDeck':{
      const recArr=Array.isArray(p.recDeck)?p.recDeck:[];
      if(!recArr.length)return addLog(G,`P${pi+1}: レシピ山札に対象なし`);
      return mkPending(G,{type:'searchRecDeck',pi,
        title:blk.title||'レシピ山札からカードを選ぶ',
        desc:'手札に加えるレシピカードを選んでください',
        candidates:recArr,
        source:'recDeck'});
    }
    case 'addSelfSat':{
      return addLog(ovP(G,pi,{satiety:Math.min(20,G.players[pi].satiety+(blk.n||1))}),`P${pi+1}: 自満腹+${blk.n||1}`);
    }
    case 'addOppSat':{
      const o=1-pi;
      return addLog(ovP(G,o,{satiety:Math.min(20,G.players[o].satiety+(blk.n||1))}),`P${pi+1}: 相手満腹+${blk.n||1}`,'warn');
    }
    case 'condOppHand':{
      const oppLen=G.players[1-pi].hand.length;
      if(oppLen>=(blk.n||1))return addLog(G,`P${pi+1}: 相手手札${oppLen}枚（条件成立）`);
      return null;
    }
    case 'drawIngOpp':{
      return drawI(G,1-pi,blk.n||1);
    }
    case 'condOppServedLast':{
      if(G.players[1-pi].servedLastTurn)return addLog(G,`P${pi+1}: 相手が前ターンに料理提供（条件成立）`);
      return null;
    }
    case 'recoverTrash2':{
      const filter3=blk.filter||(c=>!c._isRec);
      const cands3=p.trash.filter(filter3);
      if(!cands3.length)return addLog(G,`P${pi+1}: ごみ箱に対象なし`);
      const n3=Math.min(blk.n||2,cands3.length);
      return mkPending(G,{type:'trash_to_hand_multi',pi,
        title:blk.title||`ごみ箱から${n3}枚選んで手札へ`,
        desc:`${n3}枚選んでください`,
        filter:filter3,filterKey:blk.filterKey||null,candidates:cands3,source:'trash',multi:n3});
    }
    case 'markSelf':{
      if(!cardId||typeof cardId==='string')return G; // cardオブジェクトが必要
      const buffVal=blk.n||1;
      const iz=p.ingZone.map(z=>z._uid===cardId._uid?{...z,_satBuff:(z._satBuff||0)+buffVal}:z);
      return addLog(ovP(G,pi,{ingZone:iz}),`P${pi+1}: ${cardId.name}に満腹バフ+${buffVal}付与`);
    }
    case 'markIngZone':{
      if(!p.ingZone.length)return addLog(G,`P${pi+1}: 食材ゾーンが空`);
      return mkPending(G,{type:'markIngZone',pi,
        title:'食材ゾーンのカードを1枚選ぶ',
        desc:'マークするカードを選んでください（そのカードを使った料理完成時に相手満腹+2）',
        filter:()=>true,source:'ingZone'});
    }
    default:return G;
  }
}

function resolveBlockChoice(G,pi,pd,chosen){
  const p=G.players[pi];const opp=1-pi;
  if(chosen[0]==='skip')return null;
  if(pd.type==='discardHand'){
    const cards=chosen.map(u=>p.hand.find(c=>c._uid===u)).filter(Boolean);
    if(!cards.length)return null;
    const hand=p.hand.filter(c=>!chosen.includes(c._uid));
    return addLog(ovP(G,pi,{hand,trash:[...p.trash,...cards]}),`P${pi+1}: ${cards.map(c=>c.name).join('・')}をごみ箱へ`);
  }
  if(pd.type==='retHand'){
    const cards=chosen.map(u=>p.hand.find(c=>c._uid===u)).filter(Boolean);
    if(!cards.length)return null;
    const hand=p.hand.filter(c=>!chosen.includes(c._uid));
    let iD=[...p.ingDeck],rD=[...p.recDeck];
    cards.forEach(c=>{if(c._isRec)rD=shuffle([...rD,c]);else iD=shuffle([...iD,c]);});
    return addLog(ovP(G,pi,{hand,ingDeck:iD,recDeck:rD}),`P${pi+1}: ${cards.map(c=>c.name).join('・')}を山札へ`);
  }
  if(pd.type==='searchIngDeck'){
    const p2=G.players[pi];
    const card=p2.ingDeck.find(c=>c._uid===chosen[0]);
    if(!card)return G;
    const ingDeck=shuffle(p2.ingDeck.filter(c=>c._uid!==card._uid));
    const r=ph(p2,[card]);
    return addLog(ovP(G,pi,{ingDeck,...r}),`P${pi+1}: ${card.name}をサーチ`);
  }
  if(pd.type==='trash_to_hand_multi'){
    const p2=G.players[pi];
    const cards=chosen.map(u=>p2.trash.find(c=>c._uid===u)).filter(Boolean);
    if(!cards.length)return G;
    const p3={...p2,trash:p2.trash.filter(c=>!chosen.includes(c._uid))};
    const r=ph(p3,cards);
    return addLog(ovP(G,pi,r),`P${pi+1}: ${cards.map(c=>c.name).join('・')}を手札へ`);
  }
  if(pd.type==='trash_to_hand'){
    const card=p.trash.find(c=>c._uid===chosen[0]);if(!card)return G;
    const trashRemoved=p.trash.filter(c=>c._uid!==card._uid);
    const p2={...p,trash:trashRemoved};
    const r=ph(p2,[card]);
    return addLog(ovP(G,pi,r),`P${pi+1}: ${card.name}を手札へ`);
  }
  if(pd.type==='trash_to_ingdeck'){
    const card=p.trash.find(c=>c._uid===chosen[0]);if(!card)return G;
    return addLog(ovP(G,pi,{trash:p.trash.filter(c=>c._uid!==card._uid),ingDeck:shuffle([...p.ingDeck,card])}),`P${pi+1}: ${card.name}を食材山札へ`);
  }
  if(pd.type==='selectIngZone_toHand'){
    const card=p.ingZone.find(c=>c._uid===chosen[0]);if(!card)return G;
    const cleanCard={...card,_satBuff:0};
    const r=ph(p,[cleanCard]);
    return addLog(ovP(G,pi,{ingZone:p.ingZone.filter(c=>c._uid!==card._uid),...r}),`P${pi+1}: ${card.name}を手札へ`);
  }
  if(pd.type==='selectIngZone_retAndDraw'){
    const card=p.ingZone.find(c=>c._uid===chosen[0]);if(!card)return G;
    const ingZone=p.ingZone.filter(c=>c._uid!==card._uid);
    const cleanCard={...card,_satBuff:0};
    const ingDeck=shuffle([...p.ingDeck,cleanCard]);
    let s=addLog(ovP(G,pi,{ingZone,ingDeck}),`P${pi+1}: ${card.name}を山札へ戻した`);
    return drawToZone(s,pi,1);
  }
  if(pd.type==='selectIngZone_searchSame'){
    const ref=p.ingZone.find(c=>c._uid===chosen[0]);if(!ref)return G;
    const found=p.ingDeck.find(c=>c.id===ref.id);
    if(!found)return addLog(G,`P${pi+1}: 山札に${ref.name}なし`);
    const ingDeck=shuffle(p.ingDeck.filter(c=>c._uid!==found._uid));
    const r=ph(p,[found]);
    return addLog(ovP(G,pi,{ingDeck,...r}),`P${pi+1}: ${found.name}をサーチ`);
  }
  if(pd.type==='selectHand_retToIngDeck'){
    const card=p.hand.find(c=>c._uid===chosen[0]);if(!card)return G;
    const hand=p.hand.filter(c=>c._uid!==card._uid);
    return addLog(ovP(G,pi,{hand,ingDeck:shuffle([...p.ingDeck,card])}),`P${pi+1}: ${card.name}を食材山札へ`);
  }
  if(pd.type==='selectHand_retToRecDeck'){
    const card=p.hand.find(c=>c._uid===chosen[0]);if(!card)return G;
    const hand=p.hand.filter(c=>c._uid!==card._uid);
    return addLog(ovP(G,pi,{hand,recDeck:shuffle([...p.recDeck,card])}),`P${pi+1}: ${card.name}をレシピ山札へ`);
  }
  if(pd.type==='selectOppZone_trash'){
    const oppP=G.players[opp];
    const card=oppP.ingZone.find(c=>c._uid===chosen[0]);if(!card)return G;
    return addLog(ovP(G,opp,{ingZone:oppP.ingZone.filter(c=>c._uid!==card._uid),trash:[...oppP.trash,card]}),`P${pi+1}: ${card.name}をごみ箱へ！`,'warn');
  }
  if(pd.type==='selectOppZone_deck'){
    const oppP=G.players[opp];
    const card=oppP.ingZone.find(c=>c._uid===chosen[0]);if(!card)return G;
    const cleanCard={...card,_satBuff:0};
    return addLog(ovP(G,opp,{ingZone:oppP.ingZone.filter(c=>c._uid!==card._uid),ingDeck:shuffle([...oppP.ingDeck,cleanCard])}),`P${pi+1}: ${card.name}を山札へ！`,'warn');
  }
  if(pd.type==='selectOppZone_searchSame'){
    const oppP=G.players[opp];
    const ref=oppP.ingZone.find(c=>c._uid===chosen[0]);if(!ref)return G;
    const p2=G.players[pi];
    const found=p2.ingDeck.find(c=>c.id===ref.id);
    if(!found)return addLog(G,`P${pi+1}: 食材山札に${ref.name}なし`);
    return addLog(ovP(G,pi,{ingDeck:shuffle(p2.ingDeck.filter(c=>c._uid!==found._uid)),...ph(p2,[found])}),`P${pi+1}: ${found.name}をサーチ`);
  }
  if(pd.type==='pork_step1'){
    if(chosen.length<2)return addLog(G,'2枚選択してください');
    const resume=pd.resume||{pi,blocks:[],cardId:''};
    return {...G,pending:{type:'pork_step2',pi,uids:chosen,resume,
      title:'どちらを手札に戻す？',
      desc:'手札に戻す方を1枚選んでください（もう一方は山札へ）',
      filter:c=>chosen.includes(c._uid),source:'ingZone',multi:1}};
  }
  if(pd.type==='pork_step2'){
    const cards=pd.uids.map(u=>p.ingZone.find(c=>c._uid===u)).filter(Boolean);
    if(cards.length<2)return G;
    const toHand=cards.find(c=>c._uid===chosen[0]);
    const toDeck=cards.find(c=>c._uid!==chosen[0]);
    if(!toHand||!toDeck)return G;
    const ingZone=p.ingZone.filter(c=>!pd.uids.includes(c._uid));
    const r=ph(p,[toHand]);
    return addLog(ovP(G,pi,{ingZone,ingDeck:shuffle([...p.ingDeck,toDeck]),...r}),`P${pi+1}: ${toHand.name}→手札、${toDeck.name}→山札`);
  }
  // レシピ山札から選択して手札へ
  if(pd.type==='searchRecDeck'){
    const p2=G.players[pi];
    const card=p2.recDeck.find(c=>c._uid===chosen[0]);
    if(!card)return G;
    const recDeck=shuffle(p2.recDeck.filter(c=>c._uid!==card._uid));
    const r=ph(p2,[card]);
    return addLog(ovP(G,pi,{recDeck,...r}),`P${pi+1}: ${card.name}をサーチ`);
  }
  // 食材ゾーンのカードに満腹バフを付与する
  if(pd.type==='markIngZone'){
    const p2=G.players[pi];
    const target=p2.ingZone.find(c=>c._uid===chosen[0]);
    if(!target)return G;
    const ingZone=p2.ingZone.map(c=>c._uid===chosen[0]?{...c,_satBuff:3}:c);
    return addLog(ovP(G,pi,{ingZone}),`P${pi+1}: ${target.name}に【満腹バフ：3】を付与`);
  }
  return G;
}

// ── 選択完了後の処理 ──
// resolvePending は resumeBlocks にブリッジ
function resolvePending(G,chosen){return resumeBlocks(G,chosen);}

function srchCat(G,pi,cat){
  const p=G.players[pi];const f=p.ingDeck.find(c=>c.cat===cat);
  if(!f)return addLog(G,`山札に${cat}なし`);
  const ingDeck=shuffle(p.ingDeck.filter(c=>c._uid!==f._uid));
  const r=ph(p,[f]);
  return addLog(ovP(G,pi,{ingDeck,...r}),`P${pi+1}: ${f.name}サーチ`);
}
function srchRec(G,pi){
  const p=G.players[pi];if(!p.recDeck.length)return addLog(G,'レシピ山札空');
  const f=p.recDeck[0];
  return addLog(ovP(G,pi,{recDeck:shuffle(p.recDeck.slice(1)),...ph(p,[f])}),`P${pi+1}: ${f.name}サーチ`);
}
function discAll(G,pi,in_,re_){
  const p=G.players[pi];let s=ovP(G,pi,{hand:[],trash:[...p.trash,...p.hand]});
  s=drawI(s,pi,in_);return drawR(s,pi,re_);
}
function retAll(G,pi,in_,re_){
  const p=G.players[pi];const i=p.hand.filter(c=>!c._isRec);const r=p.hand.filter(c=>c._isRec);
  let s=ovP(G,pi,{hand:[],ingDeck:shuffle([...p.ingDeck,...i]),recDeck:shuffle([...p.recDeck,...r])});
  s=drawI(s,pi,in_);return drawR(s,pi,re_);
}
function retByOpp(G,pi){
  const o=1-pi;const n=G.players[o].ingZone.length;const p=G.players[pi];
  const i=p.hand.filter(c=>!c._isRec);const r=p.hand.filter(c=>c._isRec);
  let s=ovP(G,pi,{hand:[],ingDeck:shuffle([...p.ingDeck,...i]),recDeck:shuffle([...p.recDeck,...r])});
  return n>0?drawI(s,pi,n):s;
}

function serveRecipe(G,pi,recUid,ingUids){
  const p=G.players[pi];const rec=p.hand.find(c=>c._uid===recUid);if(!rec)return G;
  const buf=p.bufNextRec||0;const gain=rec.sat+buf;const opp=1-pi;
  const used=p.ingZone.filter(c=>ingUids.includes(c._uid));
  const toastBonus=used.reduce((a,c)=>a+(c._satBuff||0),0);
  let G2=ovP(G,pi,{hand:p.hand.filter(c=>c._uid!==recUid),ingZone:p.ingZone.filter(c=>!ingUids.includes(c._uid)),trash:[...p.trash,...used],recZone:[...p.recZone,rec],bufNextRec:0,servedLastTurn:true});
  G2=ovP(G2,opp,{satiety:Math.min(20,G2.players[opp].satiety+gain+toastBonus)});
  const toastMsg=toastBonus>0?`（満腹バフ+${toastBonus}）`:'';
  G2=addLog(G2,`P${pi+1}: 【${rec.name}】完成！相手+${gain+toastBonus}！${toastMsg}`,'hl');
  // 唐辛子バフチェック：opp（唐辛子起動者）がchiliWatchを持っている→opp自身の満腹-1
  if(G2.players[opp]&&G2.players[opp].debuffs&&G2.players[opp].debuffs.chiliWatch){
    G2=ovP(G2,opp,{satiety:Math.max(0,G2.players[opp].satiety-1)});
    G2=addLog(G2,`唐辛子の効果！P${opp+1}の満腹度-1`,'warn');
  }
  G2=checkWin(G2);if(G2.winner!=null)return G2;
  const fn=REC_FN[rec.id];
  if(fn){try{G2=fn(G2,pi);}catch(e){console.error(e);}}
  if(G2.pending)return G2;
  return checkWin(G2);
}
function endTurn(G){
  const pi=G.currentPlayer;const opp=1-pi;let s=G;
  const p=s.players[pi];
  if(p.debuffs.satBuff){
    const v=p.debuffs.satBuff;
    s=ovP(s,pi,{satiety:Math.min(20,p.satiety+v),debuffs:{...p.debuffs,satBuff:0}});
    s=addLog(s,`P${pi+1}: バフで満腹+${v}`,'warn');s=checkWin(s);if(s.winner!=null)return s;
  }
  const np=[...s.players];
  // 現ターンプレイヤー（pi）のリセット
  const piDebuffs={...np[pi].debuffs};
  // noServeはactivate→serve遷移時にチェック・消費するためここでは減らさない
  // chiliWatchはpiのターン中に起動→oppのターン終了時にクリア（ここではクリアしない）
  np[pi]={...np[pi],activatedThisTurn:false,servedLastTurn:false,
    ingZone:np[pi].ingZone.map(c=>({...c,_used:false,_placedThisTurn:false})),
    revealed:false,debuffs:piDebuffs};
  // 次ターンプレイヤー（opp）のリセット
  // opp.chiliWatchクリア：oppのターンが今終わった＝oppが唐辛子起動者だったので効果終了
  const oppDebuffs={...np[opp].debuffs};
  if(oppDebuffs.chiliWatch)oppDebuffs.chiliWatch=0;
  np[opp]={...np[opp],revealed:false,debuffs:oppDebuffs};
  return addLog({...s,players:np,currentPlayer:opp,phase:'draw',turn:s.turn+1,firstTurn:false},`Turn ${s.turn+1} - P${opp+1}のターン`);
}
function doMulligan(players,sels){
  return players.map((p,pi)=>{
    const ret=p.hand.filter(c=>sels[pi].has(c._uid));
    const kept=p.hand.filter(c=>!sels[pi].has(c._uid));
    let iD=[...p.ingDeck],rD=[...p.recDeck];
    ret.forEach(c=>{if(c._isRec)rD=shuffle([...rD,c]);else iD=shuffle([...iD,c]);});
    const inN=ret.filter(c=>!c._isRec).length,reN=ret.filter(c=>c._isRec).length;
    return {
      ...p,
      hand:[...kept,...iD.slice(0,inN),...rD.slice(0,reN)],
      ingDeck:iD.slice(inN),recDeck:rD.slice(reN),
      // ゲーム状態を完全リセット
      ingZone:[],recZone:[],trash:[],
      satiety:0,bufNextRec:0,debuffs:{},
      revealed:false,activatedThisTurn:false,servedLastTurn:false,
    };
  });
}
// ============================================================
// AI TURN（難易度: 'easy' | 'normal' | 'hard'）
// ============================================================
function aiTurn(G, pi, difficulty='normal'){
  let s=G;
  const p=()=>s.players[pi];
  const opp=()=>s.players[1-pi];

  // ── ドロー ──
  const handRecs=p().hand.filter(c=>c._isRec);
  const zIds=new Set(p().ingZone.map(z=>z.id));
  const handIngIds=new Set(p().hand.filter(c=>!c._isRec).map(c=>c.id));
  const ingShortage=handRecs.reduce((acc,rec)=>{
    rec.req.forEach(r=>{if(!zIds.has(r)&&!handIngIds.has(r))acc++;});
    return acc;
  },0);
  const recH=p().hand.filter(c=>c._isRec).length;

  if(difficulty==='easy'){
    // かんたん：手札にレシピがあれば食材、なければレシピ（単純判断）
    const hasRec=p().hand.some(c=>c._isRec);
    if(hasRec&&p().ingDeck.length) s=drawI(s,pi,1);
    else if(p().recDeck.length) s=drawR(s,pi,1);
    else if(p().ingDeck.length) s=drawI(s,pi,1);
  } else {
    // ふつう/むずかしい：不足食材計算で判断
    if(p().ingDeck.length&&(ingShortage>0||recH>p().hand.filter(c=>!c._isRec).length||!p().recDeck.length))
      s=drawI(s,pi,1);
    else if(p().recDeck.length) s=drawR(s,pi,1);
    else if(p().ingDeck.length) s=drawI(s,pi,1);
  }

  // ── 食材配置 ──
  s={...s,phase:'place'};
  function recipeScore(rec,zone){
    const zoneIds=new Set(zone.map(z=>z.id));
    const have=rec.req.filter(r=>zoneIds.has(r)).length;
    return{rec,have,need:rec.req.length,short:rec.req.length-have};
  }
  function getBestPlacements(){
    const ap=p();
    const recs=ap.hand.filter(c=>c._isRec);
    const zone=ap.ingZone;
    if(difficulty==='easy'){
      // かんたん：手札の食材を全部置く（戦略なし）
      return ap.hand.filter(c=>!c._isRec);
    }
    if(!recs.length) return ap.hand.filter(c=>!c._isRec);
    const recScores=recs.map(r=>recipeScore(r,zone)).sort((a,b)=>a.short-b.short);
    const placed=new Set();
    const result=[];
    for(const rs of recScores){
      const zoneIds=new Set(ap.ingZone.map(z=>z.id).concat(result.map(c=>c.id)));
      for(const reqId of rs.rec.req){
        if(zoneIds.has(reqId))continue;
        const card=ap.hand.find(c=>!c._isRec&&c.id===reqId&&!placed.has(c._uid));
        if(card){placed.add(card._uid);result.push(card);}
      }
    }
    for(const c of ap.hand.filter(c=>!c._isRec&&!placed.has(c._uid))){
      if(ap.ingZone.length+result.length>=7)break;
      result.push(c);placed.add(c._uid);
    }
    return result;
  }
  for(const c of getBestPlacements()){
    const ap=p();if(ap.ingZone.length>=7)break;
    s=addLog(ovP(s,pi,{
      hand:s.players[pi].hand.filter(x=>x._uid!==c._uid),
      ingZone:[...s.players[pi].ingZone,{...c,_satBuff:0,_used:false,_placedThisTurn:true}]
    }),`AI: ${c.name}を配置`,'ai-log');
  }

  // ── 起動 ──
  s={...s,phase:'activate'};
  const ap2=p();
  if(!ap2.activatedThisTurn){
    // むずかしい：起動効果の有効性を判断して選ぶ
    const candidates=ap2.ingZone.filter(c=>!c._used&&ING_FN[c.id]);
    let target=null;
    if(difficulty==='hard'&&candidates.length>0){
      // むずかしい：複数起動できるなら最も効果的なものを選ぶ
      // ドロー系を優先（手札を増やして選択肢を広げる）
      target=candidates.find(c=>c.id==='chili'&&opp().ingZone.length>=2)
        ||candidates.find(c=>['rice','flour','potato','chicken','salmon','yellowtail'].includes(c.id))
        ||candidates.find(c=>c.id==='tomato'&&p().ingZone.length<=3)
        ||candidates.find(c=>c.id==='daikon'&&opp().ingZone.length>=3)
        ||candidates[0];
    } else if(difficulty==='easy'){
      // かんたん：80%の確率で発動（少し忘れることがある）
      target=Math.random()<0.8?candidates[0]:null;
    } else {
      target=candidates[0];
    }
    if(target){
      const iz=s.players[pi].ingZone.map(x=>x._uid===target._uid?{...x,_used:true}:x);
      s=ovP(s,pi,{ingZone:iz,activatedThisTurn:true});
      try{s=ING_FN[target.id](s,pi);}catch(e){}
      s=addLog(s,`AI: ${target.name}の効果発動`,'ai-log');
    }
  }

  // ── 料理提供 ──
  s={...s,phase:'serve'};
  if(!(s.firstTurn&&s.turn===1)){
    if(p().debuffs&&p().debuffs.noServe){
      const db={...p().debuffs,noServe:0};
      s=ovP(s,pi,{debuffs:db});
    } else {
      let served=true;
      while(served){
        served=false;
        const sp=p();
        const zoneIds=sp.ingZone.map(z=>z.id);
        const oppSat=opp().satiety;
        const opts=sp.hand.filter(c=>c._isRec&&c.req.every(r=>zoneIds.includes(r))).map(rec=>{
          const iu=rec.req.map(r=>sp.ingZone.find(z=>z.id===r)?._uid).filter(Boolean);
          if(iu.length!==rec.req.length)return null;
          const gain=rec.sat+(sp.bufNextRec||0);
          let priority;
          if(difficulty==='easy'){
            // かんたん：順番通りに出す（優先度計算なし）
            priority=1;
          } else if(difficulty==='hard'){
            // むずかしい：トドメ最優先、高ダメージ優先、食材効率も考慮
            const isKill=oppSat+gain>=20;
            const nearKill=oppSat+gain>=17;
            priority=isKill?999999:nearKill?gain*50:oppSat>=12?gain*20:(gain*gain*gain/(rec.req.length*rec.req.length));
          } else {
            // ふつう
            priority=oppSat>=16?gain*10:(gain/rec.req.length);
          }
          return{rec,iu,gain,priority};
        }).filter(Boolean).sort((a,b)=>b.priority-a.priority);
        if(!opts.length)break;
        // かんたん：20%の確率で提供しない
        if(difficulty==='easy'&&Math.random()<0.2)break;
        const b=opts[0];
        s=addLog(s,`AI: 【${b.rec.name}】を提供！`,'ai-log');
        s=serveRecipe(s,pi,b.rec._uid,b.iu);
        served=true;if(s.winner!=null)return s;
      }
    }
  }

  // ── 廃棄 ──
  s={...s,phase:'discard'};
  const dp=p();
  const wantedIds=new Set(dp.hand.filter(c=>c._isRec).flatMap(r=>r.req));
  const zoneIdsSet=new Set(dp.ingZone.map(z=>z.id));
  if(difficulty==='easy'){
    // かんたん：手札8枚以上になったらランダムに1枚廃棄
    if(dp.hand.length>=8){
      const dis=dp.hand[Math.floor(Math.random()*dp.hand.length)];
      if(dis)s=addLog(ovP(s,pi,{
        hand:s.players[pi].hand.filter(c=>c._uid!==dis._uid),
        trash:[...s.players[pi].trash,dis]
      }),`AI: ${dis.name}を廃棄`,'ai-log');
    }
  } else if(difficulty==='hard'){
    // むずかしい：手札4枚以上で積極廃棄、不要牌を徹底して切る
    const threshold=4;
    if(dp.hand.length>=threshold){
      // 不要な食材を優先して捨てる（レシピに必要な食材・ゾーンにある食材は残す）
      const dis=dp.hand.find(c=>!c._isRec&&!wantedIds.has(c.id)&&!zoneIdsSet.has(c.id))
        ||dp.hand.find(c=>!c._isRec&&!wantedIds.has(c.id))
        ||(dp.hand.length>=7?dp.hand.find(c=>!c._isRec):null);
      if(dis)s=addLog(ovP(s,pi,{
        hand:s.players[pi].hand.filter(c=>c._uid!==dis._uid),
        trash:[...s.players[pi].trash,dis]
      }),`AI: ${dis.name}を廃棄`,'ai-log');
    }
    // 食材ゾーンに不要なカードがあれば廃棄
    if(dp.ingZone.length>3){
      const dis=dp.ingZone.find(c=>!wantedIds.has(c.id));
      if(dis)s=addLog(ovP(s,pi,{
        ingZone:s.players[pi].ingZone.filter(c=>c._uid!==dis._uid),
        trash:[...s.players[pi].trash,dis]
      }),`AI: 食材ゾーンの${dis.name}を廃棄`,'ai-log');
    }
  } else {
    // ふつう
    if(dp.hand.length>=6){
      const dis=dp.hand.find(c=>!c._isRec&&!wantedIds.has(c.id)&&!zoneIdsSet.has(c.id))
        ||dp.hand.find(c=>!c._isRec&&!wantedIds.has(c.id))
        ||(dp.hand.length>=9?dp.hand[dp.hand.length-1]:null);
      if(dis)s=addLog(ovP(s,pi,{
        hand:s.players[pi].hand.filter(c=>c._uid!==dis._uid),
        trash:[...s.players[pi].trash,dis]
      }),`AI: ${dis.name}を廃棄`,'ai-log');
    } else if(dp.ingZone.length>4){
      const dis=dp.ingZone.find(c=>!wantedIds.has(c.id));
      if(dis)s=addLog(ovP(s,pi,{
        ingZone:s.players[pi].ingZone.filter(c=>c._uid!==dis._uid),
        trash:[...s.players[pi].trash,dis]
      }),`AI: 食材ゾーンの${dis.name}を廃棄`,'ai-log');
    }
  }
  return s;
}

// ============================================================
// AI PENDING AUTO-RESOLVE（強化版）
// ============================================================
function aiResolvePending(G, pi) {
  const pd = G.pending;
  if (!pd || pd.pi !== pi) return G;
  const p = G.players[pi];
  const opp = G.players[1 - pi];
  let chosen = ['skip'];

  // filterKey または filter を使って候補を絞る
  function filterCands(cards){
    if(pd.filter){try{return cards.filter(c=>pd.filter(c));}catch(e){}}
    const k=pd.filterKey;
    if(!k)return cards;
    if(k==='ingredient')return cards.filter(c=>!c._isRec);
    if(k==='recipe')return cards.filter(c=>c._isRec);
    if(k==='protein'||k==='protein_ing')return cards.filter(c=>c.cat==='protein'&&!c._isRec);
    if(k==='carb'||k==='carb_ing')return cards.filter(c=>c.cat==='carb'&&!c._isRec);
    if(k==='fat'||k==='fat_ing')return cards.filter(c=>c.cat==='fat'&&!c._isRec);
    if(k==='vitamin'||k==='vitamin_ing')return cards.filter(c=>c.cat==='vitamin'&&!c._isRec);
    if(k==='mineral'||k==='mineral_ing')return cards.filter(c=>c.cat==='mineral'&&!c._isRec);
    return cards;
  }

  const wantedIds=new Set(p.hand.filter(c=>c._isRec).flatMap(r=>r.req));

  if(pd.source==='hand'||!pd.source&&(pd.type==='discardHand'||pd.type==='retHand')){
    const cands=filterCands(p.hand.filter(c=>!c._hidden));
    if(!cands.length){chosen=['skip'];}
    else if(pd.type==='retHand'){
      // 手札を山札に戻す：不要な食材を優先して返す
      const dis=cands.find(c=>!c._isRec&&!wantedIds.has(c.id))||cands[0];
      chosen=[dis._uid];
    } else if(pd.type==='discardHand'){
      // 手札を捨てる：不要な食材を優先
      const dis=cands.find(c=>!c._isRec&&!wantedIds.has(c.id))||cands[0];
      if(pd.canSkip&&!dis)chosen=['skip'];
      else if(dis)chosen=[dis._uid];
    } else {
      chosen=[cands[0]._uid];
    }
  } else if(pd.source==='ingZone'||pd.type==='pork_step1'||pd.type==='pork_step2'){
    if(pd.type==='pork_step1'){
      // 豚肉step1：2枚選ぶ
      const cands=p.ingZone;
      if(cands.length>=2)chosen=[cands[0]._uid,cands[1]._uid];
    } else {
      const cands=filterCands(p.ingZone);
      if(cands.length)chosen=[cands[0]._uid];
    }
  } else if(pd.source==='oppIngZone'||pd.type?.startsWith('selectOppZone')){
    // 相手食材ゾーンから選ぶ：相手の完成に最も近いレシピの食材を優先的に除去
    const cands=filterCands(opp.ingZone);
    if(cands.length){
      const oppRecs=opp.hand.filter(c=>c._isRec);
      const oppZoneIds=new Set(opp.ingZone.map(z=>z.id));
      // 各食材が何枚のレシピに貢献しているか
      const scored=cands.map(c=>({
        c,
        score:oppRecs.filter(r=>r.req.includes(c.id)&&r.req.every(id=>oppZoneIds.has(id))).length*10
          +oppRecs.filter(r=>r.req.includes(c.id)).length
      })).sort((a,b)=>b.score-a.score);
      chosen=[scored[0].c._uid];
    }
  } else if(pd.source==='trash'){
    const cands=filterCands(p.trash);
    if(cands.length){
      // ごみ箱回収：最も有用な食材（wantedIds優先）を選ぶ
      const best=cands.find(c=>!c._isRec&&wantedIds.has(c.id))||cands[0];
      chosen=[best._uid];
    }
  } else if(pd.source==='recDeck'){
    const cands=Array.isArray(p.recDeck)?filterCands(p.recDeck):[];
    if(cands.length)chosen=[cands[0]._uid];
  } else if(pd.source==='ingDeck'){
    const cands=Array.isArray(p.ingDeck)?filterCands(p.ingDeck):[];
    if(cands.length)chosen=[cands[0]._uid];
  }

  return resolvePending(G, chosen);
}


function validateDeck(ing,rec){
  const iT=Object.values(ing).reduce((a,b)=>a+b,0);
  const rT=Object.values(rec).reduce((a,b)=>a+b,0);
  const e=[];
  if(iT<30)e.push(`食材デッキ ${iT}/30（あと${30-iT}枚）`);
  if(iT>30)e.push(`食材デッキ ${iT}/30（${iT-30}枚超過）`);
  if(rT<15)e.push(`レシピデッキ ${rT}/15（あと${15-rT}枚）`);
  if(rT>15)e.push(`レシピデッキ ${rT}/15（${rT-15}枚超過）`);
  return e;
}

// ============================================================
// SELECTION MODAL COMPONENT
// ============================================================
function SelectionModal({G,onResolve,canOperate}){
  const pd=G.pending;
  const [picked,setPicked]=useState([]);
  const [pos,setPos]=useState(null); // {x,y} or null=中央
  const boxRef=useRef(null);
  const dragRef=useRef(null); // {startX,startY,origX,origY}

  // pending が変わったらリセット（位置は引き継ぐ）
  useEffect(()=>{setPicked([]);},[pd&&pd.type]);

  // ドラッグ開始（マウス・タッチ共通）
  function getClientXY(e){
    if(e.touches&&e.touches.length>0)return{x:e.touches[0].clientX,y:e.touches[0].clientY};
    return{x:e.clientX,y:e.clientY};
  }
  function startDrag(e){
    if(e.button!=null&&e.button!==0)return;
    e.preventDefault();
    const box=boxRef.current;
    if(!box)return;
    const rect=box.getBoundingClientRect();
    const{x,y}=getClientXY(e);
    dragRef.current={startX:x,startY:y,origX:rect.left,origY:rect.top};
    window.addEventListener('mousemove',onMove);
    window.addEventListener('mouseup',onEnd);
    window.addEventListener('touchmove',onMove,{passive:false});
    window.addEventListener('touchend',onEnd);
  }
  function onMove(e){
    if(!dragRef.current)return;
    if(e.cancelable)e.preventDefault();
    const{startX,startY,origX,origY}=dragRef.current;
    const{x,y}=getClientXY(e);
    const dx=x-startX, dy=y-startY;
    const box=boxRef.current;
    const bw=box?box.offsetWidth:400, bh=box?box.offsetHeight:300;
    const newX=Math.max(0,Math.min(window.innerWidth-bw,origX+dx));
    const newY=Math.max(0,Math.min(window.innerHeight-bh,origY+dy));
    setPos({x:newX,y:newY});
  }
  function onEnd(){
    dragRef.current=null;
    window.removeEventListener('mousemove',onMove);
    window.removeEventListener('mouseup',onEnd);
    window.removeEventListener('touchmove',onMove);
    window.removeEventListener('touchend',onEnd);
  }
  useEffect(()=>()=>{
    window.removeEventListener('mousemove',onMove);
    window.removeEventListener('mouseup',onEnd);
    window.removeEventListener('touchmove',onMove);
    window.removeEventListener('touchend',onEnd);
  },[]);

  // 位置スタイル：pos がnullなら画面中央
  const boxStyle=pos
    ?{left:pos.x,top:pos.y,transform:'none'}
    :{left:'50%',top:'50%',transform:'translate(-50%,-50%)'};

  if(!pd)return null;

  const pi=pd.pi;
  const multi=pd.multi||1;
  const canSkip=!!pd.canSkip;

  // 選択肢のカード一覧を source から生成
  // filter関数はJSONシリアライズで失われる場合があるため、filterKeyで再解決
  function resolveFilter(c){
    if(!pd.filter&&!pd.filterKey)return true;
    if(pd.filter){try{return pd.filter(c);}catch(e){}}
    const k=pd.filterKey;
    if(!k)return true;
    if(k==='ingredient')return !c._isRec;
    if(k==='recipe')return c._isRec;
    if(k==='protein'||k==='protein_ing')return c.cat==='protein'&&!c._isRec;
    if(k==='carb'||k==='carb_ing')return c.cat==='carb'&&!c._isRec;
    if(k==='fat'||k==='fat_ing')return c.cat==='fat'&&!c._isRec;
    if(k==='vitamin'||k==='vitamin_ing')return c.cat==='vitamin'&&!c._isRec;
    if(k==='mineral'||k==='mineral_ing')return c.cat==='mineral'&&!c._isRec;
    if(k.startsWith('id:')){
      const ids=k.slice(3).split(',');
      return ids.includes(c.id)&&!c._isRec;
    }
    return true;
  }
  // source が未設定の場合（サーバー側game-engineが生成したpendingなど）、typeから推定
  function inferSource(type){
    if(!type)return'hand';
    if(type==='discardHand'||type==='retHand')return'hand';
    if(type.startsWith('selectHand'))return'hand';
    if(type==='trash_to_hand'||type==='trash_to_hand_multi'||type==='trash_to_ingdeck'||type==='trash_to_hand_rec')return'trash';
    if(type.startsWith('selectIngZone')||type==='pork_step1'||type==='markIngZone')return'ingZone';
    if(type.startsWith('selectOppZone'))return'oppIngZone';
    if(type==='searchIngDeck')return'ingDeck';
    if(type==='searchRecDeck')return'recDeck';
    return'hand';
  }
  const resolvedSource=pd.source||inferSource(pd.type);

  let candidates=[];
  const p=G.players[pi];
  const opp=G.players[1-pi];
  // _hiddenカード（相手の隠し手札）は候補から除外
  const visibleHand=p.hand.filter(c=>!c._hidden);
  // pd.candidatesが直接渡されている場合はそれを優先（ingDeck/recDeckがオンライン時に数値になる問題対策）
  if(pd.candidates&&pd.candidates.length){
    candidates=pd.candidates;
  } else if(resolvedSource==='hand')candidates=visibleHand.filter(resolveFilter);
  else if(resolvedSource==='ingZone')candidates=p.ingZone.filter(resolveFilter);
  else if(resolvedSource==='trash')candidates=p.trash.filter(resolveFilter);
  else if(resolvedSource==='oppIngZone')candidates=opp.ingZone.filter(resolveFilter);
  else if(resolvedSource==='recDeck')candidates=Array.isArray(p.recDeck)?p.recDeck.filter(resolveFilter):[];
  else if(resolvedSource==='ingDeck')candidates=Array.isArray(p.ingDeck)?p.ingDeck.filter(resolveFilter):[];

  function toggle(uid_){
    if(!canOperate)return;
    setPicked(prev=>{
      if(prev.includes(uid_))return prev.filter(u=>u!==uid_);
      if(prev.length>=multi)return[...prev.slice(1),uid_];
      return[...prev,uid_];
    });
  }
  function confirm(){
    if(!canOperate)return;
    if(picked.length===0&&!canSkip)return;
    onResolve(picked.length>0?picked:['skip']);
    setPicked([]);
  }
  function skip(){
    if(!canOperate)return;
    onResolve(['skip']);setPicked([]);
  }

  return h('div',null,
    h('div',{className:'sel-overlay'}),
    h('div',{className:'sel-box',ref:boxRef,style:boxStyle},
      h('div',{className:'sel-title',onMouseDown:startDrag,onTouchStart:startDrag},
        h('span',{style:{fontSize:'10px',color:'var(--goldL)',background:'rgba(180,120,0,.3)',border:'1px solid var(--goldD)',borderRadius:'4px',padding:'2px 8px',marginRight:'8px'}},`P${pi+1}が選択`),
        pd.title||'カードを選択',

      ),
      !canOperate&&h('div',{style:{fontSize:'12px',color:'#f8a040',background:'rgba(200,100,0,.2)',border:'1px solid rgba(200,100,0,.4)',borderRadius:'6px',padding:'6px 10px',marginBottom:'8px',textAlign:'center'}},
        `P${pi+1}の操作番です。P${pi+1}の方が選択してください。`
      ),
      h('div',{className:'sel-desc'},pd.desc||(multi>1?`${multi}枚選んでください`:'1枚選んでください')),
      h('div',{className:'sel-cards',style:{opacity:canOperate?1:0.5,pointerEvents:canOperate?'auto':'none'}},
        candidates.length===0&&h('div',{style:{fontSize:'11px',color:'var(--muted)',padding:'10px'}},'対象のカードがありません'),
        candidates.map(c=>{
          const isRec=c._isRec;
          return h('div',{key:c._uid,
            className:`sel-card${c.cat?' '+c.cat:''}${isRec?' recipe-type':''}${picked.includes(c._uid)?' picked':''}`,
            onClick:()=>toggle(c._uid)},
            h('div',{className:'sc-sub'},isRec?'レシピ':(c.catL||'')),
            h('div',{className:'sc-name'},c.name),
            isRec&&h('div',{className:'sc-sat'},`+${c.sat}`)
          );
        })
      ),
      h('div',{className:'sel-footer'},
        canSkip&&h('span',{className:'sel-skip',onClick:skip,style:{opacity:canOperate?1:0.4,pointerEvents:canOperate?'auto':'none'}},'スキップ（効果なし）'),
        h('button',{className:'btn primary',
          onClick:confirm,
          disabled:!canOperate||(!canSkip&&picked.length<Math.min(multi,candidates.length))},
          canOperate
            ?(picked.length>0?`${picked.length}枚選択中 → 決定`:'決定')
            :`P${pi+1}が操作中...`
        )
      )
    )
  );
}

          isRec?'レシピ':c.catL
        ),
        h('div',{className:'dp-card-name'},c.name),
        h('div',{className:'dp-cat-label'},isRec?`満腹度: +${c.sat}`:(c.catL||'')),
        h('div',{className:'dp-illust-area',style:{background:`linear-gradient(135deg,rgba(0,0,0,.15),${catColor}22)`,border:`1px solid ${catColor}44`,position:'relative',overflow:'hidden'}},
          h(CardImg,{id:c.id,style:{width:'100%',height:'100%',objectFit:'cover',borderRadius:'4px'}}),
          h('div',{style:{position:'absolute',bottom:'4px',right:'6px',width:'40px',height:'3px',borderRadius:'2px',background:catColor,opacity:.4}})
        ),
        isRec&&h('div',null,
          h('div',{className:'dp-sat-label'},'満腹度'),
          h('div',{className:'dp-sat-big'},`+${c.sat}`)
        )
      ),

      // effect text
      h('div',{className:'dp-section'},
        h('div',{className:'dp-section-title'},isRec?'▶ 料理完成時の効果':'▶ 起動効果'),
        h('div',{className:`dp-eff-text${(!c.eff)?' no-eff':''}`},
          c.eff||'効果なし'
        ),
        c.eff&&c.eff.includes('満腹バフ')&&h('div',{className:'dp-keyword-box'},
          h('div',{className:'dp-keyword-title'},'【満腹バフ：x】'),
          h('div',{className:'dp-keyword-desc'},'このバフが付与された食材を含む料理を提供したなら、相手の満腹度+x。')
        )
      ),

      // recipe requirements
      isRec&&h('div',{className:'dp-section'},
        h('div',{className:'dp-section-title'},'▶ 必要食材'),
        h('div',{className:'dp-req-list'},
          c.req.map(rid=>{
            const have=ingZone&&ingZone.some(z=>z.id===rid);
            return h('div',{key:rid,className:`dp-req-chip${have?' have':''}`},
              ING_NAME[rid]||rid
            );
          })
        )
      ),

      // ingredient category info
      !isRec&&c.cat&&h('div',{className:'dp-section'},
        h('div',{className:'dp-section-title'},'▶ カテゴリ'),
        h('div',{style:{display:'flex',alignItems:'center',gap:'8px'}},
          h('span',{style:{fontSize:'11px',color:catColor,fontWeight:'bold'}},c.catL)
        )
      ),

    )
  );
}

// ============================================================
// DECK BUILDER
// ============================================================
function DeckBuilder({onBack,savedDecks,onSaveDecks}){
  const [tab,setTab]=useState('ing');
  const [filter,setFilter]=useState('all');
  const [search,setSearch]=useState('');
  const [recSort,setRecSort]=useState('default'); // 'default'|'sat'|'kana'
  const [ing,setIng]=useState({});
  const [rec,setRec]=useState({});
  const [name,setName]=useState('マイデッキ');
  const [viewSaved,setViewSaved]=useState(false);
  const [showBackConfirm,setShowBackConfirm]=useState(false);
  const [showCodeModal,setShowCodeModal]=useState(false);   // コード発行モーダル
  const [showImportModal,setShowImportModal]=useState(false); // コード読み込みモーダル
  const [importInput,setImportInput]=useState('');
  const [importError,setImportError]=useState('');
  const [copyDone,setCopyDone]=useState(false);
  // 最後に保存した状態のスナップショット（保存後に変更がなければダイアログ不要）
  const [savedSnap,setSavedSnap]=useState(null); // {ing,rec,name} or null
  // スマホ用state
  const [spMobileView,setSpMobileView]=useState('lib'); // 'lib'|'deck'
  const [spDbDetail,setSpDbDetail]=useState(null); // カード詳細ボトムシート用

  // 現在の状態が保存済みスナップショットと一致するか
  const isSaved=savedSnap!==null
    &&JSON.stringify(savedSnap.ing)===JSON.stringify(ing)
    &&JSON.stringify(savedSnap.rec)===JSON.stringify(rec)
    &&savedSnap.name===name;
  // デッキが編集されているかどうか（1枚以上あり、かつ未保存）
  const isDirty=(Object.values(ing).some(v=>v>0)||Object.values(rec).some(v=>v>0))&&!isSaved;

  const iT=Object.values(ing).reduce((a,b)=>a+b,0);
  const rT=Object.values(rec).reduce((a,b)=>a+b,0);
  const errs=validateDeck(ing,rec);
  const isOk=!errs.length;

  const iShow=useMemo(()=>ING_DEFS.filter(d=>(filter==='all'||d.cat===filter)&&(!search||d.name.includes(search)||(d.eff||'').includes(search))),[filter,search]);
  const rShow=useMemo(()=>{
    const filtered=REC_DEFS.filter(d=>{
      if(!search)return true;
      if(d.name.includes(search)||(d.eff||'').includes(search))return true;
      const matchIngId=ING_DEFS.find(i=>i.name.includes(search))?.id;
      if(matchIngId&&d.req&&d.req.includes(matchIngId))return true;
      return false;
    });
    // 五十音ソート用の読みマップ（漢字カード）
    const YOMI={
      '卵かけご飯':'たまごかけごはん',
      '焼き鳥':'やきとり',
      'ステーキ':'すてーき',
      'さばの味噌煮':'さばのみそに',
      'ぶり大根':'ぶりだいこん',
      '温野菜サラダ':'おんやさいさらだ',
      '冷やっこ':'ひやっこ',
      'ほうれん草のソテー':'ほうれんそうのそてー',
      '野菜のナムル':'やさいのなむる',
      '揚げ出し豆腐':'あげだしどうふ',
      '牛丼':'ぎゅうどん',
      '豚の生姜焼き':'ぶたのしょうがやき',
      '味噌汁':'みそしる',
      '焼きそば':'やきそば',
      '親子丼':'おやこどん',
      '鮭のムニエル':'さけのむにえる',
      '麻婆豆腐':'まーぼーどうふ',
      '野菜炒め':'やさいいため',
      '豚汁':'とんじる',
      '肉じゃが':'にくじゃが',
      'お好み焼き':'おこのみやき',
      'お子様ランチ':'おこさまらんち',
    };
    function yomi(name){return YOMI[name]||name;}
    if(recSort==='sat')return [...filtered].sort((a,b)=>a.sat-b.sat);
    if(recSort==='kana')return [...filtered].sort((a,b)=>yomi(a.name).localeCompare(yomi(b.name),'ja'));
    return filtered;
  },[search,recSort]);

  function add(id,isR){const dk=isR?rec:ing;const set=isR?setRec:setIng;const cur=dk[id]||0;if(cur>=4)return;const tot=Object.values(dk).reduce((a,b)=>a+b,0);if(tot>=(isR?15:30))return;set({...dk,[id]:cur+1});}
  function rm(id,isR){const dk=isR?rec:ing;const set=isR?setRec:setIng;const cur=dk[id]||0;if(!cur)return;const n={...dk};if(cur===1)delete n[id];else n[id]=cur-1;set(n);}
  function auto(){
    const ni={...ing};const nr={...rec};
    let iN=Object.values(ni).reduce((a,b)=>a+b,0),rN=Object.values(nr).reduce((a,b)=>a+b,0);
    const iP=ING_DEFS.map(d=>d.id),rP=REC_DEFS.map(d=>d.id);
    let a=0;while(iN<30&&a<600){a++;const id=iP[0|Math.random()*iP.length];if((ni[id]||0)<4){ni[id]=(ni[id]||0)+1;iN++;}}
    a=0;while(rN<15&&a<600){a++;const id=rP[0|Math.random()*rP.length];if((nr[id]||0)<4){nr[id]=(nr[id]||0)+1;rN++;}}
    setIng(ni);setRec(nr);
  }
  function save(silent=false){
    const d={name,ingDeck:ing,recDeck:rec,savedAt:new Date().toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})};
    onSaveDecks([...savedDecks,d]);
    setSavedSnap({ing,rec,name});
    if(!silent)alert(`「${name}」を保存しました`);
  }
  function loadD(d){setIng(d.ingDeck);setRec(d.recDeck);setName(d.name);setViewSaved(false);}
  // タイトルへ戻るボタン処理
  function copyCode(){
    const code=encodeDeckCode(name,ing,rec);
    if(!code)return;
    navigator.clipboard.writeText(code).then(()=>{
      setCopyDone(true);setTimeout(()=>setCopyDone(false),2000);
    }).catch(()=>{
      // clipboard API が使えない場合はselect
      const el=document.createElement('textarea');
      el.value=code;document.body.appendChild(el);
      el.select();document.execCommand('copy');
      document.body.removeChild(el);
      setCopyDone(true);setTimeout(()=>setCopyDone(false),2000);
    });
  }
  function doImport(){
    setImportError('');
    const result=decodeDeckCode(importInput);
    if(!result){setImportError('コードが正しくありません。');return;}
    setIng(result.ingDeck);setRec(result.recDeck);setName(result.name);
    setSavedSnap(null);setImportInput('');setShowImportModal(false);
  }
  function handleBack(){
    if(isDirty){setShowBackConfirm(true);}
    else{onBack();}
  }
  function delD(i){onSaveDecks(savedDecks.filter((_,j)=>j!==i));}

  const iEnt=Object.entries(ing).sort(([a],[b])=>(ING_MAP[a]?.cat||'').localeCompare(ING_MAP[b]?.cat||''));
  const rEnt=Object.entries(rec).sort(([a],[b])=>(REC_MAP[b]?.sat||0)-(REC_MAP[a]?.sat||0));
  const cats={protein:0,carb:0,fat:0,vitamin:0,mineral:0};
  iEnt.forEach(([id,n])=>{const d=ING_MAP[id];if(d&&cats[d.cat]!==undefined)cats[d.cat]+=n;});

  if(viewSaved)return h('div',{className:'saved-screen'},
    h('div',{className:'saved-header'},
      h('button',{className:'btn sm',onClick:()=>setViewSaved(false)},'← 戻る'),
      h('span',{style:{fontSize:'13px',color:'var(--goldL)',fontWeight:'bold'}},'保存済みデッキ')
    ),
    h('div',{className:'saved-list'},
      !savedDecks.length&&h('div',{style:{fontSize:'12px',color:'var(--muted)',textAlign:'center',padding:'24px'}},'保存済みデッキがありません'),
      savedDecks.map((d,i)=>h('div',{key:i,className:'saved-item'},
        h('div',{style:{flex:1}},
          h('div',{className:'si-name'},d.name),
          h('div',{className:'si-info'},`食材${Object.values(d.ingDeck).reduce((a,b)=>a+b,0)}枚 / レシピ${Object.values(d.recDeck).reduce((a,b)=>a+b,0)}枚 — ${d.savedAt}`)
        ),
        h('div',{className:'si-btns'},
          h('button',{className:'btn sm',onClick:()=>loadD(d)},'読み込む'),
          h('button',{className:'btn sm danger',onClick:()=>delD(i)},'削除')
        )
      ))
    )
  );

  // ── スマホ版デッキ構築 ──
  if(isMobile()&&window.innerHeight>window.innerWidth){
    function spLibCard(def,isR){
      const cnt=isR?(rec[def.id]||0):(ing[def.id]||0);
      const tot=isR?rT:iT;
      const lim=isR?15:30;
      const maxed=cnt>=4||(tot>=lim&&!cnt);
      return h('div',{key:def.id,
        className:`sp-db-card${cnt?' in-deck':''}${maxed?' maxed':''}`,
        onClick:()=>setSpDbDetail(def),
        onTouchStart:()=>{_spDbLpTimer=setTimeout(()=>{_spDbLpTimer=null;setSpDbDetail(def);},480);},
        onTouchEnd:()=>{if(_spDbLpTimer){clearTimeout(_spDbLpTimer);_spDbLpTimer=null;}},
        onTouchCancel:()=>{if(_spDbLpTimer){clearTimeout(_spDbLpTimer);_spDbLpTimer=null;}}},
        h('div',{className:'sp-db-card-body'},
          h('span',{className:`lc-badge badge-${isR?'recipe':def.cat}`},isR?'レシピ':def.catL),
          h('div',{className:'sp-db-card-main'},
            h('div',{className:'sp-db-card-name'},
              def.name,
              isR&&h('span',{style:{fontSize:'10px',color:'#c86820',fontWeight:800,marginLeft:5}},`+${def.sat}`)
            ),
            isR&&h('div',{className:'sp-db-card-req'},
              def.req.map(r=>h('span',{key:r,className:'sp-db-req-chip'},ING_NAME[r]||r))
            ),
            h('div',{className:'sp-db-card-eff'},def.eff||'効果なし')
          )
        ),
        maxed
          ? h('button',{className:'sp-db-add-btn maxed-btn',onClick:e=>e.stopPropagation()},cnt?`×${cnt} 上限`:'上限')
          : h('button',{className:`sp-db-add-btn${cnt?' has-count':''}`,onClick:e=>{e.stopPropagation();add(def.id,isR);}},
              '＋',cnt>0&&h('div',{className:'add-cnt'},`×${cnt}`)
            )
      );
    }

    return h('div',{className:'sp-db'},
      // ヘッダー
      h('div',{className:'sp-db-header'},
        h('div',{className:'sp-db-title-row'},
          h('div',{className:'sp-db-title'},'📖 デッキ構築'),
          h('div',{className:'sp-db-counts'},
            h('span',{className:`sp-db-cnt ing${iT===30?' ok':iT>30?' over':''}`},`食材 ${iT}/30`),
            h('span',{className:`sp-db-cnt rec${rT===15?' ok':rT>15?' over':''}`},`レシピ ${rT}/15`)
          )
        ),
        h('div',{className:'sp-db-tabs'},
          h('button',{className:`sp-db-tab${spMobileView==='lib'?' active':''}`,onClick:()=>setSpMobileView('lib')},'📚 ライブラリ'),
          h('button',{className:`sp-db-tab${spMobileView==='deck'?' active':''}`,onClick:()=>setSpMobileView('deck')},'📋 デッキ確認')
        )
      ),

      // ── ライブラリタブ ──
      spMobileView==='lib'&&h('div',{className:'sp-db-lib'},
        h('div',{className:'sp-db-subtabs'},
          h('button',{className:`sp-db-subtab${tab==='ing'?' active':''}`,onClick:()=>{setTab('ing');setFilter('all');}},`🥕 食材カード`),
          h('button',{className:`sp-db-subtab${tab==='rec'?' active':''}`,onClick:()=>{setTab('rec');setFilter('all');}},`📖 レシピカード`)
        ),
        h('div',{className:'sp-db-filters'},
          tab==='ing'&&['all','protein','carb','fat','vitamin','mineral'].map(f=>
            h('button',{key:f,className:`sp-db-flt${filter===f?' active':''}`,onClick:()=>setFilter(f)},
              f==='all'?'すべて':CAT_LABELS[f]||f)
          ),
          tab==='rec'&&[['default','デフォルト'],['sat','満腹度'],['kana','五十音']].map(([v,l])=>
            h('button',{key:v,className:`sp-db-flt${recSort===v?' active':''}`,onClick:()=>setRecSort(v)},l)
          )
        ),
        h('div',{className:'sp-db-search-wrap'},
          h('input',{className:'sp-db-search',value:search,onChange:e=>setSearch(e.target.value),placeholder:'カード検索...'})
        ),
        h('div',{className:'sp-db-card-list'},
          tab==='ing'?iShow.map(d=>spLibCard(d,false)):rShow.map(d=>spLibCard(d,true))
        )
      ),

      // ── デッキ確認タブ ──
      spMobileView==='deck'&&h('div',{className:'sp-db-deck'},
        h('div',{className:'sp-db-deck-namebar'},
          h('span',{style:{fontSize:'10px',color:'var(--muted)',whiteSpace:'nowrap'}},'デッキ名:'),
          h('input',{className:'sp-db-deck-name-inp',value:name,onChange:e=>setName(e.target.value),placeholder:'デッキ名'})
        ),
        h('div',{className:'sp-db-deck-list'},
          h('div',{className:'sp-db-deck-hd'},
            h('span',null,'🥕 食材デッキ'),h('span',{style:{fontSize:'10px',color:'var(--muted)'}},`${iT}/30`)
          ),
          !iT&&h('div',{style:{fontSize:'10px',color:'var(--muted)',padding:'8px'}},'食材カードを追加してください'),
          iEnt.map(([id,cnt])=>{const d=ING_MAP[id];if(!d)return null;
            return h('div',{key:id,className:'sp-db-entry'},
              h('div',{className:'sp-db-entry-body'},
                h('div',{className:'cat-dot',style:{background:CAT_COLORS[d.cat]||'#a08060'}}),
                h('div',{className:'sp-db-entry-name'},d.name),
                h('div',{className:'sp-db-entry-cnt'},`×${cnt}`)
              ),
              h('button',{className:'sp-db-rm-btn',onClick:()=>rm(id,false)},'－')
            );
          }),
          h('div',{className:'sp-db-deck-hd',style:{marginTop:6}},
            h('span',null,'📖 レシピデッキ'),h('span',{style:{fontSize:'10px',color:'var(--muted)'}},`${rT}/15`)
          ),
          !rT&&h('div',{style:{fontSize:'10px',color:'var(--muted)',padding:'8px'}},'レシピカードを追加してください'),
          rEnt.map(([id,cnt])=>{const d=REC_MAP[id];if(!d)return null;
            return h('div',{key:id,className:'sp-db-entry'},
              h('div',{className:'sp-db-entry-body'},
                h('div',{className:'cat-dot',style:{background:'#c86820'}}),
                h('div',{className:'sp-db-entry-name'},d.name),
                h('div',{className:'sp-db-entry-cnt'},`×${cnt}`),
                h('div',{className:'sp-db-entry-sat'},`+${d.sat}`)
              ),
              h('button',{className:'sp-db-rm-btn',onClick:()=>rm(id,true)},'－')
            );
          })
        ),
        h('div',{className:'sp-db-stats'},
          h('div',{className:'sp-db-stats-title'},'食材カテゴリ分布'),
          Object.entries(cats).map(([cat,val])=>
            h('div',{key:cat,className:'sp-db-stat-row'},
              h('div',{className:'sp-db-stat-lbl'},CAT_LABELS[cat]),
              h('div',{className:'sp-db-stat-bar'},h('div',{className:'sp-db-stat-fill',style:{width:Math.min(100,iT?val/iT*100:0)+'%',background:CAT_COLORS[cat]}})),
              h('div',{className:'sp-db-stat-num'},val)
            )
          )
        )
      ),

      // バリデーション
      h('div',{className:`sp-db-valid${isOk?' ok':' ng'}`},
        isOk?'✓ デッキ完成':(errs[0]||'デッキを作成してください')
      ),

      // フッター（2行）
      h('div',{className:'sp-db-footer'},
        h('div',{className:'sp-db-footer-row'},
          h('button',{className:'sp-db-fbtn danger',onClick:handleBack},'← 戻る'),
          h('button',{className:'sp-db-fbtn',onClick:auto},'オートフィル'),
          h('button',{className:'sp-db-fbtn',onClick:()=>{setIng({});setRec({});}},'クリア'),
          h('button',{className:'sp-db-fbtn',onClick:()=>setViewSaved(true)},`保存済み(${savedDecks.length})`),
          h('button',{className:'sp-db-fbtn primary',onClick:()=>save(false),disabled:!isOk},'💾 保存')
        ),
        h('div',{className:'sp-db-footer-row'},
          h('button',{className:'sp-db-fbtn code',onClick:()=>setShowImportModal(true)},'📥 コード読み込み'),
          h('button',{className:'sp-db-fbtn code',onClick:()=>isOk&&setShowCodeModal(true),disabled:!isOk},'📤 コード作成')
        )
      ),

      // カード詳細ボトムシート
      h('div',{className:`sp-db-sheet${spDbDetail?' open':''}`,onClick:e=>e.stopPropagation()},
        h('div',{className:'sp-sheet-header'},h('div',{className:'sp-sheet-handle'}),h('button',{className:'sp-sheet-close',onClick:()=>setSpDbDetail(null)},'✕')),
        h('div',{className:'sp-sheet-body'},spDbDetail&&h(CardDetailPanel,{hovered:spDbDetail,ingZone:[]}))
      ),
      spDbDetail&&h('div',{style:{position:'fixed',inset:0,zIndex:199},onClick:()=>setSpDbDetail(null)}),

      // 保存済み・コード・確認ダイアログはPC版と共通（モーダルはfixed配置なのでそのまま表示）
      viewSaved&&h('div',{className:'trash-modal-overlay',onClick:()=>setViewSaved(false)},
        h('div',{className:'trash-modal',style:{maxWidth:'95vw'},onClick:e=>e.stopPropagation()},
          h('div',{className:'trash-modal-header'},
            h('h3',null,'📂 保存済みデッキ'),
            h('button',{className:'trash-modal-close',onClick:()=>setViewSaved(false)},'✕')
          ),
          h('div',{style:{padding:'10px',maxHeight:'60vh',overflowY:'auto'}},
            !savedDecks.length&&h('div',{style:{color:'var(--muted)',fontSize:'12px',padding:'10px'}},'保存済みデッキがありません'),
            savedDecks.map((dk,i)=>h('div',{key:i,style:{display:'flex',alignItems:'center',gap:'8px',padding:'8px',borderBottom:'1px solid var(--borderG)'}},
              h('div',{style:{flex:1}},
                h('div',{style:{fontWeight:700,fontSize:'12px'}},dk.name),
                h('div',{style:{fontSize:'10px',color:'var(--muted)'}},`食材${Object.values(dk.ing||{}).reduce((a,b)=>a+b,0)}枚 レシピ${Object.values(dk.rec||{}).reduce((a,b)=>a+b,0)}枚`)
              ),
              h('button',{className:'btn sm primary',onClick:()=>{setName(dk.name);setIng(dk.ing||{});setRec(dk.rec||{});setViewSaved(false);}},'読み込む'),
              h('button',{className:'btn sm danger',onClick:()=>{const n=[...savedDecks];n.splice(i,1);onSaveDecks(n);}},'削除')
            ))
          )
        )
      ),
      showCodeModal&&h('div',{className:'trash-modal-overlay',onClick:()=>setShowCodeModal(false)},
        h('div',{className:'trash-modal',style:{maxWidth:'95vw'},onClick:e=>e.stopPropagation()},
          h('div',{className:'trash-modal-header'},h('h3',null,'📤 デッキコード'),h('button',{className:'trash-modal-close',onClick:()=>setShowCodeModal(false)},'✕')),
          h('div',{style:{padding:'14px 16px'}},
            h('div',{style:{fontSize:'11px',color:'var(--muted)',marginBottom:'8px'}},'このコードをコピーしてフレンドに共有できます。'),
            h('div',{style:{fontFamily:'monospace',fontSize:'11px',background:'rgba(255,248,220,.8)',border:'1px solid rgba(140,100,40,.3)',borderRadius:'5px',padding:'10px 12px',wordBreak:'break-all',lineHeight:1.6,color:'#1a1008',userSelect:'all',cursor:'text',maxHeight:'120px',overflowY:'auto'}},encodeDeckCode(name,ing,rec)||''),
            h('div',{style:{display:'flex',gap:'8px',marginTop:'12px',justifyContent:'flex-end'}},

      h('button',{className:'btn sm',onClick:()=>setShowImportModal(true)},'📥 コード読込'),
      h('button',{className:'btn sm',onClick:()=>isOk&&setShowCodeModal(true),disabled:!isOk},'📤 コード発行'),
      h('button',{className:'btn sm',onClick:()=>save(false),disabled:!isOk},'保存')
    ),

    // デッキコード発行モーダル
    showCodeModal&&h('div',{className:'trash-modal-overlay',onClick:()=>setShowCodeModal(false)},
      h('div',{className:'trash-modal',style:{maxWidth:'480px'},onClick:e=>e.stopPropagation()},

function CoinFlipScreen({first,myPi,onDone}){
  const iFirst=first===myPi;
  const label=iFirst?'⚔️ 先攻！':'🛡️ 後攻！';
  const sub=iFirst?'1ターン目はドロー・料理提供なし':'相手が先に動きます';
  useEffect(()=>{const t=setTimeout(onDone,2200);return()=>clearTimeout(t);},[]);
  return h('div',{className:'coin-flip-screen'},
    h('div',{className:'coin-flip-coin'},'🪙'),
    h('div',{className:'coin-flip-result'},label),
    h('div',{className:'coin-flip-sub'},sub),
    h('div',{className:'coin-flip-bar'},h('div',{className:'coin-flip-bar-fill'}))
  );
}

function MulliganScreen({players,onConfirm,isAI,aiPi=1}){
  const [sel,setSel]=useState([new Set(),new Set()]);
  const [detailCard,setDetailCard]=useState(null);
  useEffect(()=>{
    if(!isAI)return;
    const p=players[aiPi];const ii=new Set(p.hand.filter(c=>!c._isRec).map(c=>c.id));
    const as=new Set(p.hand.filter(c=>c._isRec&&!c.req.some(r=>ii.has(r))).map(c=>c._uid));
    setSel(prev=>{const n=[...prev];n[aiPi]=as;return n;});
  },[]);
  function tog(pi,uid_){if(pi===aiPi&&isAI)return;setSel(prev=>{const n=[...prev];const s=new Set(n[pi]);s.has(uid_)?s.delete(uid_):s.add(uid_);n[pi]=s;return n;});}
  const myMullPi=1-aiPi;
  const oppMullPi=aiPi;

  // スマホ縦画面レイアウト
  if(isMobile()&&window.innerHeight>window.innerWidth){
    function spCard(c,pi,clickable){
      const sel_=sel[pi].has(c._uid);
      const back=!clickable;
      const lp=clickable?makeLongPress(
        ()=>setDetailCard(c),           // 長押し → 詳細
        ()=>tog(pi,c._uid)              // タップ → 選択/解除
      ):null;
      return h('div',{key:c._uid,
        className:`sp-mull-card${sel_?' selected':''}${back?' back':''}`,
        ...(lp||{})},
        !back&&[
          h('div',{key:'i',className:'smc-img'},h(CardImg,{id:c.id,style:{width:'100%',height:'100%',objectFit:'cover'}})),
          h('div',{key:'t',className:'mc-type'},c._isRec?'レシピ':'食材'),
          h('div',{key:'n',className:'mc-name'},c.name),
          c._isRec?h('div',{key:'s',className:'mc-sat'},`+${c.sat}`):null,
        ]
      );
    }
    return h('div',{className:'sp-mull'},
      // 相手手札（上・裏向き）
      h('div',{className:'sp-mull-opp'},
        h('div',{className:'sp-mull-opp-header'},
          `${isAI?'🤖 AI':'相手'}の手札 — ${sel[oppMullPi].size?`${sel[oppMullPi].size}枚返す予定`:'変更なし'}`
        ),
        h('div',{className:'sp-mull-rows'},
          h('div',{className:'sp-mull-ing-row'},
            (()=>{const ings=players[oppMullPi].hand.filter(c=>!c._isRec);
              return Array.from({length:5},(_,i)=>ings[i]?spCard(ings[i],oppMullPi,false):h('div',{key:'ei'+i,className:'sp-mull-card back'}));})()
          ),
          h('div',{className:'sp-mull-rec-row'},
            (()=>{const recs=players[oppMullPi].hand.filter(c=>c._isRec);
              return[0,1].map(i=>recs[i]?spCard(recs[i],oppMullPi,false):h('div',{key:'er'+i,className:'sp-mull-card back'}));})()
          )
        )
      ),
      // 中央タイトル
      h('div',{className:'sp-mull-center'},
        h('h2',null,'🃏 マリガン'),
        h('p',null,'戻したいカードをタップして選択（なしでもOK）')
      ),
      // 自分手札（下）
      h('div',{className:'sp-mull-self'},
        h('div',{className:'sp-mull-self-header'},'あなたの手札'),
        h('div',{className:'sp-mull-rows'},
          h('div',{className:'sp-mull-ing-row'},
            (()=>{const ings=players[myMullPi].hand.filter(c=>!c._isRec);
              return Array.from({length:5},(_,i)=>ings[i]?spCard(ings[i],myMullPi,true):h('div',{key:'ei'+i,className:'sp-mull-card',style:{opacity:.15,cursor:'default'}}));})()
          ),
          h('div',{className:'sp-mull-rec-row'},
            (()=>{const recs=players[myMullPi].hand.filter(c=>c._isRec);
              return[0,1].map(i=>recs[i]?spCard(recs[i],myMullPi,true):h('div',{key:'er'+i,className:'sp-mull-card',style:{opacity:.15,cursor:'default'}}));})()
          )
        )
      ),
      // フッター
      h('div',{className:'sp-mull-footer'},
        h('div',{className:'sp-mull-status'},
          sel[myMullPi].size?`${sel[myMullPi].size}枚を戻して引き直し`:'変更なし（そのままゲーム開始）'
        ),
        h('button',{className:'btn primary',style:{width:'100%',fontSize:'14px',padding:'10px'},
          onClick:()=>onConfirm(sel)},'マリガン確定 → ゲーム開始')
      ),
      // カード詳細ボトムシート
      h('div',{className:`sp-detail-sheet${detailCard?' open':''}`,onClick:e=>e.stopPropagation()},
        h('div',{className:'sp-sheet-header'},h('div',{className:'sp-sheet-handle'}),h('button',{className:'sp-sheet-close',onClick:()=>setDetailCard(null)},'✕')),
        h('div',{className:'sp-sheet-body'},detailCard&&h(CardDetailPanel,{hovered:detailCard,ingZone:[]}))
      ),
      detailCard&&h('div',{style:{position:'fixed',inset:0,zIndex:199},onClick:()=>setDetailCard(null)})
    );
  }

  // PC版（既存）
  function card(c,pi){
    const sel_=sel[pi].has(c._uid),back=pi===aiPi&&isAI;
    return h('div',{
      key:c._uid,
      className:`mull-card${sel_?' selected':''}${back?' back':''}`,
      onClick:()=>!back&&tog(pi,c._uid),
      onMouseEnter:isMobile()?null:()=>!back&&setDetailCard(c),
      onMouseLeave:isMobile()?null:()=>setDetailCard(null),
    },
      !back&&[
        h('div',{key:'t',className:'mc-type'},c._isRec?'レシピ':'食材'),
        h('div',{key:'n',className:'mc-name'},c.name),
        c._isRec
          ?h('div',{key:'s',className:'mc-sat'},`+${c.sat}`)
          :h('div',{key:'c',className:'mc-cat',style:{color:CAT_COLORS[c.cat]||''}},c.catL)
      ]
    );
  }
  return h('div',{className:'mulligan-screen'},
    h('div',{className:'mull-header'},
      h('h2',null,'🃏 マリガン'),
      h('p',null,'戻したいカードを選択（選択なしでもOK）')
    ),
    h('div',{className:'mull-area'},
      h('div',{className:'mull-player'},
        h('h3',null,'あなたの手札'),
        h('div',{className:'mull-hand'},players[myMullPi].hand.map(c=>card(c,myMullPi))),
        h('div',{className:'mull-info'},sel[myMullPi].size?`${sel[myMullPi].size}枚を戻して引き直し`:'変更なし')
      ),
      h('div',{className:'mull-preview-wrap',style:{width:'220px',flexShrink:0,display:'flex',flexDirection:'column'}},
        h(CardDetailPanel,{hovered:detailCard,ingZone:[]})
      ),
      h('div',{className:`mull-player${isAI?' ai-panel':''}`},
        h('h3',null,isAI?'🤖 AI の手札（非公開）':'相手の手札'),
        h('div',{className:'mull-hand'},players[oppMullPi].hand.map(c=>card(c,oppMullPi))),
        h('div',{className:'mull-info',style:{color:'var(--faint)'}},
          isAI?'AI が自動選択中...':sel[oppMullPi].size?`${sel[oppMullPi].size}枚を戻して引き直し`:'変更なし')
      )
    ),
    h('div',{className:'mull-footer'},
      h('button',{className:'btn primary',onClick:()=>onConfirm(sel)},'マリガン確定 → ゲーム開始')
    )
  );
}
