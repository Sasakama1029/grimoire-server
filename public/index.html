<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style id="orientation-lock">
  html { background: #c0aa88; }
</style>
<title>調理魔導書《レシピグリモワール》</title>
<!-- 外部サーバーURL設定: server-config.js を編集してください -->
<script src="server-config.js"></script>
<!-- NW.js環境で内蔵サーバーを起動 -->
<script src="server-start.js"></script>
<!-- ゲームエンジン共通化（NW.js/Electron対応） -->
<script src="game-engine.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#c0aa88}
body.allow-scroll{overflow-y:auto}
body{
  font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  color:#1e2530;font-weight:500;
  /* iPhoneノッチ・ホームバーのセーフエリア対応 */
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);
}
#root{height:100%;display:flex;flex-direction:column;overflow:hidden}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:rgba(0,0,0,.12)}
::-webkit-scrollbar-thumb{background:#8a6840;border-radius:3px}

:root{
  /* ── ナチュラル×木目キッチンテーマ ── */
  --bg:#c8b898;--bg2:#d4c4a8;--bg3:#ddd0b8;--bg4:#e8dcc8;--bg5:#f2ead8;
  /* アクセント：深いウォームブラウン */
  --gold:#4a2c08;--goldL:#6a3e10;--goldD:#301a04;--goldXD:#180c00;
  /* ボーダー */
  --border:#9a8060;--borderG:#7a6040;--borderL:#5a4020;
  /* テキスト */
  --text:#1a1008;
  --muted:#2e1e0a;
  --dim:#4a3018;
  --faint:#6a4c28;
  /* カテゴリ色（木目背景用：濃く調整） */
  --protein:#980e10;--proteinL:#c02020;
  --carb:#0a3880;--carbL:#1850a8;
  --fat:#145808;--fatL:#207818;
  --vitamin:#0a5c30;--vitaminL:#187848;
  --mineral:#4a1090;--mineralL:#6828b8;
  --red:#980e10;--green:#145808;--blue:#0a3880;
  --shadow:rgba(0,0,0,0.22);
}

/* ── SHARED ── */
.btn{padding:7px 27px;min-height:35px;min-width:93px;border-radius:6px;border:2px solid var(--borderG);background:rgba(255,248,220,.65);color:var(--goldD);cursor:pointer;font:36px/1.4 'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;font-weight:700;transition:all .15s;letter-spacing:.5px}
.btn:hover{background:rgba(255,248,220,.95);border-color:var(--goldL)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
.btn.primary{background:rgba(14,37,69,.18);border-color:var(--goldD);color:var(--goldD);font-weight:bold;font-size:12px}
.btn.primary:hover{background:rgba(14,37,69,.25)}
.btn.danger{background:rgba(140,20,20,.12);border-color:#a02020;color:#801010}
.btn.sm{font-size:15px;padding:7px 16px;min-height:32px}
.btn.xs{font-size:9px;padding:2px 7px}
.sp{flex:1}

/* ── TITLE ── */
.title-screen{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  min-height:100vh;position:relative;overflow-y:auto;overflow-x:hidden;
  padding:20px 0;
  background:
    repeating-linear-gradient(88deg,
      transparent 0px,transparent 22px,
      rgba(100,64,20,.07) 22px,rgba(100,64,20,.07) 26px,
      transparent 26px,transparent 50px,
      rgba(80,48,12,.04) 50px,rgba(80,48,12,.04) 52px
    ),
    radial-gradient(ellipse 70% 50% at 30% 20%,rgba(255,240,200,.2) 0%,transparent 55%),
    radial-gradient(ellipse 60% 40% at 80% 30%,rgba(240,220,170,.15) 0%,transparent 50%),
    radial-gradient(ellipse 80% 60% at 50% 110%,rgba(140,90,30,.18) 0%,transparent 55%),
    linear-gradient(180deg,#d8c8a0 0%,#ccbc90 30%,#c4b488 60%,#b8a878 100%);
}
.title-screen::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 50% 40% at 15% 35%,rgba(255,240,200,.18) 0%,transparent 55%),
    radial-gradient(ellipse 40% 30% at 85% 25%,rgba(255,230,170,.12) 0%,transparent 45%);
  pointer-events:none;
}
.title-screen::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,245,220,.15) 0%,transparent 35%);
  pointer-events:none;
}
.logo{text-align:center;position:relative;z-index:1}
.logo h1{font-size:32px;color:#1a0e04;letter-spacing:5px;text-shadow:0 2px 4px rgba(255,240,200,.6),0 1px 0 rgba(255,255,255,.5);font-weight:800}
.logo-en{font-size:18px;color:#3a1a04;letter-spacing:4px;margin-top:8px;font-weight:700;text-shadow:0 1px 2px rgba(255,240,200,.5)}
.logo-tagline{font-size:17px;color:#2a1404;margin-top:12px;font-style:italic;letter-spacing:1px;font-weight:600;text-shadow:0 1px 2px rgba(255,240,200,.4)}
.title-menu{display:flex;flex-direction:column;gap:10px;align-items:center;position:relative;z-index:1}
.mbtn{width:260px;padding:13px;border-radius:7px;border:1px solid var(--borderG);background:rgba(255,248,220,.65);color:#1a0e04;font-size:13px;cursor:pointer;transition:all .2s;font-family:inherit;letter-spacing:1px;text-align:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-weight:700}
.mbtn:hover{background:rgba(255,255,255,.8);border-color:var(--goldL);transform:scale(1.02);box-shadow:0 4px 16px rgba(0,0,0,.1)}
.mbtn.primary{border-color:#3a1a04;color:#1a0e04;font-weight:800;font-size:14px;background:rgba(255,248,220,.75)}
.mbtn.sm{width:180px;font-size:11px;padding:8px}
.title-note{font-size:9px;color:var(--faint);text-align:center;line-height:2;letter-spacing:.5px}

/* ── DECK BUILDER ── */
.db-screen{display:flex;flex-direction:column;height:100%;overflow:hidden}
.db-header{display:flex;align-items:center;gap:8px;padding:5px 12px;background:rgba(200,180,140,.7);border-bottom:1px solid rgba(140,100,40,.4);flex-wrap:wrap;backdrop-filter:blur(6px);flex-shrink:0}
.db-title{font-size:13px;color:#1a1008;font-weight:800;letter-spacing:2px;flex-shrink:0}
.db-tabs{display:flex;gap:4px}
.db-tab{font-size:11px;padding:4px 14px;border-radius:4px;border:1px solid rgba(140,100,40,.4);background:rgba(255,248,220,.4);color:#2e1e0a;cursor:pointer;font-family:inherit;transition:all .15s;font-weight:600}
.db-tab.active{background:rgba(74,44,8,.25);border-color:rgba(100,60,10,.6);color:#1a1008;font-weight:700}
.deck-info{margin-left:auto;display:flex;align-items:center;gap:8px}
.deck-count{font-size:15px;color:#2e1e0a;padding:6px 14px;border-radius:4px;border:1px solid rgba(140,100,40,.4);background:rgba(255,248,220,.5);font-weight:700}
.deck-count.ok{color:#145808;border-color:rgba(30,100,40,.5);background:rgba(200,240,210,.4)}
.deck-count.over{color:#900808;border-color:rgba(160,20,20,.5);background:rgba(255,210,210,.4)}
.deck-name-input{font-size:11px;padding:4px 10px;border-radius:4px;border:1px solid rgba(140,100,40,.5);background:rgba(255,255,255,.85);color:#1a1008;font-family:inherit;width:140px;font-weight:600}
.deck-name-input:focus{outline:none;border-color:rgba(100,60,10,.7);background:#ffffff;color:#1a1008}
.db-body{display:flex;flex:1;overflow:hidden;min-height:0}
.card-library{display:flex;flex-direction:column;flex:1;overflow:hidden;border-right:1px solid #6a4822;min-height:0}
.lib-filters{display:flex;gap:4px;padding:5px 8px;background:var(--bg);border-bottom:1px solid rgba(140,100,40,.3);flex-wrap:wrap;align-items:center;flex-shrink:0}
.filter-btn{font-size:10px;padding:3px 10px;border-radius:12px;border:1px solid #7a5530;background:rgba(60,36,10,.6);color:#d4b888;cursor:pointer;font-family:inherit;transition:all .12s}
.filter-btn:hover{border-color:rgba(100,60,10,.6);background:rgba(255,248,220,.9)}
.filter-btn.active{color:#1a1008;border-color:rgba(100,60,10,.5);font-weight:700}
.filter-btn.f-all.active{background:rgba(160,110,40,.25)}
.filter-btn.f-protein.active{background:rgba(180,40,40,.2);color:#800808}
.filter-btn.f-carb.active{background:rgba(40,80,180,.2);color:#0a3080}
.filter-btn.f-fat.active{background:rgba(60,140,20,.2);color:#1a6008}
.filter-btn.f-vitamin.active{background:rgba(20,150,80,.2);color:#0a6030}
.filter-btn.f-mineral.active{background:rgba(120,30,160,.2);color:#5a1080}
.search-input{font-size:11px;padding:3px 10px;border-radius:4px;border:1px solid rgba(140,100,40,.5);background:rgba(255,255,255,.85);color:#1a1008;font-family:inherit;width:130px;margin-left:auto;font-weight:600}
.search-input:focus{outline:none;border-color:rgba(100,60,10,.7);background:#ffffff;color:#1a1008}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(140px,calc((100% - 24px)/3)),1fr));gap:8px;padding:8px;overflow-y:auto;align-content:start;flex:1;min-height:0}
.lib-card{border-radius:8px;background:#38240e;border:1px solid #7a5530;padding:10px;cursor:pointer;transition:all .15s;position:relative;user-select:none;display:flex;flex-direction:column}
.lib-card:hover{border-color:#c49040;transform:translateY(-2px);background:#422a10;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.lib-card.in-deck{border-color:#c49040;background:#3e2c10}
.lib-card.maxed{opacity:.5;cursor:default}
.lib-card.maxed:hover{transform:none;background:#38240e;box-shadow:none}
.lib-card .lc-badge{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:bold;display:inline-block;margin-bottom:5px}
.badge-protein{background:rgba(208,80,80,.55);color:#fff;border:1px solid rgba(208,80,80,.7)}
.badge-carb{background:rgba(74,142,216,.55);color:#fff;border:1px solid rgba(74,142,216,.7)}
.badge-fat{background:rgba(112,192,48,.55);color:#fff;border:1px solid rgba(112,192,48,.7)}
.badge-vitamin{background:rgba(48,200,120,.55);color:#fff;border:1px solid rgba(48,200,120,.7)}
.badge-mineral{background:rgba(176,64,208,.55);color:#fff;border:1px solid rgba(176,64,208,.7)}
.badge-recipe{background:rgba(210,110,40,.55);color:#fff;border:1px solid rgba(210,110,40,.7)}
.lib-card .lc-name{font-size:13px;font-weight:bold;color:#fff8e8;line-height:1.4;margin-bottom:5px}
.lib-card .lc-req{font-size:10px;color:#d4b888;line-height:1.6;display:flex;flex-wrap:wrap;gap:2px 4px;margin-bottom:4px}
.lib-card .lc-req-chip{font-size:10px;color:#e8c898;background:rgba(255,200,100,.15);border:1px solid rgba(200,150,60,.5);border-radius:4px;padding:1px 6px;white-space:nowrap}
.lib-card .lc-eff{font-size:11px;color:#d4b080;line-height:1.5;margin-top:4px;flex:1}
.lib-card .lc-sat{font-size:16px;color:#f8d888;font-weight:bold;text-align:right;margin-top:4px}
.lib-card .lc-count{position:absolute;top:6px;right:6px;font-size:10px;background:rgba(0,0,0,.8);border-radius:10px;padding:2px 7px;color:#f8d888;font-weight:bold}
.lib-card .lc-add{display:block;width:100%;margin-top:6px;font-size:11px;background:rgba(140,85,10,.9);border-radius:4px;padding:3px 0;color:#f8d888;border:1px solid #c49040;text-align:center;box-sizing:border-box}
.lib-card:hover .lc-add{background:rgba(180,120,20,.95);border-color:#f8d888}
.deck-panel{display:flex;flex-direction:column;width:280px;flex-shrink:0;overflow:hidden;background:var(--bg);height:100%}
.deck-section{padding:5px 8px;border-bottom:1px solid rgba(140,100,40,.3);background:var(--bg)}
.deck-section h3{font-size:10px;color:#1a1008;letter-spacing:1px;margin-bottom:3px;display:flex;justify-content:space-between;font-weight:700}
.deck-section h3 span{color:#4a2c08;font-weight:800}
.deck-entry{display:flex;align-items:center;gap:5px;padding:2px 8px;border-bottom:1px solid rgba(140,100,40,.15);transition:background .1s}
.deck-entry:hover{background:rgba(255,248,220,.6)}
.de-name{font-size:10px;color:#1a1008;flex:1;line-height:1.4;font-weight:600}
.de-cnt{font-size:9px;color:#4a2c08;width:18px;text-align:center;font-weight:800}
.de-sat{font-size:9px;color:#301a04;width:22px;text-align:right;font-weight:700}
.de-rm{background:transparent;border:none;color:#7a5030;cursor:pointer;padding:0 3px;font-size:13px;line-height:1;transition:color .1s}
.de-rm:hover{color:#900}
.cat-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.deck-stats{padding:6px 8px;border-top:1px solid rgba(140,100,40,.3);flex-shrink:0}
.stat-row{display:flex;align-items:center;gap:5px;margin-bottom:3px}
.stat-label{font-size:8px;color:#2e1e0a;width:54px;flex-shrink:0;font-weight:700}
.stat-bar{flex:1;height:4px;background:rgba(0,0,0,.18);border-radius:3px;overflow:hidden}
.stat-fill{height:100%;border-radius:3px;transition:width .3s}
.stat-num{font-size:8px;color:#2e1e0a;width:18px;text-align:right;font-weight:700}
.db-footer{display:flex;gap:10px;align-items:center;padding:12px 16px;background:rgba(200,180,140,.7);border-top:1px solid rgba(140,100,40,.4);flex-wrap:wrap;flex-shrink:0;min-height:76px}
.validation-msg{font-size:15px;color:#900808;font-weight:700}
.validation-ok{font-size:15px;color:#145808;font-weight:700}
.saved-screen{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.saved-header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(200,180,140,.7);border-bottom:1px solid rgba(140,100,40,.4);flex-shrink:0}
.saved-list{padding:12px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex:1}
.saved-item{background:rgba(255,248,220,.7);border:1px solid rgba(140,100,40,.35);border-radius:7px;padding:10px 14px;display:flex;align-items:center;gap:10px;transition:border-color .15s}
.saved-item:hover{border-color:rgba(100,60,10,.7);background:rgba(255,248,220,.9)}
.si-name{font-size:12px;color:#1a1008;font-weight:800;flex:1}
.si-info{font-size:9px;color:#3a2010;font-weight:600}
.si-btns{display:flex;gap:5px}

/* ── アスペクト比対応 ── */
/* ── アスペクト比対応（デッキビルダー） ── */
/* 16:10（1920×1200等） */
@media(min-aspect-ratio:16/10) and (max-aspect-ratio:16/9){
  .deck-panel{width:260px}
  .card-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
}
/* 4:3（1024×768等） */
@media(max-aspect-ratio:4/3){
  .deck-panel{width:220px}
  .card-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  .lib-card .lc-eff{font-size:10px}
}
/* 21:9（3440×1440等） */
@media(min-aspect-ratio:21/9){
  .deck-panel{width:320px}
  .card-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
}
/* ── MULLIGAN ── */
.mulligan-screen{display:flex;flex-direction:column;height:100vh;background:var(--bg);padding:10px;gap:8px}
/* スマホ縦画面マリガン */
.sp-mull{display:flex;flex-direction:column;height:100vh;overflow:hidden;background:var(--bg)}
.sp-mull-opp{flex:1;display:flex;flex-direction:column;padding:6px 5px 3px;background:rgba(240,230,255,.45);border-bottom:1px solid rgba(120,80,160,.2)}
.sp-mull-opp-header{font-size:10px;font-weight:700;color:var(--muted);text-align:center;margin-bottom:3px;flex-shrink:0}
.sp-mull-center{flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:5px 8px 3px;background:rgba(255,248,220,.8);border-top:1px solid rgba(140,100,40,.2);border-bottom:1px solid rgba(140,100,40,.2)}
.sp-mull-center h2{font-size:15px;color:var(--goldL);letter-spacing:2px;font-weight:800}
.sp-mull-center p{font-size:10px;color:var(--muted);margin-top:2px}
.sp-mull-self{flex:1;display:flex;flex-direction:column;padding:3px 5px 6px;background:rgba(255,248,225,.55)}
.sp-mull-self-header{font-size:10px;font-weight:700;color:var(--text);text-align:center;margin-bottom:3px;flex-shrink:0}
.sp-mull-grid{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);gap:3px;flex:1;min-height:0}
/* 食材5枚・レシピ2枚の2行レイアウト */
.sp-mull-rows{display:flex;flex-direction:column;gap:3px;flex:1;min-height:0}
.sp-mull-ing-row{display:flex;gap:3px;flex:1}
.sp-mull-ing-row>.sp-mull-card{flex:1}
.sp-mull-rec-row{display:flex;gap:3px;flex:1;justify-content:center}
.sp-mull-rec-row>.sp-mull-card{flex:0 0 calc(20% - 2.4px)}
.sp-mull-card{border-radius:5px;border:2px solid var(--borderG);background:var(--bg3);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px 2px;cursor:pointer;overflow:hidden;position:relative;transition:all .15s}
.sp-mull-card.selected{border-color:#e44;box-shadow:0 0 0 2px rgba(228,68,68,.4)}
.sp-mull-card.selected::after{content:'返す';position:absolute;top:2px;left:2px;font-size:8px;background:#c22;color:#fff;padding:1px 4px;border-radius:2px;font-weight:700}
.sp-mull-card.back{background:repeating-linear-gradient(45deg,#16100a 0,#16100a 5px,#1a1409 5px,#1a1409 10px);cursor:default}
.sp-mull-card .smc-img{width:100%;flex:1;overflow:hidden;background:rgba(0,0,0,.06);min-height:0}
.sp-mull-card .mc-name{font-size:6px;font-weight:700;text-align:center;line-height:1.1;width:100%;padding:0 1px}
.sp-mull-card .mc-sat{font-size:8px;font-weight:800;color:var(--goldD)}
.sp-mull-card .mc-type{font-size:5px;color:var(--muted);width:100%;text-align:center}
.sp-mull-footer{flex-shrink:0;padding:5px 8px;background:rgba(255,248,220,.8);border-top:1px solid rgba(140,100,40,.2);display:flex;flex-direction:column;align-items:center;gap:5px}
.sp-mull-status{font-size:10px;color:var(--muted);font-weight:600}
.mull-header{text-align:center;padding:8px}
.mull-header h2{font-size:18px;color:var(--goldL);letter-spacing:2px}
.mull-header p{font-size:11px;color:var(--muted);margin-top:4px}
.mull-area{display:flex;gap:10px;flex:1;overflow:hidden;align-items:stretch}
.mull-player{flex:1;background:var(--bg2);border-radius:10px;border:1px solid var(--border);padding:10px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.mull-player h3{font-size:11px;color:var(--gold);text-align:center;letter-spacing:1px}
.mull-player.ai-panel h3{color:var(--muted)}
.mull-hand{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:8px 0}
.mull-card{width:144px;height:180px;border-radius:10px;border:2px solid var(--border);background:var(--bg3);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;transition:all .15s;position:relative;user-select:none}
.mull-card:hover{transform:translateY(-6px);border-color:var(--gold);box-shadow:0 10px 24px var(--shadow)}
.mull-card.selected{border-color:#e44;box-shadow:0 0 0 3px rgba(228,68,68,.45);transform:translateY(-8px)}
.mull-card.selected::after{content:'返す';position:absolute;top:6px;left:6px;font-size:11px;background:#c22;color:#fff;padding:2px 8px;border-radius:4px}
.mull-card .mc-type{font-size:11px;color:var(--muted);width:100%;text-align:center}
.mull-card .mc-name{font-size:16px;font-weight:bold;text-align:center;line-height:1.4;color:var(--text);margin-top:8px}
.mull-card .mc-cat{font-size:12px;text-align:center;margin-top:6px}
.mull-card .mc-sat{font-size:22px;color:var(--gold);font-weight:bold;margin-top:8px}
.mull-card.back{background:repeating-linear-gradient(45deg,#16100a 0,#16100a 8px,#1a1409 8px,#1a1409 16px);cursor:default;border:1.5px solid var(--border)}
.mull-card.back:hover{transform:none;border-color:var(--border);box-shadow:none}
.mull-footer{display:flex;justify-content:center;gap:10px;padding:5px}
.mull-info{font-size:10px;color:var(--muted);text-align:center;margin-top:4px}
/* マリガン中央プレビューパネル: grid外で使うのでgrid指定を上書き */
.mull-preview-wrap .detail-panel{grid-column:unset;grid-row:unset;height:100%}

/* ── GAME SCREEN ── */
.game-screen{
  display:grid;
  grid-template-rows:var(--header-h,40px) 1fr var(--bottom-h,50px);
  grid-template-columns:1fr var(--center-w,220px) 1fr;
  gap:3px;padding:3px;height:100vh;overflow:hidden;
  background:
    repeating-linear-gradient(88deg,
      transparent 0px,transparent 22px,
      rgba(100,64,20,.06) 22px,rgba(100,64,20,.06) 26px,
      transparent 26px,transparent 50px,
      rgba(80,48,12,.04) 50px,rgba(80,48,12,.04) 52px
    ),
    radial-gradient(ellipse 60% 40% at 20% 30%,rgba(255,240,200,.12) 0%,transparent 55%),
    radial-gradient(ellipse 50% 35% at 80% 20%,rgba(255,230,180,.1) 0%,transparent 50%),
    radial-gradient(ellipse 70% 50% at 50% 110%,rgba(140,90,30,.15) 0%,transparent 55%),
    linear-gradient(180deg,#d8c8a0 0%,#ccbc90 30%,#c4b488 60%,#b8a878 100%);
}

/* ── スマホ横画面対応 ── */
/* 高さが500px未満＝スマホ横画面想定（iPhone SE横: 375px高、iPhone 16横: 393px高） */
@media screen and (max-height:500px) and (orientation:landscape),
       screen and (max-height:500px) and (max-width:1024px){

  /* カードサイズをvhベースでスケーリング */
  :root{
    --ing-card-w: clamp(48px, 6.5vh, 64px);
    --ing-card-h: clamp(60px, 8vh, 78px);
  }

  /* 食材カード */
  .ing-card{width:var(--ing-card-w);height:var(--ing-card-h)}
  .ic-img-wrap{height:clamp(20px,3.5vh,32px);margin:-3px -3px 2px;width:calc(100% + 6px)}
  .ic-name{font-size:clamp(7px,1.5vh,10px)}
  .ic-cat{font-size:clamp(5px,1vh,7px)}
  .ing-slot-empty{width:var(--ing-card-w);height:var(--ing-card-h)}

  /* 手札カード */
  .hcard{width:clamp(60px,8vw,88px);height:clamp(72px,9.5vh,108px)}
  .hcard-img-wrap{height:clamp(30px,4.5vh,48px);margin:-5px -5px 3px;width:calc(100% + 10px)}
  .hc-name{font-size:clamp(8px,1.6vh,11px)}
  .hc-type{font-size:clamp(6px,1vh,8px)}
  .hc-sat{font-size:clamp(10px,1.8vh,14px)}
  .hand-slot-empty{width:clamp(60px,8vw,88px);height:clamp(72px,9.5vh,108px)}

  /* deck-mini */
  .deck-mini{width:clamp(42px,5.5vw,56px);height:clamp(52px,7vh,68px)}
  .dm-icon{font-size:clamp(11px,2vh,16px)}
  .dm-count{font-size:clamp(12px,2.2vh,18px)}
  .dm-label{font-size:clamp(5px,0.9vh,7px)}

  /* 完成料理カード */
  .rcard-done{min-width:clamp(38px,5vw,52px);padding:2px 3px}
  .rcard-done .rn{font-size:clamp(6px,1vh,8px)}
  .rcard-done .rs{font-size:clamp(9px,1.6vh,12px)}

  /* 満腹度バー */
  .sat-bar-left,.sat-bar-right{font-size:clamp(7px,1.2vh,9px);padding:2px 4px}
  .sat-num{font-size:clamp(9px,1.5vh,11px);width:24px}
  .sat-track{min-width:clamp(30px,5vw,50px)}

  /* センターパネル：ボタンを縦に小さく */
  .center-btn{font-size:clamp(10px,1.8vh,13px);padding:clamp(5px,1.2vh,8px) 6px;min-height:36px}
  .phase-badge{font-size:clamp(8px,1.5vh,11px)}
  .turn-info{font-size:clamp(8px,1.3vh,10px)}

  /* ボトムログ */
  .g-log{max-height:clamp(32px,5vh,48px)}
  .g-log .log-line{font-size:clamp(8px,1.3vh,10px);padding:1px 0}

  /* タイトル画面 */
  .title-screen{gap:clamp(6px,1.5vh,14px);padding:8px 0;justify-content:flex-start;padding-top:clamp(8px,2vh,16px)}
  .logo h1{font-size:clamp(18px,4vh,26px);letter-spacing:2px}
  .logo-en{font-size:clamp(11px,2vh,14px)}
  .logo-tagline{font-size:clamp(10px,1.8vh,13px)}
  .title-menu{gap:clamp(4px,1vh,8px)}
  .mbtn{font-size:clamp(11px,2vh,14px);padding:clamp(5px,1.2vh,10px) 12px;min-height:40px;width:220px}
  .mbtn.sm{width:160px}

  /* デッキビルダー */
  .db-body{flex-direction:row} /* 横画面なので横並びのまま */
  .deck-panel{width:200px}
  .db-footer{flex-wrap:wrap;gap:5px}
  .db-footer .btn{font-size:10px;padding:4px 8px;min-height:36px}

  /* タップターゲット確保（最小44px） */
  .btn, .center-btn, .mbtn{min-height:44px}
  .ing-card, .hcard{touch-action:manipulation}
}

/* ── スマホ版デッキ構築 ── */
.sp-db{display:flex;flex-direction:column;height:100vh;overflow:hidden;background:var(--bg)}
.sp-db-header{flex-shrink:0;padding:7px 10px 5px;background:rgba(255,248,220,.95);border-bottom:2px solid rgba(140,100,40,.25)}
.sp-db-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.sp-db-title{font-size:14px;font-weight:800;color:var(--goldD)}
.sp-db-counts{display:flex;gap:5px}
.sp-db-cnt{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;border:1px solid}
.sp-db-cnt.ing{border-color:#5580c0;color:#2a4090;background:rgba(85,128,192,.12)}
.sp-db-cnt.rec{border-color:#c86820;color:#7a3a00;background:rgba(200,104,32,.12)}
.sp-db-cnt.ok{border-width:2px}
.sp-db-cnt.over{border-color:#c03030;color:#c03030;background:rgba(200,60,60,.12)}
.sp-db-tabs{display:flex}
.sp-db-tab{flex:1;padding:6px;font-size:12px;font-weight:700;border:none;border-bottom:2px solid transparent;background:none;color:var(--muted);cursor:pointer;font-family:inherit}
.sp-db-tab.active{color:var(--goldD);border-bottom:2px solid var(--goldD)}
/* ライブラリ */
.sp-db-lib{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.sp-db-subtabs{display:flex;gap:4px;padding:5px 8px;flex-shrink:0;background:rgba(255,248,220,.6);border-bottom:1px solid var(--borderG)}
.sp-db-subtab{flex:1;padding:5px;font-size:11px;font-weight:700;border-radius:5px;border:1px solid var(--borderG);background:rgba(255,255,255,.5);color:var(--muted);cursor:pointer;text-align:center;font-family:inherit}
.sp-db-subtab.active{background:var(--goldD);color:#fff;border-color:var(--goldD)}
.sp-db-filters{display:flex;gap:3px;padding:4px 8px;flex-shrink:0;flex-wrap:wrap;background:rgba(255,248,220,.5)}
.sp-db-flt{padding:3px 8px;font-size:10px;border-radius:3px;border:1px solid var(--borderG);background:rgba(255,255,255,.6);color:var(--muted);cursor:pointer;font-family:inherit}
.sp-db-flt.active{background:var(--goldD);color:#fff;border-color:var(--goldD)}
.sp-db-search-wrap{padding:4px 8px 2px;flex-shrink:0}
.sp-db-search{width:100%;padding:5px 8px;font-size:11px;border:1px solid var(--borderG);border-radius:4px;background:rgba(255,255,255,.7);color:var(--text);font-family:inherit;outline:none}
.sp-db-card-list{flex:1;overflow-y:auto;padding:4px 6px;display:flex;flex-direction:column;gap:4px}
/* ライブラリカード */
.sp-db-card{border-radius:7px;background:rgba(255,248,220,.85);border:1px solid rgba(140,100,40,.25);overflow:hidden;display:flex;align-items:stretch;min-height:54px;cursor:pointer}
.sp-db-card.in-deck{border-color:#5580c0;background:rgba(85,128,192,.08)}
.sp-db-card.maxed{opacity:.45}
.sp-db-card-body{flex:1;padding:8px;display:flex;align-items:flex-start;gap:6px;min-width:0}
.sp-db-card-main{flex:1;min-width:0}
.sp-db-card-name{font-size:12px;font-weight:700;color:var(--text);line-height:1.3}
.sp-db-card-eff{font-size:9px;color:var(--muted);margin-top:2px;line-height:1.4}
.sp-db-card-req{display:flex;gap:2px;flex-wrap:wrap;margin-top:3px}
.sp-db-req-chip{font-size:8px;padding:1px 4px;border-radius:2px;background:rgba(140,100,40,.15);color:var(--goldD)}
/* ＋ボタン：右端縦いっぱい */
.sp-db-add-btn{width:44px;align-self:stretch;border:none;border-left:1px solid rgba(140,100,40,.2);background:rgba(122,80,32,.1);color:var(--goldD);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;flex-shrink:0;font-family:inherit;transition:background .15s}
.sp-db-add-btn:active{background:rgba(122,80,32,.28)}
.sp-db-add-btn.has-count{background:rgba(85,128,192,.12);border-left-color:rgba(85,128,192,.3)}
.sp-db-add-btn .add-cnt{font-size:9px;font-weight:700;color:#2a4090;line-height:1}
.sp-db-add-btn.maxed-btn{background:rgba(0,0,0,.05);color:rgba(0,0,0,.25);cursor:default;font-size:10px;font-weight:700}
/* デッキ確認 */
.sp-db-deck{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.sp-db-deck-namebar{display:flex;align-items:center;gap:6px;padding:5px 8px;flex-shrink:0;background:rgba(255,248,220,.7);border-bottom:1px solid var(--borderG)}
.sp-db-deck-name-inp{flex:1;padding:4px 7px;font-size:12px;font-weight:700;border:1px solid var(--borderG);border-radius:4px;background:rgba(255,255,255,.7);color:var(--text);font-family:inherit;outline:none}
.sp-db-deck-list{flex:1;overflow-y:auto;padding:4px 6px;display:flex;flex-direction:column;gap:3px}
.sp-db-deck-hd{font-size:10px;font-weight:800;color:var(--goldD);padding:5px 4px 3px;border-bottom:1px solid rgba(140,100,40,.2);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.sp-db-entry{display:flex;align-items:stretch;border-radius:6px;background:rgba(255,248,220,.75);border:1px solid rgba(140,100,40,.2);overflow:hidden;min-height:44px}
.sp-db-entry-body{display:flex;align-items:center;gap:6px;flex:1;padding:0 8px}
.sp-db-entry-name{flex:1;font-size:11px;font-weight:700;color:var(--text)}
.sp-db-entry-cnt{font-size:12px;font-weight:700;color:#2a4090;min-width:24px;text-align:right}
.sp-db-entry-sat{font-size:10px;color:var(--goldD);min-width:24px;text-align:right}
.sp-db-rm-btn{width:44px;align-self:stretch;border:none;border-left:1px solid rgba(200,60,60,.25);background:rgba(220,80,80,.1);color:#c03030;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
.sp-db-rm-btn:active{background:rgba(220,80,80,.3)}
/* カテゴリ分布 */
.sp-db-stats{flex-shrink:0;padding:6px 10px;border-top:1px solid var(--borderG);background:rgba(255,248,220,.6)}
.sp-db-stats-title{font-size:8px;color:var(--muted);letter-spacing:1px;margin-bottom:4px}
.sp-db-stat-row{display:flex;align-items:center;gap:4px;margin-bottom:3px}
.sp-db-stat-lbl{width:40px;font-size:8px;color:var(--muted);text-align:right}
.sp-db-stat-bar{flex:1;height:5px;background:rgba(0,0,0,.1);border-radius:2px;overflow:hidden}

.sp-db-valid.ok{color:#1a6a1a;background:rgba(100,200,100,.15)}
.sp-db-valid.ng{color:#a01010;background:rgba(200,80,80,.1)}
/* フッター */
.sp-db-footer{flex-shrink:0;padding:5px 8px;background:rgba(255,248,220,.95);border-top:2px solid rgba(140,100,40,.25);display:flex;flex-direction:column;gap:4px}

.sp-db-fbtn{flex:1;padding:7px 3px;font-size:10px;font-weight:700;border-radius:6px;border:1px solid var(--borderG);background:rgba(140,100,40,.12);color:var(--goldD);cursor:pointer;font-family:inherit;white-space:nowrap;min-height:36px;text-align:center}

/* カード詳細ボトムシート */
.sp-db-sheet{position:fixed;bottom:0;left:0;right:0;max-height:55vh;background:var(--bg2);border-radius:14px 14px 0 0;border:1px solid var(--goldD);border-bottom:none;z-index:200;transform:translateY(100%);transition:transform .3s ease;overflow:hidden;padding:0}

.sp-player-label{font-size:10px;font-weight:800;color:var(--text);white-space:nowrap}
.sp-deck-badges{display:flex;gap:3px}
.sp-deck-btn{display:flex;align-items:center;gap:2px;font-size:9px;font-weight:700;padding:2px 5px;border-radius:4px;border:1px solid rgba(140,100,40,.4);background:rgba(255,248,220,.7);cursor:pointer;white-space:nowrap;min-height:24px}

.sp-center-left{flex:1;display:flex;flex-direction:column;justify-content:center;padding:4px 8px;border-right:1px solid rgba(140,100,40,.2)}
.sp-center-right{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;padding:4px 8px;gap:4px}
.sp-phase-badge{font-size:10px;font-weight:800;color:var(--goldD);background:rgba(200,170,80,.2);border-radius:4px;padding:2px 6px;white-space:nowrap;display:inline-block}
.sp-turn-info{font-size:9px;color:var(--muted);margin-top:2px}
.sp-btn{font-size:11px;padding:6px 12px;border-radius:5px;border:1px solid var(--borderG);background:rgba(74,44,8,.15);color:var(--goldD);cursor:pointer;font-family:inherit;font-weight:800;white-space:nowrap;min-height:32px;min-width:90px}
.sp-btn.primary{background:rgba(74,44,8,.32);border-color:var(--goldD)}
.sp-btn:disabled{opacity:.4;cursor:default}
.sp-hint{font-size:10px;color:var(--muted);text-align:right}
.sp-missing{font-size:9px;color:#900808;font-weight:700;text-align:right}
.sp-hand-row{flex-shrink:0;display:flex;gap:2px;padding:3px 4px;background:rgba(255,248,220,.6);border-top:1px solid rgba(140,100,40,.25)}
.sp-hand-row.drop-target{background:rgba(100,200,100,.25);outline:2px dashed #4caf50;border-radius:4px}
.sp-hcard{flex:1;min-width:0;aspect-ratio:52/64;border-radius:4px;border:1px solid var(--borderG);background:var(--bg3);display:flex;flex-direction:column;align-items:center;padding:2px 1px;cursor:pointer;overflow:hidden;position:relative;transition:all .15s}
.sp-hcard.sel{box-shadow:0 0 0 2px var(--goldL);border-color:var(--goldL)}
.sp-hcard.dragging{opacity:.4;transform:scale(.94)}
.sp-hcard.sh-rec{border-top:2px solid var(--goldD)}
.sp-hcard.sh-ing{border-top:2px solid var(--carb)}
.sp-hcard .sh-img{width:100%;flex:1;overflow:hidden;background:rgba(0,0,0,.06);min-height:20px}
.sp-hcard .sh-name{font-size:5px;font-weight:700;text-align:center;line-height:1.1;width:100%;padding:0 1px}
.sp-hcard .sh-sat{font-size:7px;font-weight:800;color:var(--goldD);line-height:1}
.sp-hcard.back{background:repeating-linear-gradient(45deg,#16100a 0,#16100a 5px,#1a1409 5px,#1a1409 10px)}
.sp-hand-empty{flex:1;min-width:0;opacity:.15;border-radius:4px;border:1px dashed rgba(140,100,40,.3)}
.sp-detail-sheet{position:fixed;bottom:0;left:0;right:0;max-height:55vh;background:var(--bg2);border-radius:14px 14px 0 0;border:1px solid var(--goldD);border-bottom:none;z-index:200;transform:translateY(100%);transition:transform .3s ease;overflow:hidden;padding:0}
.sp-detail-sheet.open{transform:translateY(0)}
.sp-sheet-handle{width:36px;height:4px;background:rgba(140,100,40,.4);border-radius:2px;margin:0 auto 10px}
.sp-sheet-header{display:flex;align-items:center;justify-content:center;padding:8px 12px 4px;flex-shrink:0;position:relative}
.sp-sheet-close{position:absolute;top:8px;right:12px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1;padding:4px;z-index:1}
.sp-sheet-body{overflow-y:auto;padding:12px 12px 16px;flex:1}
/* ドラッグゴースト */
.sp-drag-ghost{position:fixed;pointer-events:none;z-index:9999;opacity:.85;transform:translate(-50%,-50%) scale(1.1);border-radius:5px;background:var(--bg3);border:2px solid var(--goldL);padding:4px 8px;font-size:11px;font-weight:700;color:var(--text);white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.3)}
/* 4:3（縦に狭い） */
@media(max-aspect-ratio:4/3){
  .game-screen{grid-template-rows:var(--header-h,36px) 1fr var(--bottom-h,40px)}
  .g-log .log-line{font-size:9px;padding:1px 0}
}
/* 21:9（横長） */
@media(min-aspect-ratio:21/9){
  .game-screen{grid-template-columns:1fr var(--center-w,260px) 1fr}
  .hand-slots{gap:5px}
}
/* ヘッダー */
.g-header{
  grid-column:1/4;grid-row:1/2;
  display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;padding:3px 12px;gap:8px;
  background:rgba(255,248,230,.55);border-radius:5px;
  border:1px solid rgba(140,100,40,.3);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 1px 4px rgba(0,0,0,.12);
}
.g-header-center{display:flex;flex-direction:column;align-items:center;gap:2px}
.g-title{font-size:12px;color:var(--goldD);font-weight:800;letter-spacing:2px;white-space:nowrap;font-size:12px}
.phase-badge{font-size:10px;padding:2px 10px;border-radius:10px;border:1px solid var(--borderG);color:var(--goldD);background:rgba(74,44,8,.12);white-space:nowrap;font-weight:700}
.turn-info{font-size:10px;color:var(--muted);white-space:nowrap;font-weight:600}
.turn-timer-wrap{width:100%;max-width:160px;margin-top:3px}
.turn-timer-bar{height:5px;border-radius:3px;background:rgba(0,0,0,.2);overflow:hidden}
.turn-timer-fill{height:100%;border-radius:3px;transition:width .9s linear,background .3s}
.turn-timer-fill.safe{background:linear-gradient(90deg,#4caf50,#8bc34a)}
.turn-timer-fill.warn{background:linear-gradient(90deg,#ff9800,#ffc107)}
.turn-timer-fill.danger{background:#e53935;animation:timerPulse .6s ease-in-out infinite alternate}
.turn-timer-sec{font-size:9px;text-align:center;margin-top:1px;font-weight:bold}
.turn-timer-sec.danger{color:#e53935}
@keyframes timerPulse{from{opacity:1}to{opacity:.5}}
/* 満腹度バー */
.sat-bar-left{display:flex;align-items:center;gap:5px;padding:2px 6px;background:rgba(255,248,220,.4);border-radius:4px;border:1px solid rgba(140,100,40,.25);justify-content:flex-start}
.sat-bar-right{display:flex;align-items:center;gap:5px;padding:2px 6px;background:rgba(255,248,220,.4);border-radius:4px;border:1px solid rgba(140,100,40,.25);justify-content:flex-end}
.sat-label{font-size:9px;color:var(--muted);width:auto;flex-shrink:0;font-weight:600}
.sat-track{flex:1;height:8px;background:rgba(0,0,0,.18);border-radius:4px;overflow:hidden;min-width:60px}
.sat-fill{height:100%;border-radius:4px;transition:width .5s ease}
.sat-fill.p0{background:linear-gradient(90deg,#208850,#40b870)}
.sat-fill.p1{background:linear-gradient(90deg,#b84018,#e06030)}
.sat-num{font-size:11px;font-weight:bold;width:34px;text-align:right;flex-shrink:0}

/* 赤: 自分フィールド（col1 / row2） */
/* 青: 相手フィールド（col3 / row2） */
.fields-area-self{grid-column:1/2;grid-row:2/3;overflow:hidden;display:flex;flex-direction:column;gap:0;min-height:0}
.fields-area-opp{grid-column:3/4;grid-row:2/3;overflow:hidden;display:flex;flex-direction:column;gap:0;min-height:0}
/* pfield は各エリアの全体を使う */
.pfield{display:flex;flex-direction:column;gap:2px;background:rgba(255,248,225,.45);border-radius:5px;padding:5px;border:1px solid rgba(140,100,40,.28);overflow:hidden;min-height:0;height:100%;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pfield.active{border-color:rgba(100,60,10,.5);background:rgba(255,248,220,.7);box-shadow:0 0 12px rgba(100,60,10,.15)}
.pfield.ai-field{border-color:rgba(120,80,160,.3);background:rgba(240,230,255,.35)}
.plabel{font-size:10px;color:var(--text);text-align:center;padding:1px 0;letter-spacing:1px;font-weight:700;flex-shrink:0}
.zlabel{font-size:8px;color:var(--dim);margin-bottom:1px;padding-left:2px;letter-spacing:.5px;flex-shrink:0;font-weight:600}
/* 食材ゾーン */
.ing-zone{background:rgba(255,245,210,.3);border-radius:4px;padding:4px;border:1px solid rgba(140,100,40,.2);flex:2;min-height:0;overflow-y:auto}
.ing-slots{display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;justify-content:center}
.ing-slot-empty{width:72px;height:88px;border-radius:5px;border:1px dashed rgba(140,100,40,.35);background:rgba(255,245,210,.12);flex-shrink:0}
.card-row{display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;justify-content:center}
.hand-area .card-row{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-start;align-content:flex-start;overflow-y:auto}
.empty-hint{font-size:9px;color:var(--faint);padding:6px}
/* 手札スロット枠 */
.hand-slots{display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start}
.hand-slot-empty{width:102px;height:123px;border-radius:6px;border:1px dashed rgba(140,100,40,.28);background:rgba(255,245,210,.1);flex-shrink:0}
/* 中央パネル */
.center-panel{grid-column:2/3;grid-row:2/3;display:flex;flex-direction:column;gap:3px;min-height:0;overflow:hidden}
.center-btns{background:rgba(255,248,220,.55);border-radius:6px;border:1px solid rgba(140,100,40,.28);padding:8px;display:flex;flex-direction:column;gap:6px;flex-shrink:0;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.center-btn{font-size:17px;padding:13px 12px;border-radius:6px;border:1px solid var(--borderG);background:rgba(74,44,8,.15);color:var(--goldD);cursor:pointer;font-family:inherit;font-weight:bold;transition:all .15s;width:100%;text-align:center}
.center-btn:hover{background:rgba(14,37,69,.25);border-color:var(--goldL)}
.center-btn.primary{background:rgba(74,44,8,.25);border-color:var(--goldD);color:var(--goldD)}
.center-btn.primary:hover{background:rgba(74,44,8,.35)}
.center-btn:disabled{opacity:.4;cursor:not-allowed}
.center-hint{font-size:20px;color:#1a1008;text-align:center;padding:6px 8px;line-height:1.6;font-weight:600}
.center-missing{font-size:16px;color:#900808;text-align:center;padding:6px 8px;font-weight:700}

/* 相手山札・ごみ箱ミニ表示（相手フィールド上部） */
.opp-deck-row{display:flex;gap:4px;justify-content:center;margin-bottom:3px;flex-shrink:0}
.opp-deck-chip{font-size:9px;color:var(--muted);background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:4px;padding:2px 7px;cursor:pointer;transition:background .1s}
.opp-deck-chip:hover{background:rgba(255,255,255,.06);color:var(--text)}

/* ingredient card in zone */
/* 食材カード画像エリア */
.ic-img-wrap{width:100%;height:42px;overflow:hidden;border-radius:3px 3px 0 0;flex-shrink:0;background:rgba(0,0,0,.06);margin:-4px -4px 3px;width:calc(100% + 8px)}
/* 手札カード画像エリア */
.hcard-img-wrap{width:100%;height:58px;overflow:hidden;border-radius:5px 5px 0 0;flex-shrink:0;background:rgba(0,0,0,.06);margin:-8px -6px 4px;width:calc(100% + 12px)}
.ing-card{width:var(--ing-card-w,72px);height:var(--ing-card-h,88px);border-radius:5px;background:rgba(255,250,230,.8);border:1px solid rgba(140,100,40,.35);padding:4px;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:all .15s;position:relative;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.ing-card:hover{transform:translateY(-3px);box-shadow:0 5px 14px rgba(0,0,0,.15);z-index:2}
.ing-card.sel{box-shadow:0 0 0 2px var(--goldL);border-color:var(--goldL)}
.ing-card.activated{opacity:.55;border-color:#38a068}
.ing-card.highlight{box-shadow:0 0 0 2px var(--vitaminL);border-color:var(--vitaminL)}
.ing-card.placed-this-turn{border-style:dashed;border-color:var(--goldL);opacity:.85}
.ing-card.toast-mark{box-shadow:0 0 0 2px #e88020,0 0 8px rgba(232,128,32,.4);border-color:#e88020}
.ing-card.toast-mark::after{content:'★';position:absolute;top:2px;right:2px;font-size:9px;line-height:1;color:#e88020;font-weight:bold}
.ing-card.placed-this-turn:hover::after{content:'手札に戻す';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap;background:rgba(0,0,0,.75);color:var(--goldL);padding:2px 6px;border-radius:3px;pointer-events:none}
.ing-card .ic-cat{font-size:8px;color:var(--dim);width:100%;text-align:center;margin-bottom:2px;font-weight:600}
.ing-card .ic-name{font-size:12px;font-weight:700;text-align:center;line-height:1.3;color:var(--text)}
.ing-card .ic-dot{width:5px;height:5px;border-radius:50%;background:var(--gold);margin-top:3px}
.ing-card .ic-act{font-size:8px;color:#38a068;margin-top:2px}
.ing-card .ic-satbuff{font-size:8px;color:#e88020;font-weight:bold;text-align:center;margin-top:1px;line-height:1}
.ing-card.protein{border-top:3px solid var(--protein)}
.ing-card.carb{border-top:3px solid var(--carb)}
.ing-card.fat{border-top:3px solid var(--fat)}
.ing-card.vitamin{border-top:3px solid var(--vitamin)}
.ing-card.mineral{border-top:3px solid var(--mineral)}

/* recipe zone */
.recipe-zone{background:rgba(0,0,0,.18);border-radius:4px;padding:4px;border:1px solid var(--border);flex:1;min-height:0;overflow-y:auto}
.rcard-done{
  width:72px;height:58px;
  background:rgba(80,46,6,.55);border:1px solid var(--goldD);border-radius:5px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:4px;flex-shrink:0;cursor:default;transition:all .15s;
}
.rcard-done:hover{transform:translateY(-2px);box-shadow:0 4px 10px var(--shadow)}
.rcard-done .rn{font-size:9px;color:#1a1008;text-align:center;line-height:1.4;font-weight:700}
.rcard-done .rs{font-size:13px;color:#301a04;font-weight:800;margin-top:2px}

/* hand */
.hand-row-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;flex-shrink:0}
.hand-area{background:rgba(0,0,0,.18);border-radius:4px;padding:6px;border:1px solid var(--border);flex:4;min-height:0;overflow-y:auto}
.hcard{
  width:var(--hcard-w,102px);height:var(--hcard-h,123px);
  border-radius:6px;border:1px solid var(--borderG);background:var(--bg3);
  display:flex;flex-direction:column;align-items:center;padding:5px;
  cursor:pointer;transition:all .15s;flex-shrink:0;
}
.hcard:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 6px 16px var(--shadow);z-index:2}
.hcard.sel{box-shadow:0 0 0 2px var(--goldL);transform:translateY(-6px);border-color:var(--goldL)}
.hcard.disabled{opacity:.35;cursor:not-allowed}
.hcard .hc-type{font-size:9px;padding:1px 5px;border-radius:2px;width:100%;text-align:center;margin-bottom:3px;font-weight:700}
.hc-type.ing{background:rgba(14,72,152,.15);color:#0a3880;border:1px solid rgba(14,72,152,.2)}
.hc-type.rec{background:rgba(152,14,16,.12);color:#780a0a;border:1px solid rgba(152,14,16,.18)}
.hcard .hc-name{font-size:12px;font-weight:700;text-align:center;color:var(--text);line-height:1.3;margin-top:4px}
.hcard .hc-sat{font-size:14px;color:var(--goldD);font-weight:800;margin-top:5px}
.hcard.back{background:repeating-linear-gradient(45deg,#16100a 0,#16100a 5px,#1a1409 5px,#1a1409 10px);cursor:default;border:1px solid var(--border)}
.hcard.back:hover{transform:none;box-shadow:none;border-color:var(--border)}
.deck-btns{display:flex;gap:3px}
.dbtn{font-size:9px;padding:2px 7px;border-radius:3px;border:1px solid var(--borderG);background:rgba(70,44,4,.35);color:var(--gold);cursor:pointer;font-family:inherit;transition:all .12s}
.dbtn:hover{background:rgba(110,70,8,.5);border-color:var(--gold)}
.dbtn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}

/* ── deck/trash mini cards in hand-area ── */
.hand-decks{display:flex;gap:6px;align-items:flex-start;flex-shrink:0;padding:2px 0}
.deck-mini{
  width:72px;height:90px;border-radius:6px;border:1px solid var(--borderG);
  background:rgba(255,248,220,.7);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;cursor:pointer;transition:all .15s;flex-shrink:0;
  position:relative;user-select:none;
}
.deck-mini.clickable:hover{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 6px 14px var(--shadow)}
.deck-mini.disabled-deck{opacity:.6;cursor:not-allowed}
.deck-mini .dm-label{font-size:9px;color:#1a1008;letter-spacing:.5px;font-weight:700}
.deck-mini .dm-count{font-size:20px;font-weight:bold;color:#1a1008}
.deck-mini .dm-icon{font-size:18px}
.deck-mini.ing-deck{border-color:rgba(14,72,152,.5);background:rgba(220,235,255,.7)}
.deck-mini.ing-deck .dm-label{color:#0a3060}
.deck-mini.rec-deck{border-color:rgba(152,60,14,.5);background:rgba(255,230,210,.7)}
.deck-mini.rec-deck .dm-label{color:#700808}
.deck-mini.trash-pile{border-color:rgba(140,100,40,.4);background:rgba(255,248,220,.7)}
.deck-mini.trash-pile .dm-label{color:#3a2010}
.deck-mini.clickable.ing-deck:hover{border-color:rgba(14,72,152,.7);box-shadow:0 6px 14px rgba(14,72,152,.2)}
.deck-mini.clickable.rec-deck:hover{border-color:rgba(152,60,14,.7);box-shadow:0 6px 14px rgba(152,60,14,.2)}
/* ごみ箱モーダル */
.trash-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;display:flex;align-items:center;justify-content:center}
.trash-modal{background:var(--bg2);border:1px solid var(--border);border-radius:10px;width:560px;max-width:90vw;max-height:75vh;display:flex;flex-direction:column;overflow:hidden}
.trash-modal-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border)}
.trash-modal-header h3{font-size:14px;color:var(--goldL);letter-spacing:1px}
.trash-modal-close{background:transparent;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;padding:0 4px}
.trash-modal-close:hover{color:var(--text)}
.trash-modal-body{padding:12px;overflow-y:auto;display:flex;flex-wrap:wrap;gap:8px}
.trash-card-item{
  width:110px;border-radius:7px;border:1px solid var(--border);
  background:var(--bg3);padding:8px;display:flex;flex-direction:column;gap:3px;
  cursor:pointer;transition:border-color .15s;
}
.trash-card-item:hover{border-color:var(--muted)}
.trash-card-item .ti-type{font-size:9px;color:var(--muted)}
.trash-card-item .ti-name{font-size:11px;font-weight:bold;color:var(--text);line-height:1.3}
.trash-card-item .ti-sat{font-size:13px;color:var(--gold);font-weight:bold}
.trash-modal-empty{padding:24px;color:var(--faint);font-size:12px;text-align:center;width:100%}

/* ── ANIMATIONS ── */
/* 料理完成オーバーレイ */
.serve-overlay{position:fixed;inset:0;z-index:400;pointer-events:none;display:flex;align-items:center;justify-content:center}
.serve-burst{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  animation:servePop 1.35s cubic-bezier(.17,.67,.35,1.3) forwards;
}
@keyframes servePop{
  0%{transform:scale(0) rotate(-12deg);opacity:0}
  40%{transform:scale(1.18) rotate(3deg);opacity:1}
  65%{transform:scale(0.96) rotate(-1deg)}
  80%{transform:scale(1.04) rotate(0deg);opacity:1}
  100%{transform:scale(1) rotate(0deg);opacity:0}
}
.serve-card-big{
  width:200px;background:linear-gradient(135deg,#3a1a06,#5a2e0e);
  border:2px solid var(--gold);border-radius:14px;padding:18px 14px;
  box-shadow:0 0 60px rgba(224,184,96,.7),0 0 120px rgba(224,184,96,.3);
  text-align:center;
}
.serve-card-big .sc-label{font-size:11px;color:var(--muted);letter-spacing:2px;margin-bottom:6px}
.serve-card-big .sc-name{font-size:22px;font-weight:bold;color:#fff8e8;line-height:1.3;margin-bottom:8px}
.serve-card-big .sc-sat{font-size:40px;font-weight:bold;color:var(--goldL);line-height:1}
.serve-card-big .sc-img-wrap{width:160px;height:120px;border-radius:8px;overflow:hidden;margin-bottom:8px;border:2px solid rgba(255,255,255,.3);flex-shrink:0;position:relative;background:rgba(0,0,0,.2)}
.serve-card-big .sc-icon{font-size:48px;margin-bottom:6px}
.serve-ribbon{font-size:18px;font-weight:bold;color:#fff;background:linear-gradient(90deg,#c84020,#e86030);padding:6px 24px;border-radius:20px;letter-spacing:2px;box-shadow:0 4px 16px rgba(200,64,32,.5)}

/* ダメージ数字 */
.damage-num{
  position:fixed;font-size:52px;font-weight:bold;pointer-events:none;z-index:450;
  text-shadow:0 0 20px currentColor,0 2px 6px rgba(0,0,0,.8);
  animation:dmgFloat 1.1s ease-out forwards;
}
@keyframes dmgFloat{
  0%{transform:translateY(0) scale(.6);opacity:0}
  20%{transform:translateY(-10px) scale(1.2);opacity:1}
  60%{transform:translateY(-60px) scale(1);opacity:1}
  100%{transform:translateY(-110px) scale(.9);opacity:0}
}

/* ドローアニメ */
.draw-flash{
  position:fixed;inset:0;z-index:350;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
}
.draw-card-anim{
  width:102px;height:123px;border-radius:8px;
  border:2px solid var(--gold);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:8px;text-align:center;
  animation:drawSlide .5s cubic-bezier(.25,.46,.45,.94) forwards;
}
@keyframes drawSlide{
  0%{transform:translateY(160px) scale(.7);opacity:0;box-shadow:0 0 0 transparent}
  60%{transform:translateY(-16px) scale(1.05);opacity:1;box-shadow:0 0 40px rgba(224,184,96,.6)}
  100%{transform:translateY(0) scale(1);opacity:0;box-shadow:0 0 0 transparent}
}
.draw-card-anim.ing{background:linear-gradient(135deg,#0e2a3a,#1a3a4a)}
.draw-card-anim.rec{background:linear-gradient(135deg,#2a140a,#3a200e)}
.draw-card-anim.hidden{background:repeating-linear-gradient(45deg,#16100a 0,#16100a 8px,#1a1409 8px,#1a1409 16px);border-color:var(--borderG)}

/* 勝利画面強化 */
.winner-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:400;animation:winFadeIn .6s ease-out}
@keyframes winFadeIn{from{opacity:0}to{opacity:1}}
.winner-particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.winner-particle{
  position:absolute;border-radius:50%;
  animation:partFloat linear forwards;
}
@keyframes partFloat{
  0%{transform:translateY(100vh) rotate(0deg);opacity:1}
  100%{transform:translateY(-20vh) rotate(720deg);opacity:0}
}
.winner-title{
  font-size:96px;font-weight:900;
  color:#ffffff;
  letter-spacing:6px;text-align:center;
  text-shadow:
    -3px -3px 0 #000,
     3px -3px 0 #000,
    -3px  3px 0 #000,
     3px  3px 0 #000,
     0    0   20px rgba(255,220,80,.8),
     0    0   50px rgba(255,180,40,.4);
  animation:winPop .8s cubic-bezier(.17,.67,.35,1.4) .2s both;
}
@keyframes winPop{
  0%{transform:scale(0);opacity:0}
  70%{transform:scale(1.15)}
  100%{transform:scale(1);opacity:1}
}
.winner-sub{
  font-size:26px;font-weight:800;
  color:#ffffff;
  letter-spacing:3px;text-align:center;
  text-shadow:
    -2px -2px 0 #000,
     2px -2px 0 #000,
    -2px  2px 0 #000,
     2px  2px 0 #000,
     0    0   12px rgba(0,0,0,.8);
  animation:winFadeIn .6s ease-out .5s both;
}
.winner-btns{display:flex;gap:10px;margin-top:12px;animation:winFadeIn .6s ease-out .8s both}
@media (max-width:500px),(max-height:500px){
  .winner-title{font-size:64px;letter-spacing:3px}
  .winner-sub{font-size:17px;letter-spacing:1px;padding:0 16px}
}

/* ── カード配置アニメ ── */
.place-anim-overlay{position:fixed;inset:0;z-index:380;pointer-events:none;}
.place-card-fly{
  position:fixed;z-index:381;pointer-events:none;
  width:72px;height:88px;border-radius:6px;
  border:2px solid var(--gold);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:4px;text-align:center;
  box-shadow:0 0 24px rgba(224,184,96,.6);
  font-size:11px;color:#fff8e8;font-weight:bold;
  background:linear-gradient(135deg,#1a3a2a,#2a4a3a);
  animation:flyToZone .45s cubic-bezier(.4,0,.2,1) forwards;
}
@keyframes flyToZone{
  0%{transform:scale(1.1);opacity:1}
  60%{transform:scale(.85);opacity:.9}
  100%{transform:scale(.8);opacity:0}
}

/* ── ターン切り替えバナー ── */
.turn-banner{
  position:fixed;inset:0;z-index:390;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
}
.turn-banner-inner{
  padding:16px 48px;border-radius:12px;
  font-size:28px;font-weight:bold;letter-spacing:4px;
  border:2px solid var(--gold);
  box-shadow:0 0 40px rgba(224,184,96,.5),0 0 80px rgba(224,184,96,.2);
  animation:bannerSlide .9s cubic-bezier(.22,.61,.36,1) forwards;
}
.turn-banner-inner.my-turn{
  background:linear-gradient(135deg,rgba(15,45,15,.9),rgba(20,60,20,.9));
  color:#e8ffe8;border-color:#40c870;text-shadow:0 1px 3px rgba(0,0,0,.5);
  box-shadow:0 0 40px rgba(96,208,168,.5);
}
.turn-banner-inner.opp-turn{
  background:linear-gradient(135deg,rgba(50,15,15,.9),rgba(70,20,20,.9));
  color:#ffe8e8;border-color:#e04030;text-shadow:0 1px 3px rgba(0,0,0,.5);
  box-shadow:0 0 40px rgba(208,112,96,.5);
}
@keyframes bannerSlide{
  0%{transform:translateX(-60px) scale(.9);opacity:0}
  25%{transform:translateX(8px) scale(1.02);opacity:1}
  60%{transform:translateX(0) scale(1);opacity:1}
  80%{transform:translateX(0) scale(1);opacity:1}
  100%{transform:translateX(60px) scale(.9);opacity:0}
}

// ── 解像度に応じた動的スケーリング ──
function applyResponsiveLayout(){
  const w=window.innerWidth;
  const h=window.innerHeight;
  const root=document.documentElement;
  const headerH=Math.max(36,Math.min(48,h*0.05));
  const bottomH=Math.max(44,Math.min(64,h*0.065));
  const centerW=Math.max(180,Math.min(260,w*0.17));
  const scale=Math.min(1,Math.max(0.7,h/900));
  root.style.setProperty('--header-h',`${headerH}px`);
  root.style.setProperty('--bottom-h',`${bottomH}px`);
  root.style.setProperty('--center-w',`${centerW}px`);
  root.style.setProperty('--card-scale',`${scale}`);
  root.style.setProperty('--ing-card-w',`${Math.round(72*scale)}px`);
  root.style.setProperty('--ing-card-h',`${Math.round(88*scale)}px`);
  root.style.setProperty('--hcard-w',`${Math.round(102*scale)}px`);
  root.style.setProperty('--hcard-h',`${Math.round(123*scale)}px`);
}
applyResponsiveLayout();
window.addEventListener('resize',applyResponsiveLayout);

// ── 環境初期化（NW.js / Electron 両対応） ──
if(typeof nw!=='undefined'){
  // NW.jsはframe:trueでOSネイティブタイトルバーを使用
  // electron-modeクラスは付けない（calc(100vh - 32px)が適用されるため）
  // カスタムタイトルバーも不要
}else if(window.electronAPI){
  document.body.classList.add('electron-mode');
  if(window.electronAPI.platform!=='darwin'){
    document.getElementById('electron-titlebar').style.display='flex';
  }
  window.electronAPI.onMenuAction(action=>{
    if(action==='gotoTitle') window.__gotoTitle&&window.__gotoTitle();

}

// プラットフォーム判定
const PLATFORM=(()=>{
  const ua=navigator.userAgent||'';
  if(/android/i.test(ua))return 'android';
  if(/iphone|ipad|ipod/i.test(ua))return 'ios';
  if(/win/i.test(navigator.platform||ua))return 'windows';
  if(/mac/i.test(navigator.platform||ua))return 'mac';
  return 'other';
})();

// デッキ構築カード用長押しタイマー（クロージャ問題を避けるためモジュールレベルで管理）
let _spDbLpTimer=null;

// 長押しイベントハンドラー生成
// onLongPress: 長押し時, onTap: タップ時（省略可）, threshold: ms
function makeLongPress(onLongPress, onTap, threshold=480){
  let timer=null, moved=false, startX=0, startY=0;
  return {
    onTouchStart(e){
      moved=false;
      const t=e.touches[0];
      startX=t.clientX; startY=t.clientY;
      timer=setTimeout(()=>{
        if(!moved){
          if(navigator.vibrate)navigator.vibrate(30);
          onLongPress(e);
          timer=null;
        }
      },threshold);
    },
    onTouchMove(e){
      const t=e.touches[0];
      if(Math.abs(t.clientX-startX)>8||Math.abs(t.clientY-startY)>8){
        moved=true;
        if(timer){clearTimeout(timer);timer=null;}
      }
    },
    onTouchEnd(e){
      if(timer){clearTimeout(timer);timer=null;if(!moved&&onTap)onTap(e);}
    },
    onTouchCancel(){if(timer){clearTimeout(timer);timer=null;}}
  };
}

// GAME ENGINE
// ============================================================
const uid=()=>Math.random().toString(36).slice(2,8);
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]];}return b;};
const addLog=(G,msg,type='n')=>({...G,log:[{msg,type,id:uid()},...G.log].slice(0,50)});
const ovP=(G,pi,u)=>{const pl=[...G.players];pl[pi]={...pl[pi],...u};return{...G,players:pl};};
const mkI=def=>({...def,_uid:def.id+'_'+uid(),_isRec:false,_used:false});
const mkR=def=>({...def,_uid:def.id+'_r'+uid(),_isRec:true});

function buildDeckFromCfg(ic,rc){
  const i=[];Object.entries(ic).forEach(([id,n])=>{const d=ING_MAP[id];if(d)for(let k=0;k<n;k++)i.push(mkI(d));});
  const r=[];Object.entries(rc).forEach(([id,n])=>{const d=REC_MAP[id];if(d)for(let k=0;k<n;k++)r.push(mkR(d));});
  return{i:shuffle(i),r:shuffle(r)};
}

function buildRandom(){
  const preset=PRESET_DECKS[Math.floor(Math.random()*PRESET_DECKS.length)];
  return buildDeckFromCfg(preset.ingDeck,preset.recDeck);
}
function initPlayers(c0,c1){
  function mp(cfg){
    const {i,r}=cfg?buildDeckFromCfg(cfg.ingDeck,cfg.recDeck):buildRandom();
    return{ingDeck:i.slice(5),recDeck:r.slice(2),hand:[...i.slice(0,5),...r.slice(0,2)],
      ingZone:[],recZone:[],trash:[],satiety:0,bufNextRec:0,debuffs:{},revealed:false,activatedThisTurn:false};
  }
  return[mp(c0),mp(c1)];
}
// ============================================================
// デッキコードシステム（Base64エンコード、無期限）
// ============================================================
function encodeDeckCode(name, ingDeck, recDeck){
  const data={n:name,i:ingDeck,r:recDeck};
  try{
    return btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  }catch(e){return null;}
}
function decodeDeckCode(code){
  try{
    const data=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    if(!data.i||!data.r)return null;
    return {name:data.n||'インポートデッキ',ingDeck:data.i,recDeck:data.r};
  }catch(e){return null;}
}

  {id:'discard',title:'🗑️ Step5：廃棄フェーズ',
   body:'自分の手札か自分の食材ゾーンの中から、1枚カードをごみ箱に送ることができます。\n不要なカードがあれば、ごみ箱に送りましょう。\n\n👉「ターン終了」ボタンを押して次へ進みましょう。',
   highlight:'btn-end',action:'endturn',phase:'discard'},
  {id:'done',title:'🎉 チュートリアル完了！',
   body:'お疲れ様でした！基本操作をマスターしました。\n\n実際の対戦では：\n・食材35種・レシピ50種のカードを使ってデッキを自由に構築！\n・クイックスタートでAIと対戦可能！\n・ルームマッチやランダムマッチで他のユーザーと対戦可能！\n\nさっそく対戦を始めてみましょう！',
   highlight:null,action:'finish'},
];

const TUTORIAL_ING_DECK=['rice','rice','rice','rice','nori','nori','nori','nori',
  'egg','egg','egg','egg','onion','onion','onion','onion',
  'carrot','carrot','carrot','carrot','cabbage','cabbage','cabbage','cabbage',
  'tomato','tomato','tomato','tomato','potato','potato'];
const TUTORIAL_REC_DECK=['onigiri','onigiri','onigiri','onigiri','tkgr','tkgr','tkgr',
  'yasaiSalad','yasaiSalad','yasaiSalad','oyakodon','oyakodon','omelet','omelet','omelet'];

function TutorialScreen({onBack}){
  const [step,setStep]=useState(0);
  const [G,setG]=useState(null);
  const [selH,setSelH]=useState(null);
  const [selZ,setSelZ]=useState([]);
  const [msg,setMsg]=useState('');
  const [stepDone,setStepDone]=useState(false);
  const msgTimer=useRef(null);
  const pid=0;
  // スマホ用state/ref（PC版でも宣言が必要）
  const tutDragRef=useRef(null);
  const tutMovedRef=useRef(false);
  const tutIngRef=useRef(null);
  const tutHandRef=useRef(null);
  const [tutDragging,setTutDragging]=useState(null);
  const [tutDetailCard,setTutDetailCard]=useState(null);
  const [serveAnim,setServeAnim]=useState(null);
  function fireServe(rec){
    setServeAnim({name:rec.name,sat:rec.sat,icon:rec.icon||'🍽️',id:rec.id});
    setTimeout(()=>setServeAnim(null),1500);
  }

  function showMsg(m){
    setMsg(m);clearTimeout(msgTimer.current);
    msgTimer.current=setTimeout(()=>setMsg(''),2500);
  }

  useEffect(()=>{
    const mk=id=>{const d=ING_MAP[id]||REC_MAP[id];return d?(d.sat!==undefined?mkR(d):mkI(d)):null;};
    const myHand=['rice','rice','nori','nori','egg','onigiri','onigiri'].map(mk).filter(Boolean);
    const myIngDeck=['rice','rice','nori','nori','nori','egg','egg','egg',
      'onion','onion','onion','onion','carrot','carrot','carrot','carrot',
      'cabbage','cabbage','cabbage','cabbage','tomato','tomato','tomato','tomato','potato','potato']
      .map(id=>{const d=ING_MAP[id];return d?mkI(d):null;}).filter(Boolean);
    const myRecDeck=['onigiri','onigiri','tkgr','tkgr','tkgr',
      'yasaiSalad','yasaiSalad','yasaiSalad','oyakodon','oyakodon','omelet','omelet','omelet']
      .map(id=>{const d=REC_MAP[id];return d?mkR(d):null;}).filter(Boolean);
    const aiHand=['tomato','tomato','carrot','carrot','chicken','oyakodon','yasaiSalad'].map(mk).filter(Boolean);
    const aiIngDeck=['tomato','tomato','onion','onion','onion','onion',
      'carrot','carrot','egg','egg','egg','egg',
      'chicken','chicken','chicken','chicken','potato','potato','potato','potato',
      'broccoli','broccoli','broccoli','broccoli','garlic','garlic']
      .map(id=>{const d=ING_MAP[id];return d?mkI(d):null;}).filter(Boolean);
    const aiRecDeck=['oyakodon','oyakodon','oyakodon','yasaiSalad','yasaiSalad',
      'yasaiSalad','curryRice','curryRice','curryRice','germanPotato','germanPotato','omelet','omelet','omelet']
      .map(id=>{const d=REC_MAP[id];return d?mkR(d):null;}).filter(Boolean);
    const mkP=(hand,ingDeck,recDeck)=>({
      hand,ingDeck,recDeck,ingZone:[],recZone:[],trash:[],satiety:0,bufNextRec:0,debuffs:{},
      revealed:false,activatedThisTurn:false,servedLastTurn:false,
    });
    setG({players:[mkP(myHand,myIngDeck,myRecDeck),mkP(aiHand,aiIngDeck,aiRecDeck)],
      currentPlayer:0,phase:'draw',turn:1,firstTurn:true,winner:null,log:[],pending:null});
  },[]);

  const cur=TUTORIAL_STEPS[step];
  function nextStep(){setStep(s=>Math.min(s+1,TUTORIAL_STEPS.length-1));setStepDone(false);setSelH(null);setSelZ([]);}

  function clickDeck(){
    if(!G||step===0||stepDone)return;
    if(cur.phase!=='draw')return;
    setG(prev=>({...drawI(prev,pid,1),phase:'place'}));
    setStepDone(true);showMsg('ドロー完了！');
  }

  function clickHand(c){
    if(!G)return;
    const curPhase=cur.phase||G.phase;
    if(curPhase==='place'&&!c._isRec){
      if(G.players[pid].ingZone.length>=7){showMsg('食材ゾーンは最大7枚！');return;}
      setG(prev=>{
        const newZone=[...prev.players[pid].ingZone,{...c,_satBuff:0,_used:false,_placedThisTurn:true}];
        const newG=addLog(ovP(prev,pid,{hand:prev.players[pid].hand.filter(x=>x._uid!==c._uid),ingZone:newZone}),`${c.name}を配置`);
        const zoneIds=newZone.map(z=>z.id);
        if(step===2&&zoneIds.includes('rice')&&zoneIds.includes('nori')){
          setStepDone(true);showMsg('お米と海苔を配置しました！「次へ」を押してください');
        } else if(step===2){
          showMsg(`${c.name}を配置！（お米と海苔の両方を置いてください）`);
        } else {
          setStepDone(true);showMsg(`${c.name}を配置！`);
        }
        return newG;
      });return;
    }
    if(curPhase==='serve'&&c._isRec){setSelH(c._uid);setSelZ([]);return;}
  }

  function clickZone(c){
    if(!G)return;
    const curPhase=cur.phase||G.phase;
    if(step===2&&curPhase==='place'){
      setG(prev=>{
        const newZone=prev.players[pid].ingZone.filter(x=>x._uid!==c._uid);
        const newG=addLog(ovP(prev,pid,{ingZone:newZone,hand:[...prev.players[pid].hand,{...c,_placedThisTurn:false}]}),`${c.name}を手札に戻した`);
        const zoneIds=newZone.map(z=>z.id);
        if(!(zoneIds.includes('rice')&&zoneIds.includes('nori')))setStepDone(false);
        return newG;
      });showMsg(`${c.name}を手札に戻しました`);return;
    }
    if(curPhase==='activate'&&!c._used&&ING_FN[c.id]){
      const iz=G.players[pid].ingZone.map(x=>x._uid===c._uid?{...x,_used:true}:x);
      let s=ovP(G,pid,{ingZone:iz,activatedThisTurn:true});
      try{s=ING_FN[c.id](s,pid,c);}catch(e){}
      setG(s);setStepDone(true);showMsg(`${c.name}の効果を発動！`);return;
    }
    if(curPhase==='serve'&&selH){
      const rec=G.players[pid].hand.find(x=>x._uid===selH);if(!rec)return;
      if(selZ.includes(c._uid)){setSelZ(prev=>prev.filter(u=>u!==c._uid));return;}
      // 必要食材と一致するカードのみ選択可能
      const alreadyUsed=selZ.map(uid=>G.players[pid].ingZone.find(z=>z._uid===uid)?.id).filter(Boolean);
      const remaining=rec.req.filter(r=>{const i=alreadyUsed.indexOf(r);if(i>=0){alreadyUsed.splice(i,1);return false;}return true;});
      if(!remaining.includes(c.id)){showMsg(`${c.name}はこのレシピに必要ありません`);return;}
      if(selZ.length<rec.req.length){
        const nz=[...selZ,c._uid];setSelZ(nz);
        if(nz.length===rec.req.length){
          const after=serveRecipe(G,pid,selH,nz);
          setG(after);setSelH(null);setSelZ([]);
          fireServe(rec);
          setStepDone(true);showMsg('料理完成！相手の満腹度が上がりました！');
        }
      }
    }
  }

  function doEndTurn(){
    if(!G)return;
    let s=endTurn(G);s=aiTurn(s,1,'easy');s=endTurn(s);
    setG(s);setStepDone(true);showMsg('ターン終了！');
  }

  if(!G)return h('div',{className:'title-screen'},h('div',{className:'logo'},h('h1',null,'📖 チュートリアル'),h('div',{className:'logo-en'},'読み込み中...')));

  const p=G.players[pid];
  const selRec=selH&&p.hand.find(x=>x._uid===selH);
  const needed=selRec?selRec.req:[];

  // ── スマホ版チュートリアル ──
  if(isMobile()&&window.innerHeight>window.innerWidth){
    // ドラッグ&ドロップ用関数
    function tutTouchStart(e,card){
      tutMovedRef.current=false;
      const t=e.touches[0];
      tutDragRef.current={card,moved:false,startX:t.clientX,startY:t.clientY,ghost:null};
      if(!card._isRec&&(cur.phase==='place'||G.phase==='place'))setTutDragging(card._uid);
    }
    function tutIngTouchStart(e,card){
      e.stopPropagation();
      tutMovedRef.current=false;
      const t=e.touches[0];
      tutDragRef.current={card,moved:false,startX:t.clientX,startY:t.clientY,ghost:null,source:'zone'};
    }
    function tutTouchMove(e){
      const dr=tutDragRef.current;
      if(!dr)return;
      e.preventDefault();
      const t=e.touches[0];
      if(!dr.moved&&(Math.abs(t.clientX-dr.startX)>8||Math.abs(t.clientY-dr.startY)>8)){
        dr.moved=true;tutMovedRef.current=true;
        let ghost=document.getElementById('sp-drag-ghost');
        if(!ghost){ghost=document.createElement('div');ghost.id='sp-drag-ghost';ghost.className='sp-drag-ghost';document.body.appendChild(ghost);}
        ghost.textContent=dr.card.name;ghost.style.display='block';dr.ghost=ghost;
      }
      if(dr.moved&&dr.ghost){dr.ghost.style.left=t.clientX+'px';dr.ghost.style.top=t.clientY+'px';}
      const zone=tutIngRef.current;
      const hand=tutHandRef.current;
      if(dr.moved){
        if(zone&&!dr.source){const r=zone.getBoundingClientRect();zone.classList.toggle('drop-target',t.clientX>=r.left&&t.clientX<=r.right&&t.clientY>=r.top&&t.clientY<=r.bottom);}
        if(hand&&dr.source==='zone'){const r=hand.getBoundingClientRect();hand.classList.toggle('drop-target',t.clientX>=r.left&&t.clientX<=r.right&&t.clientY>=r.top&&t.clientY<=r.bottom);}
      }
    }
    function tutTouchEnd(e){
      const dr=tutDragRef.current;
      if(!dr)return;
      if(dr.ghost)dr.ghost.style.display='none';
      const zone=tutIngRef.current;
      const hand=tutHandRef.current;
      if(zone)zone.classList.remove('drop-target');
      if(hand)hand.classList.remove('drop-target');
      const t=e.changedTouches[0];
      if(dr.moved){
        if(!dr.source&&zone){
          const r=zone.getBoundingClientRect();
          if(t.clientX>=r.left&&t.clientX<=r.right&&t.clientY>=r.top&&t.clientY<=r.bottom)clickHand(dr.card);
        } else if(dr.source==='zone'&&hand){
          const r=hand.getBoundingClientRect();
          if(t.clientX>=r.left&&t.clientX<=r.right&&t.clientY>=r.top&&t.clientY<=r.bottom)clickZone(dr.card);
        }
      } else {
        setTutDetailCard(dr.card);
      }
      tutDragRef.current=null;
      setTutDragging(null);
    }

    const satPct=Math.min(100,p.satiety/20*100);
    const aiSatPct=Math.min(100,G.players[1].satiety/20*100);

    return h('div',{className:'sp-tut',onTouchMove:tutTouchMove,onTouchEnd:tutTouchEnd},

      // ── 相手エリア（ゲーム画面と同様） ──
      h('div',{className:'sp-hand-row',style:{background:'rgba(220,210,255,.45)',borderTop:'none',borderBottom:'1px solid rgba(120,80,160,.2)'}},
        Array.from({length:10},(_,i)=>
          i<G.players[1].hand.length
            ? h('div',{key:i,className:'sp-hcard back'})
            : h('div',{key:i,className:'sp-hand-empty'})
        )
      ),
      h('div',{className:'sp-area sp-area-opp',style:{flex:'none'}},
        h('div',{className:'sp-info-row'},
          h('span',{className:'sp-player-label'},'🤖 AI'),
          h('div',{className:'sp-deck-badges'},
            h('span',{className:'sp-deck-btn'},`🥕 ${Array.isArray(G.players[1].ingDeck)?G.players[1].ingDeck.length:0}`),
            h('span',{className:'sp-deck-btn'},`📖 ${Array.isArray(G.players[1].recDeck)?G.players[1].recDeck.length:0}`),
            h('span',{className:'sp-deck-btn'},`🗑 ${G.players[1].trash.length}`)
          )
        ),
        h('div',{className:'sp-sat-row'},
          h('div',{className:'sp-sat-track'},h('div',{className:`sp-sat-fill${aiSatPct>=80?' danger':aiSatPct>=50?' warn':''}`,style:{width:aiSatPct+'%'}})),
          h('span',{className:'sp-sat-num',style:{color:G.players[1].satiety>=16?'#c01818':G.players[1].satiety>=10?'#a03010':'var(--goldD)'}},`${G.players[1].satiety}/20`)
        ),
        h('div',{className:'sp-zone-header'},
          h('span',{className:'sp-zone-label'},'🌾 食材ゾーン'),
          h('span',{className:'sp-zone-count'},`${G.players[1].ingZone.length}/7`)
        ),
        h('div',{className:'sp-ing-zone'},
          G.players[1].ingZone.map(c=>h('div',{key:c._uid,className:`sp-sml-card ${c.cat||''}`},
            h('div',{className:'smc-img'},h(CardImg,{id:c.id,style:{width:'100%',height:'100%',objectFit:'cover'}})),
            h('div',{className:'smc-name'},c.name)
          )),
          Array.from({length:Math.max(0,7-G.players[1].ingZone.length)},(_,i)=>
            h('div',{key:'eta'+i,className:'sp-ing-slot-empty'})
          )
        ),
        h('div',{className:'sp-zone-header',style:{marginTop:'3px'}},
          h('span',{className:'sp-zone-label'},'🍽 完成料理'),
          h('span',{className:'sp-zone-count'},`${G.players[1].recZone.length}枚`)
        ),
        h('div',{className:'sp-rec-zone'},
          G.players[1].recZone.length===0
            ? h('span',{style:{fontSize:'9px',color:'rgba(80,60,20,.3)',fontStyle:'italic'}},'なし')
            : G.players[1].recZone.map(r=>h('div',{key:r._uid,className:'sp-rec-card'},
                h('div',{className:'rn'},r.name),h('div',{className:'rs'},`+${r.sat}`)
              ))
        )
      ),

      // 説明パネル（固定150px）
      h('div',{className:'sp-tut-panel'},
        h('div',{className:'sp-tut-progress'},
          TUTORIAL_STEPS.map((_,i)=>h('div',{key:i,className:'sp-tut-prog-dot',style:{background:i<=step?'var(--goldD)':'rgba(0,0,0,.15)'}}))
        ),
        h('div',{className:'sp-tut-title'},`Step ${step+1}/${TUTORIAL_STEPS.length}　${cur.title}`),
        h('div',{className:'sp-tut-body'},
          cur.body
            .replace(/クリックして食材ゾーンに配置/g,'ドラッグ＆ドロップして食材ゾーンに配置')
            .replace(/置いたカードをクリックすると手札に戻せます/g,'配置したカードを手札エリアにドラッグすると手札に戻せます')
        ),
        selRec&&h('div',{className:'sp-tut-req'},`必要: ${selRec.req.map(r=>ING_MAP[r]?.name||r).join(' + ')} (${selZ.length}/${needed.length}枚選択中)`),
        h('div',{className:'sp-tut-btns'},
          cur.action==='finish'
            ? h('button',{className:'btn primary',onClick:onBack,style:{fontSize:'12px',padding:'6px 12px'}},'✅ 対戦を始めよう！')
            : h(React.Fragment,null,
                (stepDone||cur.action===null)&&h('button',{className:'btn primary',onClick:nextStep,style:{fontSize:'12px',padding:'6px 12px'}},'次へ →'),
                cur.action==='endturn'&&h('button',{className:'btn',onClick:doEndTurn,style:{fontSize:'11px',padding:'5px 10px'}},'⏩ ターン終了')
              ),
          h('button',{className:'btn sm danger',onClick:onBack,style:{fontSize:'10px',padding:'4px 8px'}},'✕ 中断')
        )
      ),

      // 自分エリア
      h('div',{className:'sp-tut-self'},
        // 食材ゾーン（ドロップターゲット）
        h('div',{className:'sp-zone-header'},
          h('span',{className:'sp-zone-label'},'🌾 食材ゾーン'),
          h('span',{className:'sp-zone-count'},`${p.ingZone.length}/7`)
        ),
        h('div',{ref:tutIngRef,className:'sp-ing-zone'},
          p.ingZone.map(c=>{
            const isSel=selZ.includes(c._uid);
            const lp=makeLongPress(()=>setTutDetailCard(c),()=>clickZone(c));
            return h('div',{key:c._uid,
              className:`sp-sml-card ${c.cat||''}${isSel?' sel':''}`,
              ...lp,
              onTouchStart:e=>{tutIngTouchStart(e,c);lp.onTouchStart(e);}},
              h('div',{className:'smc-img'},h(CardImg,{id:c.id,style:{width:'100%',height:'100%',objectFit:'cover'}})),
              h('div',{className:'smc-name'},c.name)
            );
          }),
          Array.from({length:Math.max(0,7-p.ingZone.length)},(_,i)=>
            h('div',{key:'et'+i,className:'sp-ing-slot-empty'})
          )
        ),
        // 山札・満腹度
        h('div',{style:{display:'flex',gap:'5px',flexShrink:0,alignItems:'center',flexWrap:'wrap'}},
          h('div',{className:`sp-deck-btn ing${cur.phase==='draw'?' active':''}`,
            onClick:clickDeck},`🥕 ${p.ingDeck.length}`),
          h('div',{className:'sp-deck-btn'},`📖 ${p.recDeck.length}`),
          h('span',{style:{fontSize:'9px',color:'var(--muted)',flex:1,textAlign:'right'}},`満腹度: ${p.satiety}/20`)
        )
      ),

      // 手札（1行10枚）
      h('div',{ref:tutHandRef,className:'sp-hand-row'},
        p.hand.map(c=>{
          const isDragging=tutDragging===c._uid;
          const lp=makeLongPress(
            ()=>{if(!tutMovedRef.current)setTutDetailCard(c);},
            ()=>clickHand(c)
          );
          return h('div',{key:c._uid,
            className:`sp-hcard ${c._isRec?'sh-rec':'sh-ing'}${selH===c._uid?' sel':''}${isDragging?' dragging':''}`,
            onClick:()=>clickHand(c),
            onTouchStart:e=>{tutTouchStart(e,c);lp.onTouchStart(e);},
            onTouchMove:e=>lp.onTouchMove(e),
            onTouchEnd:e=>lp.onTouchEnd(e),
            onTouchCancel:lp.onTouchCancel},
            h('div',{className:'sh-img'},h(CardImg,{id:c.id,style:{width:'100%',height:'100%',objectFit:'cover'}})),
            h('div',{className:'sh-name'},c.name),
            c._isRec&&h('div',{className:'sh-sat'},`+${c.sat}`)
          );
        }),
        Array.from({length:Math.max(0,10-p.hand.length)},(_,i)=>h('div',{key:'e'+i,className:'sp-hand-empty'}))
      ),

      // オーバーレイ
      msg&&h('div',{className:'msg-toast'},msg),
      serveAnim&&h('div',{className:'serve-overlay'},h('div',{className:'serve-burst'},h('div',{className:'serve-ribbon'},'🍽️ 料理完成！'),h('div',{className:'serve-card-big'},h('div',{className:'sc-img-wrap'},h(CardImg,{id:serveAnim.id,style:{width:'100%',height:'100%',objectFit:'cover',borderRadius:'8px'}})),h('div',{className:'sc-label'},'レシピ'),h('div',{className:'sc-name'},serveAnim.name),h('div',{className:'sc-sat'},`+${serveAnim.sat}`)))),
      G.winner!=null&&h('div',{className:'winner-overlay'},
        h('div',{className:'winner-title'},G.winner===0?'🎉 勝利！':'😢 敗北...'),
        h('div',{className:'winner-sub'},G.winner===0?'お見事！チュートリアル完了！':'もう一度挑戦してみましょう！'),
        h('div',{className:'winner-btns'},h('button',{className:'btn primary',onClick:onBack,style:{color:'#fff',fontSize:'15px',padding:'10px 24px',fontWeight:'800'}},'タイトルへ戻る'))
      ),
      // カード詳細ボトムシート
      h('div',{className:`sp-detail-sheet${tutDetailCard?' open':''}`,onClick:e=>e.stopPropagation()},
        h('div',{className:'sp-sheet-header'},h('div',{className:'sp-sheet-handle'}),h('button',{className:'sp-sheet-close',onClick:()=>setTutDetailCard(null)},'✕')),
        h('div',{className:'sp-sheet-body'},tutDetailCard&&h(CardDetailPanel,{hovered:tutDetailCard,ingZone:p.ingZone}))
      ),
      tutDetailCard&&h('div',{style:{position:'fixed',inset:0,zIndex:199},onClick:()=>setTutDetailCard(null)})
    );
  }

  // PC版（既存）

  return h('div',{className:'game-screen',style:{position:'relative'}},
    h('div',{className:'g-header'},
      h('div',{className:'sat-bar-left'},
        h('span',{className:'sat-label'},'👤 あなた'),
        h('div',{className:'sat-track'},h('div',{className:'sat-fill p0',style:{width:`${p.satiety/20*100}%`}})),
        h('span',{className:'sat-num',style:{color:'var(--goldD)'}},[p.satiety,'/20'])
      ),
      h('div',{className:'g-header-center'},
        h('div',{className:'g-title'},'📖 チュートリアル'),
        h('div',{className:'phase-badge'},[`Step ${step+1}/${TUTORIAL_STEPS.length}`])
      ),

const Audio={
  _bgm:null,_vol:0.5,_seVol:0.7,_muted:false,
  _seCache:{},
  se(name){
    if(this._muted)return;
    const path=`sounds/${name}.mp3`;
    let a=this._seCache[name];
    if(!a){a=new window.Audio(path);this._seCache[name]=a;}
    else{a.currentTime=0;}
    a.volume=this._seVol;
    a.play().catch(()=>{});
  },
  playBgm(name){
    if(this._bgm){this._bgm.pause();this._bgm=null;}
    if(this._muted)return;
    const a=new window.Audio(`sounds/${name}.mp3`);
    a.loop=true;a.volume=this._vol;
    a.play().catch(()=>{});
    this._bgm=a;
  },
  stopBgm(){if(this._bgm){this._bgm.pause();this._bgm=null;}},
  setMute(m){
    this._muted=m;
    if(m&&this._bgm)this._bgm.pause();
    else if(!m&&this._bgm)this._bgm.play().catch(()=>{});
  },
  setBgmVol(v){this._vol=v;if(this._bgm)this._bgm.volume=v;},
  setSeVol(v){this._seVol=v;},
};
